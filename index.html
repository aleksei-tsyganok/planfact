<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Кассовый план</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0e0e10;
  --s1:#111214;--s2:#18191c;--s3:#1f2023;--s4:#26272b;--s5:#2e2f33;
  --brd:rgba(255,255,255,.07);--brd2:rgba(255,255,255,.13);--brd3:rgba(255,255,255,.2);
  --acc:#34c759;--acc-d:rgba(52,199,89,.15);--acc-m:rgba(52,199,89,.25);
  --blue:#1a6fb5;--blue-d:rgba(58,159,191,.12);
  --red:#ff453a;--red-d:rgba(255,69,58,.12);
  --amber:#ff9f0a;--amber-d:rgba(255,159,10,.12);
  --grn:#34c759;--grn-d:rgba(52,199,89,.12);
  --plan:#bf5af2;--plan-d:rgba(191,90,242,.12);
  --t1:#d4d2cc;--t2:#6a6864;--t3:#3e3c3a;--t4:#26272b;
  --r:10px;--rsm:7px;
  --f:system-ui,-apple-system,sans-serif;
  --shadow-sm:0 1px 4px rgba(0,0,0,.5);
  --shadow-md:0 4px 16px rgba(0,0,0,.6);
  --shadow-lg:0 12px 40px rgba(0,0,0,.7);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg);
  background-image:radial-gradient(ellipse at 20% 0%,rgba(142,68,199,.08) 0%,transparent 50%),radial-gradient(ellipse at 80% 100%,rgba(58,159,191,.07) 0%,transparent 50%);
  background-attachment:fixed;color:var(--t1);font-family:var(--f);font-size:13px;
  line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100dvh;
  overscroll-behavior:none;-webkit-tap-highlight-color:transparent;
}

/* ── TOPBAR ── */
.topbar{
  position:sticky;top:0;z-index:50;
  display:flex;align-items:center;gap:12px;padding:0 20px;height:48px;
  background:var(--bg);border-bottom:1px solid var(--brd);
}
.logo{
  font-size:15px;font-weight:800;letter-spacing:-.6px;
  background:linear-gradient(135deg,var(--acc) 0%,var(--blue) 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.logo span{-webkit-text-fill-color:var(--t3);font-weight:400;font-size:13px;letter-spacing:0}
.nav-tabs{display:flex;padding:0 4px;overflow-x:auto;scrollbar-width:none}
.nav-tabs::-webkit-scrollbar{display:none}
.ntab{padding:9px 14px;border:none;border-bottom:2px solid transparent;background:none;color:var(--t2);font-family:var(--f);font-size:13px;font-weight:500;cursor:pointer;transition:all .15s;white-space:nowrap}
.ntab:hover{color:var(--t1)}
.ntab.active{color:var(--t1);border-bottom-color:var(--acc)}
.sync-dot{width:6px;height:6px;border-radius:50%;background:var(--t3);flex-shrink:0;transition:background .3s}
.sync-dot.ok{background:var(--grn)}
.sync-dot.sync{background:var(--amber);animation:blink .9s ease-in-out infinite}
.sync-dot.err{background:var(--red)}
.tab-bar{
  position:fixed;bottom:0;left:0;right:0;z-index:100;
  height:calc(58px + env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom);
  display:none;align-items:stretch;
  background:var(--bg);
  border-top:1px solid var(--brd);
}
.tbb{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;border:none;background:none;color:var(--t3);cursor:pointer;
  font-family:var(--f);font-size:10px;font-weight:500;letter-spacing:.02em;
  padding:0;-webkit-tap-highlight-color:transparent;transition:color .15s;
}
.tbb.active{color:var(--acc)}
.tbb svg{flex-shrink:0}
.tbb.active svg{stroke:var(--acc)}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}


/* ── VIEWS ── */
.view{display:none;padding:24px 20px;max-width:1240px;margin:0 auto}
.view.active{display:block}
@media(max-width:599px){.view{padding:14px 12px}}

/* ── KPI GRID ── */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:10px;margin-bottom:24px}
.kpi{background:var(--s2);border:1px solid var(--brd);border-radius:10px;padding:11px 14px;position:relative;overflow:hidden;transition:border-color .2s}

.kpi::before{
  content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.06),transparent);
}
.kpi:hover{border-color:var(--brd2)}
.kpi-label{font-size:10px;color:var(--t2);margin-bottom:2px;font-weight:400}
.kpi-val{font-size:16px;font-weight:700;line-height:1.1}
.kpi-val.g{color:var(--grn)}.kpi-val.r{color:var(--red)}.kpi-val.a{color:var(--acc)}
.kpi-val.b{color:var(--blue)}.kpi-val.p{color:var(--plan)}.kpi-val.am{color:var(--amber)}
.kpi-sub{font-size:11px;color:var(--t3);margin-top:5px;font-weight:400}

/* ── FREE MONEY BAR ── */
.free-money-bar{
  display:flex;align-items:center;justify-content:space-between;
  border-radius:var(--r);padding:18px 22px;margin-bottom:24px;gap:16px;flex-wrap:wrap;
  background:var(--s2);border:1px solid var(--brd);
  box-shadow:var(--shadow-sm);
  position:relative;overflow:hidden;
}
.free-money-bar::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(45,212,160,.04) 0%,transparent 60%);
  pointer-events:none;
}
.fm-label{font-size:11px;color:var(--t3);font-weight:600;text-transform:uppercase;letter-spacing:.7px;margin-bottom:6px}
.fm-val{font-size:30px;font-weight:800;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.fm-val.ok{color:var(--acc)}.fm-val.warn{color:var(--amber)}.fm-val.bad{color:var(--red)}
.fm-desc{font-size:12px;color:var(--t3);margin-top:3px;font-weight:400}

/* ── SECTION HEAD ── */
.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.section-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.9px;color:var(--t3)}
.sec-action{
  background:none;border:none;color:var(--t3);font-size:12px;cursor:pointer;
  padding:4px 10px;border-radius:6px;font-family:var(--f);transition:all .12s;font-weight:500;
}
.sec-action:hover{background:var(--s3);color:var(--t1)}

/* ── ACCOUNTS ── */
.accounts-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:24px}
.acct-card{
  background:var(--s2);border:1px solid var(--brd);border-radius:var(--r);
  padding:14px 16px;cursor:pointer;
  transition:border-color .15s,transform .12s;
  box-shadow:var(--shadow-sm);
  -webkit-tap-highlight-color:transparent;
  position:relative;overflow:hidden;
}
.acct-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,var(--brd2),transparent);
}
.acct-card:hover{border-color:var(--brd2);transform:translateY(-1px);box-shadow:var(--shadow-md)}
.acct-card:active{transform:translateY(0)}
.acct-name{font-size:11px;font-weight:600;color:var(--t2);margin-bottom:8px;display:flex;align-items:center;gap:7px;letter-spacing:.01em}
.acct-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.acct-val{font-size:20px;font-weight:700;letter-spacing:-.3px;color:var(--t1);font-variant-numeric:tabular-nums}

/* ── CASHFLOW TABLE ── */
.cf-wrap{
  overflow-x:auto;border-radius:var(--r);border:1px solid var(--brd);
  margin-bottom:24px;background:var(--s1);box-shadow:var(--shadow-md);
}
.cf-table{border-collapse:collapse;min-width:100%;font-size:12px;font-variant-numeric:tabular-nums}
.cf-table th{
  background:rgba(17,21,32,0.98);
  border-bottom:1px solid var(--brd);border-right:1px solid var(--brd);
  padding:9px 12px;white-space:nowrap;font-weight:600;color:var(--t2);
  text-align:right;position:sticky;top:0;z-index:10;font-size:11px;letter-spacing:.02em;
}
.cf-table th:first-child{
  text-align:left;position:sticky;left:0;z-index:20;
  background:rgba(22,27,39,0.98);min-width:190px;
}
.cf-table th.today-col{
  background:rgba(45,212,160,.1)!important;
  color:var(--acc)!important;
  border-bottom:2px solid var(--acc)!important;
}
.cf-table td{
  border-right:1px solid var(--brd);border-bottom:1px solid rgba(255,255,255,.025);
  padding:8px 12px;text-align:right;vertical-align:middle;white-space:nowrap;
  font-size:12px;
}
.cf-table td:first-child{
  text-align:left;position:sticky;left:0;z-index:5;
  background:rgba(13,16,24,0.97);
  border-right:1px solid var(--brd);font-weight:500;padding:8px 12px;
}
.cf-table tr:hover td{background:rgba(255,255,255,.018)}
.cf-table tr:hover td:first-child{background:rgba(17,21,32,0.98)}
th.we-col{opacity:.55}
td.we-col{background:rgba(240,101,101,.012)!important}
td.today-col{
  background:rgba(45,212,160,.025)!important;
  border-left:1px solid rgba(45,212,160,.1)!important;
  border-right:1px solid rgba(45,212,160,.1)!important;
}
td.danger{color:var(--red)!important;font-weight:700}
td.warning{color:var(--amber)!important;font-weight:600}
tr.row-income td:first-child{color:var(--grn);font-weight:500}
tr.row-expense td:first-child{color:var(--red);font-weight:500}
tr.row-tax td:first-child{color:var(--amber);font-weight:500}
tr.row-balance td{font-weight:700;font-size:13px}
tr.row-balance td.danger{background:rgba(240,101,101,.06)!important}
tr.row-balance td.warning{background:rgba(232,172,58,.05)!important}
tr.row-balance td:first-child{color:var(--acc);font-size:11px;background:var(--s3)!important}
tr.row-section td{
  background:var(--s3)!important;
  font-size:10px;font-weight:700;text-transform:uppercase;
  letter-spacing:.9px;color:var(--t3);padding:10px 12px 5px;
}
tr.row-section td:first-child{background:var(--s4)!important}
tr.row-total td{
  border-top:1px solid var(--brd2);font-weight:700;
  background:rgba(255,255,255,.018)!important;
}
tr.row-total td:first-child{background:var(--s3)!important;color:var(--t2)}
.val-pos{color:var(--grn)}.val-neg{color:var(--red)}.val-zero{color:var(--t4)}

/* ── MONTH NAV ── */
.month-nav{display:none;align-items:center;gap:10px;margin-bottom:22px}
.mnav-btn{
  width:34px;height:34px;background:var(--s3);border:1px solid var(--brd);
  color:var(--t1);border-radius:var(--rsm);cursor:pointer;font-size:16px;
  display:flex;align-items:center;justify-content:center;
  transition:all .12s;flex-shrink:0;font-weight:600;
}
.mnav-btn:hover{background:var(--s4);border-color:var(--brd2)}
.month-label{font-size:20px;font-weight:800;color:var(--t1);letter-spacing:-.3px}
.month-sub{font-size:13px;color:var(--t3);margin-left:6px}

/* ── SETTINGS ── */
.settings-section{
  background:var(--s2);border:1px solid var(--brd);border-radius:var(--r);
  margin-bottom:20px;overflow:hidden;box-shadow:var(--shadow-sm);
}
.settings-section-title{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 18px;border-bottom:1px solid var(--brd);background:var(--s3);
}
.ss-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--t2)}
.ss-add-btn{
  background:var(--acc-d);border:1px solid rgba(45,212,160,.25);
  color:var(--acc);font-family:var(--f);font-size:12px;font-weight:600;
  padding:5px 12px;border-radius:6px;cursor:pointer;transition:all .12s;letter-spacing:.01em;
}
.ss-add-btn:hover{background:var(--acc-m)}

/* ── ITEM ROW ── */
.item-row{
  display:flex;align-items:center;gap:10px;padding:12px 18px;
  border-bottom:1px solid var(--brd);transition:background .1s;
}
.item-row:last-child{border-bottom:none}
.item-row:hover{background:rgba(255,255,255,.02)}
.item-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;cursor:pointer;transition:transform .1s}
.item-dot:hover{transform:scale(1.4)}
.item-dot-pvz{width:6px;height:6px;border-radius:50%;flex-shrink:0;cursor:pointer;transition:transform .1s;opacity:.6}
.item-dot-pvz:hover{transform:scale(1.4)}
.item-name{flex:1;font-size:13px;font-weight:500;color:var(--t1);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item-amount{font-size:13px;font-weight:600;min-width:90px;text-align:right;font-variant-numeric:tabular-nums}
.item-amount.inc{color:var(--grn)}.item-amount.exp{color:var(--red)}.item-amount.tax{color:var(--amber)}
.item-day-badge{
  background:var(--s3);border:1px solid var(--brd2);border-radius:6px;
  padding:3px 8px;font-size:11px;font-weight:600;color:var(--t2);white-space:nowrap;flex-shrink:0;
  cursor:pointer;transition:border-color .1s;
}
.item-day-badge:hover{border-color:var(--brd3);color:var(--t1)}
.item-repeat-badge{
  background:var(--plan-d);border:1px solid rgba(124,136,245,.2);border-radius:6px;
  padding:3px 8px;font-size:10px;font-weight:700;color:var(--plan);white-space:nowrap;flex-shrink:0;
  cursor:pointer;transition:all .1s;letter-spacing:.02em;text-transform:uppercase;
}
.item-repeat-badge:hover{background:rgba(124,136,245,.2)}
.item-edit{
  background:none;border:none;color:var(--t3);cursor:pointer;
  font-size:14px;padding:3px 7px;border-radius:6px;line-height:1;flex-shrink:0;
  font-family:var(--f);transition:all .1s;
}
.item-edit:hover{color:var(--t1);background:var(--s4)}
.auto-tag{
  background:var(--amber-d);border:1px solid rgba(232,172,58,.25);
  color:var(--amber);font-size:9px;font-weight:700;padding:2px 6px;border-radius:4px;
  white-space:nowrap;text-transform:uppercase;letter-spacing:.05em;
}

/* ── CARD TILES ── */
.cat-tile{
  display:flex;align-items:center;gap:10px;padding:12px 16px;
  cursor:pointer;user-select:none;border-bottom:none;
  position:relative;border-left:3px solid transparent;
  transition:background .12s;border-radius:10px;margin-bottom:8px;
  background:rgba(255,255,255,.03);border:1px solid var(--brd);
  border-left:3px solid transparent;
}
.cat-tile::before{content:'▶';font-size:8px;color:var(--t3);transition:transform .15s;flex-shrink:0}
.cat-tile.open::before{transform:rotate(90deg)}
.cat-tile:hover{background:rgba(255,255,255,.02)}
.cat-tile.inc{border-left:3px solid var(--grn)}
.cat-tile.exp{border-left:3px solid var(--red)}
.cat-tile.overdue-tile{box-shadow:inset 3px 0 0 var(--amber);background:rgba(251,191,36,0.06)!important}
.cat-tile.overdue-tile .ct-name{color:var(--amber)!important}
.cat-tile-body{overflow:hidden;max-height:0;transition:max-height .25s ease;border-left:2px solid var(--brd);margin:0 0 8px 12px;border-radius:0 0 8px 8px}
.cat-tile-body.open{max-height:5000px}
.cat-tile-body .item-row{padding-left:14px}
.ct-name{flex:1;font-size:13px;font-weight:600;color:var(--t1)}
.ct-amount{font-size:13px;font-weight:700;flex-shrink:0}
.ct-arrow{font-size:10px;color:var(--t3);flex-shrink:0}
.sub-items{overflow:hidden;max-height:0;transition:max-height .25s ease;border-top:1px solid var(--brd);background:rgba(0,0,0,.08)}
.sub-items.open{max-height:2000px}
/* ── ICON PICKER ── */
.icon-grid{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.icon-opt{width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:var(--rsm);border:1.5px solid var(--brd);cursor:pointer;font-size:18px;transition:all .1s;background:var(--s3)}
.icon-opt:hover{border-color:var(--brd3);background:var(--s4)}
.icon-opt.sel{border-color:var(--acc);background:var(--acc-d);box-shadow:0 0 8px rgba(52,199,89,.2)}
.tile-icon{width:24px;height:24px;display:flex;align-items:center;justify-content:center;border-radius:var(--rsm);background:var(--s3);font-size:20px;flex-shrink:0}

/* ── INLINE EDIT ── */
.ie-amt{
  background:var(--s4);border:1px solid var(--brd3);border-radius:5px;
  color:var(--t1);font-family:var(--f);font-size:inherit;
  width:85px;padding:2px 7px;outline:none;font-weight:600;text-align:right;
  font-variant-numeric:tabular-nums;
}
.ie-rep{
  background:var(--plan-d);border:1px solid rgba(124,136,245,.25);border-radius:5px;
  color:var(--plan);font-family:var(--f);font-size:10px;
  padding:2px 5px;outline:none;font-weight:700;text-transform:uppercase;
}
.ie-day{
  background:var(--s4);border:1px solid var(--brd3);border-radius:5px;
  color:var(--t1);font-family:var(--f);font-size:inherit;
  width:60px;padding:2px 6px;outline:none;font-weight:600;text-align:center;
}

/* ── TOGGLE ── */
.tg{position:relative;display:inline-block;width:40px;height:24px;flex-shrink:0;cursor:pointer}
.tg input{opacity:0;width:0;height:0}
.tg-s{position:absolute;inset:0;background:var(--s5);border-radius:12px;transition:.2s;border:1px solid var(--brd2)}
.tg-s::before{content:'';position:absolute;width:18px;height:18px;border-radius:50%;background:var(--t3);top:2px;left:2px;transition:.2s}
.tg input:checked+.tg-s{background:var(--acc-d);border-color:rgba(45,212,160,.3)}
.tg input:checked+.tg-s::before{background:var(--acc);transform:translateX(16px)}

/* ── MODAL ── */
.overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.65);
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  z-index:100;display:none;align-items:flex-end;justify-content:center;
}
.overlay.open{display:flex}
@media(min-width:600px){.overlay{align-items:center}}
.modal{
  background:var(--s2);border:1px solid var(--brd2);
  border-radius:20px 20px 0 0;width:100%;max-width:520px;
  padding:22px 22px 40px;max-height:92dvh;overflow-y:auto;
  box-shadow:0 -12px 60px rgba(0,0,0,.6),0 -2px 8px rgba(0,0,0,.4);
  position:relative;
}
.modal::before{
  content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,var(--brd2),transparent);
}
@media(min-width:600px){.modal{border-radius:16px;max-height:80vh}}
.mhandle{width:32px;height:3px;background:var(--s5);border-radius:2px;margin:0 auto 20px}
.mtitle{font-size:18px;font-weight:800;margin-bottom:20px;letter-spacing:-.2px}
.frow{margin-bottom:16px}
.flabel{display:block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--t3);margin-bottom:7px}
.finput,.fselect{
  width:100%;background:var(--s3);border:1.5px solid var(--brd);border-radius:10px;
  padding:12px 14px;color:var(--t1);font-family:var(--f);font-size:14px;
  outline:none;appearance:auto;text-overflow:ellipsis;overflow:hidden;
}
.finput:focus,.fselect:focus{border-color:var(--acc);background:var(--s4)}
.finput::placeholder{color:var(--t3)}
.finput.small{font-size:13px;padding:9px 12px}
.frow-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mbtns{display:flex;gap:8px;margin-top:20px}
.mbtn{
  flex:1;padding:13px;border-radius:10px;border:1.5px solid var(--brd2);
  background:var(--s3);color:var(--t1);font-family:var(--f);
  font-size:14px;font-weight:600;cursor:pointer;transition:all .15s;letter-spacing:.01em;
}
.mbtn:hover{background:var(--s4);border-color:var(--brd3)}
.mbtn:active{opacity:.8}
.mbtn.ok{background:var(--acc-d);color:var(--acc);border-color:rgba(45,212,160,.3)}
.mbtn.ok:hover{background:var(--acc-m)}
.mbtn.danger{background:var(--red-d);color:var(--red);border-color:rgba(240,101,101,.2)}

/* ── COLOR SWATCHES ── */
.cswatches{display:flex;gap:8px;flex-wrap:wrap;padding:2px}
.csw{
  width:28px;height:28px;border-radius:50%;cursor:pointer;
  border:2.5px solid transparent;transition:transform .12s,border-color .12s;
  -webkit-tap-highlight-color:transparent;
}
.csw:hover{transform:scale(1.15)}

/* ── TOAST ── */
.toast{
  position:fixed;bottom:24px;left:50%;

  box-shadow:var(--shadow-lg);letter-spacing:.01em;
}

/* ── LOADER ── */
.loader{
  position:fixed;inset:0;background:var(--bg);z-index:200;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;

}

.spin{
  width:36px;height:36px;border:2.5px solid var(--s4);

}

.loader-text{font-size:13px;color:var(--t3);font-weight:500;letter-spacing:.02em}

/* ── CALENDAR POPUP ── */
.cal-popup{

.cal-cell.today:hover{background:rgba(52,199,89,.12)}

.cal-cell.overdue-day{background:rgba(255,159,10,.07);box-shadow:inset 0 0 0 1.5px rgba(255,159,10,.35)}
.cal-day{font-size:10px;font-weight:700;color:var(--t3);position:absolute;top:4px;right:5px;line-height:1}
.cal-cell.today .cal-day{color:var(--acc);background:rgba(52,199,89,.18);border-radius:4px;padding:1px 3px}
  .cal-row{font-size:9px;font-weight:600;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:13px}

.cal-empty{background:var(--s1);border-right:1px solid var(--brd);border-bottom:1px solid var(--brd);opacity:.35}
.cal-empty:nth-child(7n){border-right:none}
.day-detail-overlay{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px);padding:20px}
.day-detail-panel{background:var(--s2);border-radius:16px;width:100%;max-width:480px;padding:20px;max-height:80dvh;overflow-y:auto;border:1px solid var(--brd2);box-shadow:0 24px 60px rgba(0,0,0,.5)}

.day-ev{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--brd)}
.day-ev:last-child{border-bottom:none}
.day-ev-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.day-ev-name{flex:1;font-size:13px;color:var(--t1);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.acct-inline-input{background:transparent;border:none;border-bottom:2px solid var(--acc);color:var(--t1);font-family:var(--f);font-size:20px;font-weight:700;width:100%;outline:none;padding:2px 0}
.settings-tabs{display:flex;gap:1px;background:var(--s3);border:1px solid var(--brd);border-radius:var(--rsm);padding:3px;margin-bottom:16px}
.stab{flex:1;padding:7px 4px;border-radius:6px;border:none;background:none;color:var(--t3);font-family:var(--f);font-size:12px;font-weight:500;cursor:pointer;transition:all .15s;text-align:center}

@media(max-width:768px){
  .tab-bar{display:flex;align-items:stretch}.logo,.nav-tabs,.desktop-month-nav{display:none!important}

<script>
// ══════════════════════════════════
// SUPABASE
// ══════════════════════════════════
const SB='https://trmxmhdpyvdbsgxbvwxx.supabase.co';
const SK='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRybXhtaGRweXZkYnNneGJ2d3h4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA2NTE1MTQsImV4cCI6MjA5NjIyNzUxNH0.Llpg7iajdvMoT34_u7HIoirtyL1popMAsyD86O3oLoM';
const SH={'Content-Type':'application/json','apikey':SK,'Authorization':'Bearer '+SK};
const sGet=(t,q='')=>fetch(`${SB}/rest/v1/${t}?${q}`,{headers:SH}).then(r=>{if(!r.ok)throw r;return r.json();});
const sUp=(t,b)=>fetch(`${SB}/rest/v1/${t}`,{method:'POST',headers:{...SH,'Prefer':'resolution=merge-duplicates'},body:JSON.stringify(b)}).then(r=>{if(!r.ok)throw r;return r.status===204?null:r.json().catch(()=>null);});
const sDel=(t,q)=>fetch(`${SB}/rest/v1/${t}?${q}`,{method:'DELETE',headers:SH}).then(r=>{if(!r.ok)throw r;});
const sPat=(t,q,b)=>fetch(`${SB}/rest/v1/${t}?${q}`,{method:'PATCH',headers:{...SH,'Prefer':'return=minimal'},body:JSON.stringify(b)}).then(r=>{if(!r.ok)throw r;});

// ══════════════════════════════════
// CONSTANTS
// ══════════════════════════════════
const MONTHS=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const MONTHS_G=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const WD=['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
const LS='kp_v1';

// ══════════════════════════════════
// STATE
// ══════════════════════════════════
// D = persistent data (saved to supabase + localStorage)
let D = {
  accounts:[],
  items:[],
  done:{},   // {"itemId":true} or {"itemId_2":true} for 2nd date
  settings:{taxRate:7, taxBase:'all'}
};
let curYear=new Date().getFullYear(), curMonth=new Date().getMonth();
let dbOk=false, editingId=null, modalType=null;

// ══════════════════════════════════
// SYNC
// ══════════════════════════════════
function ss(st){
  const d=document.getElementById('sdot');
  d.className='sync-dot '+(st==='ok'?'ok':st==='sync'?'sync':'err');
}

// ══════════════════════════════════
// LOCALSTORAGE
// ══════════════════════════════════
function saveL(){try{localStorage.setItem(LS,JSON.stringify(D));}catch(e){}}
function loadL(){try{const d=JSON.parse(localStorage.getItem(LS)||'null');if(d)D=d;}catch(e){}}

// ══════════════════════════════════
// SUPABASE INIT — single JSON row
// ══════════════════════════════════
async function initApp(){
  setLT('Загрузка…');
  try{
    // Supabase — главный источник данных, загружаем первым
    const rows=await sGet('kp_data','key=eq.main&select=data');
    if(rows.length>0&&rows[0].data){
      const remote=rows[0].data;
      if(remote.accounts&&remote.accounts.length) D.accounts=remote.accounts;
      if(remote.items&&remote.items.length) D.items=remote.items;
      D.done=remote.done||{};
      D.settings=remote.settings||D.settings||{taxRate:7,taxBase:'all'};
    } else {
      // Supabase пуст — берём из localStorage как запасной вариант
      loadL();
    }
    dbOk=true; ss('ok'); saveL();
  }catch(e){
    // Supabase недоступен — берём из localStorage
    dbOk=false; ss('err');
    loadL();
    console.warn('DB:',e);
  }
  // seed defaults — только для новых пользователей
  if(!D.accounts.length) D.accounts=DEFAULT_ACCOUNTS;
  if(!D.items.length) D.items=DEFAULT_ITEMS;
  // migrate old single vvd to 3 separate items
  const oldIdx=D.items.findIndex(i=>i.id==='e_vvd');
  if(oldIdx>=0){
    const old=D.items[oldIdx];
    const amt=Math.round((Number(old.amount)||0)/3);
    D.items.splice(oldIdx,1,
      {id:'e_vvd1', type:'expense', categoryKey:'vvd', category:'Вывод себе (личное) 1', pvzAddr:null, amount:amt, day:1, repeat:'monthly', taxable:false, color:old.color||'#e879f9'},
      {id:'e_vvd2', type:'expense', categoryKey:'vvd', category:'Вывод себе (личное) 2', pvzAddr:null, amount:amt, day:10, repeat:'monthly', taxable:false, color:old.color||'#e879f9'},
      {id:'e_vvd3', type:'expense', categoryKey:'vvd', category:'Вывод себе (личное) 3', pvzAddr:null, amount:amt, day:20, repeat:'monthly', taxable:false, color:old.color||'#e879f9'}
    );
  }
  // migrate: rename ar category
  D.items.forEach(i=>{ if(i.categoryKey==='ar'&&i.category==='Аренда + коммуналка'){ i.category='Аренда'; } });
  // migrate: add Коммунальные платежи items if missing
  const hasKom=D.items.some(i=>i.categoryKey==='kom');
  if(!hasKom){
    const komItems=PVZ_LIST.map(p=>({
      id:'e_kom_'+p.key, type:'expense',
      categoryKey:'kom', category:'Коммунальные платежи',
      pvzAddr:p.key, amount:0, day:5,
      repeat:'monthly', taxable:false, color:p.color,
    }));
    // Insert after last ar item
    const lastArIdx=D.items.reduce((acc,it,i)=>it.categoryKey==='ar'?i:acc,-1);
    if(lastArIdx>=0) D.items.splice(lastArIdx+1,0,...komItems);
    else D.items.push(...komItems);
  }
  // migrate: add Управление items if missing
  const hasMgmt=D.items.some(i=>i.categoryKey==='mgmt');
  if(!hasMgmt){
    const mgmtItems=PVZ_LIST.map(p=>({
      id:'e_mgmt_'+p.key, type:'expense',
      categoryKey:'mgmt', category:'Управление',
      pvzAddr:p.key, amount:0, day:5,
      repeat:'monthly', taxable:false, color:p.color,
    }));
    const lastZpIdx=D.items.reduce((acc,it,i)=>it.categoryKey==='zp'?i:acc,-1);
    if(lastZpIdx>=0) D.items.splice(lastZpIdx+1,0,...mgmtItems);
    else D.items.push(...mgmtItems);
  }
  // migrate v2: old model (pvzAddr per item) → new model (composite operations)
  if(D.items.length && D.items[0].pvzAddr!==undefined && D.items[0].composite===undefined){
    const oldItems=D.items;
    const newItems=[];
    const grouped={}; // key: catKey+'_'+grpKey → items[]
    const simpleItems=[];
    for(const it of oldItems){
      if(it.pvzAddr){
        const grp=PVZ_GROUPS.find(g=>g.pvz.includes(it.pvzAddr));
        const gk=grp?grp.key:'other';
        const mk=it.categoryKey+'_'+gk;
        if(!grouped[mk]) grouped[mk]={catKey:it.categoryKey,catName:it.category,type:it.type,grpKey:gk,items:[],taxRate:it.taxable?7:0,repeat:it.repeat||'monthly',color:catColor(it.categoryKey,it.type),day:it.day,days:it.days};
        grouped[mk].items.push(it);
      } else {
        simpleItems.push(it);
      }
    }
    for(const [mk,g] of Object.entries(grouped)){
      const total=g.items.reduce((s,i)=>s+(Number(i.amount)||0),0);
      const first=g.items[0];
      newItems.push({
        id:first.id.replace(/_[^_]+$/,'_'+g.grpKey), type:g.type,
        categoryKey:g.catKey, category:g.catName,
        composite:true, composition:g.grpKey,
        subItems:g.items.map(i=>({name:(PVZ_LIST.find(p=>p.key===i.pvzAddr)||{}).name||i.pvzAddr,amount:Number(i.amount)||0})),
        amount:total||0, day:g.day, days:g.days,
        repeat:g.repeat, taxRate:g.taxRate, color:g.color,
      });
    }
    for(const it of simpleItems){
      const newIt={...it};
      delete newIt.pvzAddr;
      newIt.composite=false;
      if(it.taxable!==undefined) newIt.taxRate=it.taxable?7:0;
      delete newIt.taxable;
      newItems.push(newIt);
    }
    D.items=newItems;
  }
  D.settings=D.settings||{taxRate:7,taxBase:'all'};
  saveL();
  // Пишем в Supabase ТОЛЬКО если были миграции (новые категории)
  const needsWrite=!hasKom||!hasMgmt||oldIdx>=0;
  if(dbOk&&needsWrite){try{await sUp('kp_data',[{key:'main',data:D}]);}catch(e){}}

  hideLoader(); renderAll();
  setInterval(trySync,45000);
}

async function pushData(){
  saveL(); // always save locally first
  if(!dbOk){
    // try to reconnect
    try{
      await sGet('kp_data','limit=1');
      dbOk=true;
    }catch(e){ ss('err'); return; }
  }
  ss('sync');
  try{
    await sUp('kp_data',[{key:'main',data:D}]);
    ss('ok');
  }catch(e){
    ss('err');
    dbOk=false;

// CASHFLOW LOGIC
// ══════════════════════════════════
function occDays(item,year,month){
  const dlist=itemDays(item);
  const daysInMonth=getDays(year,month);
  const lastD=lastDayOfMonth(year,month);
  const result=[];
  switch(item.repeat){
    case 'daily':
      for(let d=1;d<=daysInMonth;d++) result.push(d);
      break;
    case 'weekly': {
      // weekDays: 1=Пн..6=Сб, 7=Вс (UI) → JS getDay: Пн=1..Сб=6, Вс=0
      const _wds=item.weekDays&&item.weekDays.length?item.weekDays:null;
      if(_wds){
        const _seen=new Set();
        for(const wd of _wds){
          const js=wd===7?0:wd;
          if(_seen.has(js)) continue;
          _seen.add(js);
          for(const d2 of weeklyDatesForDow(js,year,month)) result.push(d2);
        }
      } else {
        // Legacy items without weekDays
        const refYear=item._refYear!==undefined?item._refYear:year;
        const refMonth=item._refMonth!==undefined?item._refMonth:month;
        const _seen=new Set();
        for(const d0 of dlist){
          const refDow=new Date(refYear,refMonth,Math.min(d0,daysInMonth)).getDay();
          if(_seen.has(refDow)) continue;
          _seen.add(refDow);
          for(const d2 of weeklyDatesForDow(refDow,year,month)) result.push(d2);
        }
      }
      break;
    }
    case 'quarterly':
      for(const d0 of dlist) result.push(Math.min(d0,daysInMonth));
      break;
    case 'yearly':
      for(const d0 of dlist) result.push(Math.min(d0,daysInMonth));
      break;
    case 'lastDay':
      result.push(lastD);
      break;
    case 'once':
    case 'monthly':
    default:
      for(const d0 of dlist) result.push(Math.min(d0,daysInMonth));
      break;
  }
  return result;
}

function buildDailyCF(year,month,startOverride){
  const days=getDays(year,month);
  const now_=new Date(), cy_=now_.getFullYear(), cm_=now_.getMonth();
  const isCurMonth=(year===cy_&&month===cm_);

  const rawBalance=D.accounts.reduce((s,a)=>s+(Number(a.balance)||0),0);
  const startBalance=startOverride!==undefined?startOverride:rawBalance;

  const events={};
  for(let d=1;d<=days;d++)events[d]=[];

  function addEvent(d,name,amount,type,color,id,extra){
    if(d<1||d>days) return;
    events[d].push({name,amount,type,color,id,...(extra||{})});
  }

  const incomes=D.items.filter(i=>i.type==='income'&&itemAmount(i)>0);
  for(const item of incomes){
    const amt=itemAmount(item);
    const occur=occDays(item,year,month);
    const taxR=(item.taxRate||0)/100;
    for(const d of occur){
      const dk=item.id+'_d'+d;
      if(isCurMonth&&D.done[dk]) continue;
      const _effAmt=item.sharePercent?Math.round(amt*item.sharePercent/100):amt;
      addEvent(d,item.category,_effAmt,'income',item.color,item.id,{doneKey:dk,sharePercent:item.sharePercent||null,fullAmount:item.sharePercent?amt:null});
      if(taxR>0&&_effAmt>0){
        addEvent(d,'Налог',-Math.round(_effAmt*taxR),'tax','#fbbf24',item.id+'_tax',{auto:true});
      }
    }
  }

  // compute total tax for KPI
  let taxableIncome=0;
  for(const item of incomes){
    if((item.taxRate||0)<=0) continue;
    taxableIncome+=itemAmount(item);
  }
  const taxAmount=Math.round(taxableIncome*((D.settings.taxRate||7)/100));

  const expenses=D.items.filter(i=>i.type==='expense'&&itemAmount(i)>0&&i.categoryKey!=='zp'&&!i._zp);
  for(const item of expenses){
    const amt=itemAmount(item);
    const occur=occDays(item,year,month);
    for(const d of occur){
      const dk=item.id+'_d'+d;
      if(isCurMonth&&D.done[dk]) continue;
      const _effExpAmt=item.sharePercent?Math.round(amt*item.sharePercent/100):amt;
    addEvent(d,item.category,-_effExpAmt,'expense',item.color,item.id,{doneKey:dk,sharePercent:item.sharePercent||null,fullAmount:item.sharePercent?amt:null});
    }
  }

  const salaryItems=D.items.filter(i=>i.categoryKey==='zp'&&(itemAmount(i)>0||i._zp));
  if(salaryItems.length){
    let pm=month-1,py=year; if(pm<0){pm=11;py--;}
    const pmd=getDays(py,pm);
    const days5=pmd-15;
    const days20=15;
    for(const item of salaryItems){
      const sc=itemAmount(item);
      if(!sc) continue;
      const subItems=item.composite&&item.subItems?item.subItems:[{name:'',amount:sc}];
      for(const sub of subItems){
        const subAmt=Number(sub.amount)||0;
        if(!subAmt) continue;
        const subName=sub.name||'';
        const prefix=subName?subName+' — ':'';
        const d5=Math.min(5,days), d20=Math.min(20,days);
        const doneKey1=item.id+'_d'+d5+(subName?'_'+subName:'');
        const doneKey2=item.id+'_d'+d20+(subName?'_'+subName:'');
        if(!(isCurMonth&&D.done[doneKey1])&&d5<=days) addEvent(d5,prefix+'аванс',-Math.round(subAmt*days5),'expense',item.color,item.id,{doneKey:doneKey1});
        if(!(isCurMonth&&D.done[doneKey2])&&d20<=days) addEvent(d20,prefix+'зп',-Math.round(subAmt*days20),'expense',item.color,item.id,{doneKey:doneKey2});
      }
    }
  }

  // Withdrawals (вывод в личное пользование)
  const withdrawals=D.items.filter(i=>i.type==='withdrawal'&&itemAmount(i)>0);
  for(const item of withdrawals){
    const amt=itemAmount(item);
    const occur=occDays(item,year,month);
    for(const d of occur){
      const dk=item.id+'_d'+d;
      if(isCurMonth&&D.done[dk]) continue;
      addEvent(d,item.category,-amt,'withdrawal',item.color,item.id,{doneKey:dk});
    }
  }

  // build daily running balance
  const daily=[];
  let balance=startBalance;
  for(let d=1;d<=days;d++){
    const dayEvents=events[d];
    let dayIncome=dayEvents.filter(e=>e.type==='income').reduce((s,e)=>s+e.amount,0);
    let dayExpense=dayEvents.filter(e=>e.type!=='income').reduce((s,e)=>s+e.amount,0);

    const dayNet=dayIncome+dayExpense;
    balance+=dayNet;
    daily.push({d,events:dayEvents,income:dayIncome,expense:dayExpense,net:dayNet,balance,we:isWe(year,month,d),tod:isToday(year,month,d)});
  }

  return {daily,startBalance:rawBalance,taxAmount,taxableIncome};
}

// Стартовый баланс для месяца:
// Текущий месяц — реальный баланс счетов (buildDailyCF считает с 1-го числа)
// Будущий месяц — итог предыдущего месяца
// Прошлое — не используется
function getMonthStartBalance(year,month){
  const now=new Date(), cy=now.getFullYear(), cm=now.getMonth();
  const current=D.accounts.reduce((s,a)=>s+(Number(a.balance)||0),0);

  if(year===cy&&month===cm) return current;

  if(year>cy||(year===cy&&month>cm)){
    // future: chain from current month
    let bal=current;
    let y=cy, m=cm;
    while(y<year||(y===year&&m<month)){
      const cf=buildDailyCF(y,m,bal);
      bal=cf.daily[cf.daily.length-1].balance;
      m++; if(m>11){m=0;y++;}
    }
    return bal;
  }

  // past month — return current (no history)
  return current;
}

// ══════════════════════════════════
// SAFE WITHDRAWAL CALC
// ══════════════════════════════════
// Сколько можно вывести прямо сейчас, не уйдя в минус ни в один день
// начиная с сегодня и на 12 месяцев вперёд.
// Учитывает тумблер paidToday так же как buildDailyCF.
function calcSafeWithdrawal(){
  const now=new Date();
  const cy=now.getFullYear(), cm=now.getMonth(), cd=now.getDate();
  const currentTotal=D.accounts.reduce((s,a)=>s+(Number(a.balance)||0),0);

  let minBalance=Infinity;
  let minMonth=cm, minYear=cy;

  // --- Текущий месяц ---
  // Стартуем с реального баланса. buildDailyCF пропускает done-строки,
  // поэтому учитываются только непроведённые операции — весь месяц целиком.
  {
    const cf = buildDailyCF(cy, cm, currentTotal);
    for(const day of cf.daily){
      if(day.balance < minBalance){ minBalance = day.balance; minMonth = cm; minYear = cy; }
    }
    var carryBal = cf.daily[cf.daily.length-1].balance;
  }

  // --- Следующие 12 месяцев ---
  let scanM = cm + 1, scanY = cy;
  if(scanM > 11){ scanM = 0; scanY++; }

  for(let i = 0; i < 12; i++){
    const cf = buildDailyCF(scanY, scanM, carryBal);
    for(const day of cf.daily){
      if(day.balance < minBalance){ minBalance = day.balance; minMonth = scanM; minYear = scanY; }
    }
    carryBal = cf.daily[cf.daily.length - 1].balance;
    scanM++; if(scanM > 11){ scanM = 0; scanY++; }
  }

  const buffer = Number(D.settings.safetyBuffer)||0;
  const safe = Math.max(0, Math.floor(minBalance) - buffer);
  return { safe, minBalance: Math.floor(minBalance), minMonth, minYear };
}

function getOverdueItems(){
  const now=new Date(), cy=now.getFullYear(), cm=now.getMonth(), cd=now.getDate();
  const result=[];
  const isCurMonth=curYear===cy&&curMonth===cm;
  if(!isCurMonth) return result;

  const addedSvcCats=new Set();

  for(const item of D.items){
    if(!itemAmount(item) && !(item._zp)) continue;
    const hasCompItem=item.composite&&item.subItems;
    const hasSvcTgl=['ye','dp','sl','yv'].includes(item.categoryKey);

    if(hasSvcTgl){
      if(addedSvcCats.has(item.categoryKey)) continue;
      const catItems=D.items.filter(x=>x.categoryKey===item.categoryKey);
      const allIds=catItems.map(x=>x.id);
      let minDate=cd;
      let anyOverdue=false;
      for(const ci of catItems){
        const occur=occDays(ci,cy,cm);
        for(const d of occur){
          if(d<=cd&&!D.done[ci.id+'_d'+d]){
            anyOverdue=true;
            if(d<minDate) minDate=d;
          }
        }
      }
      if(anyOverdue){
        result.push({
          item:{...item, _svcGroup:true},
          date:minDate,
          key:'__svc__'+item.categoryKey,
          label:minDate===cd?'сегодня':minDate+' числа',
          isSvcGroup:true,
          svcKey:item.categoryKey,
          allDone:allIds.every(id=>{
            return occDays(D.items.find(x=>x.id===id)||item,cy,cm).every(d=>D.done[id+'_d'+d]);
          }),
        });
        addedSvcCats.add(item.categoryKey);
      }
    } else {
      const occur=occDays(item,cy,cm);
      for(const d of occur){
        if(d<=cd&&!D.done[item.id+'_d'+d]){
          result.push({item, date:d, key:item.id+'_d'+d, label:d+' числа'});
        }
      }
    }
  }

  return result.sort((a,b)=>{
    const now2=new Date().getDate();
    if(a.date===now2&&b.date!==now2) return -1;
    if(b.date===now2&&a.date!==now2) return 1;
    return b.date-a.date;
  });
}

function renderCashflow(msb){
  const el=document.getElementById('calGrid');
  if(!el) return;
  // Build with empty done to show ALL planned ops (including already done ones)
  const _savedDone=D.done; D.done={};
  const {daily}=buildDailyCF(curYear,curMonth,msb);
  D.done=_savedDone;
  const dayMap={};
  for(const d of daily){
    const tax=d.events.filter(e=>e.auto).reduce((s,e)=>s+Math.abs(e.amount),0);
    const wdr=d.events.filter(e=>e.type==='withdrawal').reduce((s,e)=>s+Math.abs(e.amount),0);
    const exp=Math.abs(d.expense)+tax-wdr;
    dayMap[d.d]={inc:d.income,exp:exp>0?exp:0,wdr,bal:d.balance};
  }
  const now=new Date(),isCur=(curYear===now.getFullYear()&&curMonth===now.getMonth());
  const today=isCur?now.getDate():0;
  const days=getDays(curYear,curMonth);
  const firstDow=(new Date(curYear,curMonth,1).getDay()+6)%7;
  const DOW=['ПН','ВТ','СР','ЧТ','ПТ','СБ','ВС'];
  let h=DOW.map(d=>`<div class="cal-dow">${d}</div>`).join('');
  for(let i=0;i<firstDow;i++) h+=`<div class="cal-empty"></div>`;
  for(let day=1;day<=days;day++){
    const dm=dayMap[day]||{inc:0,exp:0,wdr:0,bal:0};
    const isToday=day===today;
    const now2=new Date();
    const isActualPast=(curYear<now2.getFullYear())||(curYear===now2.getFullYear()&&curMonth<now2.getMonth());
    const isPast=isActualPast||(isCur&&day<today);
    const _dEvs2=(daily.find(x=>x.d===day)||{events:[]}).events.filter(e=>!e.auto);
    const _allDone=_dEvs2.length>0&&_dEvs2.every(ev=>{
      const _it2=D.items.find(i=>i.id===ev.id);
      const dk=ev.doneKey||(_it2&&_it2.repeat==='weekly'?weeklyDoneKey(ev.id,day):ev.id);
      return dk&&!!D.done[dk];
    });
    const _isGrey=isPast;  // past month/day = always grey regardless
    const dEvs=(daily.find(x=>x.d===day)||{events:[]}).events;
    const hasOvd=isCur&&!isToday&&day<today&&dEvs.some(ev=>{
      if(ev.auto)return false;
      const _it3=D.items.find(i=>i.id===ev.id);
      const dk=ev.doneKey||(_it3&&_it3.repeat==='weekly'?weeklyDoneKey(ev.id,day):ev.id);
      return !D.done[dk];
    });
    const hasOps=dm.wdr>0||dm.inc>0||dm.exp>0;
    const cls=isToday?'today':hasOvd?'overdue-day':dm.bal<0?'negative':'';
    const balCls=dm.bal<0?'neg':dm.bal<50000?'warn':'pos';
    // past days: grey text; 4 fixed rows always rendered
    const gc=_isGrey?'color:var(--t3)':'';
    const incC=_isGrey?'var(--t3)':dm.inc>0?'var(--grn)':'transparent';
    const expC=_isGrey?'var(--t3)':dm.exp>0?'var(--red)':'transparent';
    const wdrC=_isGrey?'var(--t3)':dm.wdr>0?'var(--blue)':'transparent';
    const balColor=_isGrey?'var(--t3)':dm.bal<0?'var(--red)':dm.bal<50000?'var(--amber)':'var(--grn)';
    h+=`<div class="cal-cell ${cls}" onclick="showDayDetail(${day})">
      <div class="cal-day">${day}</div>
      <div class="cal-row" style="color:${incC}">${dm.inc>0?'+'+fmt(dm.inc):'​'}</div>
      <div class="cal-row" style="color:${expC}">${dm.exp>0?'−'+fmt(dm.exp):'​'}</div>
      <div class="cal-row" style="color:${wdrC}">${dm.wdr>0?'−'+fmt(dm.wdr):'​'}</div>
      ${hasOps?`<div class="cal-bal-row" style="color:${balColor}">${fmt(dm.bal)}</div>`:'<div class="cal-bal-row" style="visibility:hidden">0</div>'}
    </div>`;
  }
  const total=firstDow+days,rem=total%7===0?0:7-(total%7);
  for(let i=0;i<rem;i++) h+=`<div class="cal-empty"></div>`;
  el.innerHTML=h;
}

function weeklyDatesForDow(refDow,targetYear,targetMonth){
  const mdays=getDays(targetYear,targetMonth);
  const firstDow=new Date(targetYear,targetMonth,1).getDay();
  let fd=1+((refDow-firstDow+7)%7);
  if(fd>mdays) return [];
  const out=[];
  for(let d=fd;d<=mdays;d+=7) out.push(d);
  return out;
}
function weeklyDates(item,year,month){
  const dlist=itemDays(item);
  const refYear=item._refYear!==undefined?item._refYear:curYear;
  const refMonth=item._refMonth!==undefined?item._refMonth:curMonth;
  const dates=[];
  for(const baseDay of dlist){
    const refDow=new Date(refYear,refMonth,baseDay).getDay();
    for(const d of weeklyDatesForDow(refDow,year,month)){
      if(!dates.includes(d)) dates.push(d);
    }
  }
  dates.sort((a,b)=>a-b);
  return dates;
}
function weeklyDoneKey(itemId,d){return itemId+'_d'+d;}

function isOverdue(item){
  const now=new Date(), cy=now.getFullYear(), cm=now.getMonth(), cd=now.getDate();
  const isCurMonth=curYear===cy&&curMonth===cm;
  if(!isCurMonth) return false;
  if(item._zp) return false;
  const occur=occDays(item,cy,cm);
  return occur.some(d=>d<=cd&&!D.done[item.id+'_d'+d]);
}


function buildWeeklySub(item){
  const wdates=weeklyDates(item,curYear,curMonth);
  const now2=new Date(),cd2=(curYear===now2.getFullYear()&&curMonth===now2.getMonth())?now2.getDate():32;
  let h=`<div class="weekly-sub" id="wsub_${item.id}">`;
  wdates.forEach(d=>{
    const dk=weeklyDoneKey(item.id,d);
    const isDone=!!D.done[dk], isOvd=d<cd2&&!isDone;
    h+=`<div class="weekly-row ${isDone?'done-w':isOvd?'overdue-w':''}">

      <span style="flex-shrink:0;width:16px;height:16px;border-radius:4px;border:1.5px solid ${isDone?'var(--grn)':'var(--t3)'};background:${isDone?'var(--grn)':'transparent'};display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--bg)">${isDone?'✓':''}</span>

  });
  h+=`</div>`;
  return h;
}

function toggleSvcDone(svcKey){
  const catItems=D.items.filter(i=>i.categoryKey===svcKey&&i.type==='income');
  const now=new Date(),cy=now.getFullYear(),cm=now.getMonth();
  let allDone=true;
  for(const item of catItems){
    const occur=occDays(item,cy,cm);
    if(!occur.every(d=>D.done[item.id+'_d'+d])){allDone=false;break;}
  }
  for(const item of catItems){
    const occur=occDays(item,cy,cm);
    for(const d of occur){
      const dk=item.id+'_d'+d;
      if(allDone) delete D.done[dk]; else D.done[dk]=true;
    }
  }
  pushData(); const _st=saveOpenState(); renderSettings(); restoreOpenState(_st);
  const msb=getMonthStartBalance(curYear,curMonth);
  renderCashflow(msb); renderKPI(msb);
}

const DUAL_CAT = ['zp','mgmt','w'];

let _calItem = null; // item being edited via popup

function openDayCalPopup(anchorEl, item){
  closeDayCalPopup();
  _calItem = item;
  const sel = (item.days||[item.day||1]).map(Number).slice(0,2);

  const popup = document.createElement('div');
  popup.className = 'day-cal-popup';
  popup.style.cssText = `
    position:fixed;z-index:500;
    background:var(--s3);border:1px solid var(--brd2);border-radius:14px;
    padding:14px;width:240px;
    box-shadow:0 12px 40px rgba(0,0,0,.6);
  `;

  popup.innerHTML = renderDayCalContent(sel);

  // Position near the badge
  document.body.appendChild(popup);
  const rect = anchorEl.getBoundingClientRect();
  const pw = 240, ph = 280;
  let top = rect.bottom + 6;
  let left = rect.left;
  if(left + pw > window.innerWidth - 10) left = window.innerWidth - pw - 10;
  if(top + ph > window.innerHeight - 10) top = rect.top - ph - 6;
  popup.style.top = top + 'px';
  popup.style.left = left + 'px';
}

function renderDayCalContent(sel){
  sel = sel.map(Number);
  const maxSel=_calItem&&['zp','mgmt','w'].includes(_calItem.categoryKey)?2:1;
  let h = `<div style="font-size:11px;font-weight:700;color:var(--t2);text-align:center;margin-bottom:10px;text-transform:uppercase;letter-spacing:.6px">Выберите ${maxSel===1?'дату':'до 2 дат'}</div>`;
  h += `<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:3px">`;
  for(let d=1;d<=31;d++){
    const isSel = sel.includes(d);
    h += `<div onclick="toggleCalDay(${d})" style="
      font-size:12px;font-weight:600;text-align:center;padding:6px 2px;border-radius:7px;cursor:pointer;
      background:${isSel?'var(--acc)':'var(--s4)'};
      color:${isSel?'var(--bg)':'var(--t2)'};
      transition:all .1s;
    ">${d}</div>`;
  }
  h += `</div>`;
  const sorted = [...sel].sort((a,b)=>a-b);
  h += `<div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--brd);display:flex;align-items:center;justify-content:space-between">`;
  h += `<div style="font-size:13px;color:var(--t2)">`;
  if(sorted.length===0) h += `<span style="color:var(--t3)">не выбрано</span>`;
  else h += sorted.map(d=>`<strong style="color:var(--acc)">${d}</strong>`).join(', ') + ' <span style="color:var(--t3)">числа</span>';
  h += `</div>`;
  const ready=sel.length>=1;
  h += `<button onclick="${ready?'applyDayCal()':'closeDayCalPopup()'}" style="
    background:${ready?'var(--acc)':'var(--s5)'};
    border:none;border-radius:7px;padding:5px 10px;
    color:${ready?'var(--bg)':'var(--t3)'};
    font-family:var(--f);font-size:12px;font-weight:700;cursor:pointer;
  ">${ready?'Готово':'Закрыть'}</button>`;
  h += `</div>`;
  return h;
}

function toggleCalDay(d){
  if(!_calItem) return;
  let sel = (_calItem.days||[_calItem.day||1]).map(Number);
  const maxSel=_calItem.categoryKey&&['zp','mgmt','w'].includes(_calItem.categoryKey)?2:1;
  const idx = sel.indexOf(d);
  if(idx>=0){ sel.splice(idx,1); }
  else if(sel.length<maxSel){ sel.push(d); }
  else { sel = [sel[sel.length-1], d].slice(-maxSel); } // replace
  _calItem.days = sel; delete _calItem.day;
  if(_calItem.repeat==='weekly'){_calItem._refYear=curYear;_calItem._refMonth=curMonth;}
  // re-render popup content
  const popup = document.querySelector('.day-cal-popup');
  if(popup) popup.innerHTML = renderDayCalContent(sel);
  // save immediately on each click
  pushData(); const _st=saveOpenState(), _sy=window.scrollY; renderSettings(); restoreOpenState(_st); requestAnimationFrame(()=>window.scrollTo(0,_sy));
}

function applyDayCal(){
  if(!_calItem) return;
  if(_calItem.repeat==='weekly'){_calItem._refYear=curYear;_calItem._refMonth=curMonth;}
  closeDayCalPopup();
  pushData(); rerender();
}

function closeDayCalPopup(){
  const popup = document.querySelector('.day-cal-popup');
  if(popup) popup.remove();
  _calItem = null;
}

// Auto-reset done on 1st of each month at 01:00
function scheduleReset(){
  const now=new Date();
  const next=new Date(now.getFullYear(),now.getMonth()+1,1,1,0,0,0);
  const ms=next-now;
  setTimeout(()=>{
    D.done={}; pushData(); renderAll();
    scheduleReset();
  }, ms);
}

function showDayDetail(day){
  const msb=getMonthStartBalance(curYear,curMonth);
  const {daily}=buildDailyCF(curYear,curMonth,msb);
  const d=daily.find(x=>x.d===day);
  if(!d||!d.events.length) return;
  const DOWS=['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
  const dow=DOWS[new Date(curYear,curMonth,day).getDay()];
  const balCls=d.balance<0?'var(--red)':d.balance<50000?'var(--amber)':'var(--acc)';
  let evHtml='';
  [...d.events.filter(e=>!e.auto),...d.events.filter(e=>e.auto)].forEach(ev=>{
    const isInc=ev.type==='income',isTax=ev.auto,isWdr=ev.type==='withdrawal';
    const col=isTax?'var(--amber)':isInc?'var(--grn)':isWdr?'#60a5fa':'var(--red)';
    const name=isTax?`Налог УСН ${D.settings.taxRate||7}%`:ev.name;
    const doneKey=ev.doneKey||ev.id+'_d'+day;
    const isDone=doneKey?!!D.done[doneKey]:false;
    const doneBtn=doneKey?`<label class="tg" onclick="event.stopPropagation()"><input type="checkbox" ${isDone?'checked':''} onchange="toggleDayEv('${doneKey}',${day})"><span class="tg-s"></span></label>`:'';
    evHtml+=`<div class="day-ev" style="${isDone?'opacity:.4':''}">
      <div class="day-ev-dot" style="background:${ev.color||col}"></div>
      <div class="day-ev-name" style="${isDone?'text-decoration:line-through':''}">${name}</div>
      <div class="day-ev-amt" style="color:${col}">${isInc?'+':'−'}${fmt(Math.abs(ev.amount))}</div>
      ${doneBtn}
    </div>`;
  });
  const html=`<div class="day-detail-overlay" onclick="this.remove()">
    <div class="day-detail-panel" onclick="event.stopPropagation()">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px">
        <div class="day-detail-title">${day} ${MONTHS[curMonth]}, ${dow}</div>
        <button onclick="this.closest('.day-detail-overlay').remove()" style="background:none;border:none;color:var(--t3);font-size:20px;cursor:pointer;padding:0">✕</button>
      </div>
      <div style="font-size:11px;color:var(--t3);margin-bottom:12px">Баланс: <span style="color:${balCls};font-weight:700">${fmt(d.balance)}</span></div>
      ${evHtml}
    </div>
  </div>`;
  const overlay=document.createElement('div');
  overlay.innerHTML=html;
  document.body.appendChild(overlay.firstElementChild);
}
function toggleDayEv(key,day){
  if(D.done[key])delete D.done[key];else D.done[key]=true;
  pushData();
  const msb=getMonthStartBalance(curYear,curMonth);
  renderCashflow(msb);renderKPI(msb);renderOverdueDash();
  document.querySelector('.day-detail-overlay')?.remove();
  showDayDetail(day);
}
function inlineEditBalance(e,id){
  const valEl=document.getElementById('aval-'+id);
  if(!valEl||valEl.querySelector('input'))return;
  const a=D.accounts.find(x=>x.id===id);if(!a)return;
  const cur=Number(a.balance)||0;
  valEl.innerHTML=`<input class="acct-inline-input" type="number" value="${cur}" step="100">`;
  const inp=valEl.querySelector('input');
  inp.focus();inp.select();
  const save=()=>{
    const v=parseFloat(inp.value)||0;a.balance=v;
    valEl.innerHTML=fmt(v)||'0₽';
    pushData();
    const msb=getMonthStartBalance(curYear,curMonth);
    renderKPI(msb);renderAccounts();renderCashflow(msb);renderOverdueDash();renderForecast();
    const totEl=document.querySelector('.acct-val[style*="acc"]');
    if(totEl){const t=D.accounts.reduce((s,ac)=>s+(Number(ac.balance)||0),0);totEl.textContent=fmt(t)||'0₽';}
  };
  inp.addEventListener('blur',save);
  inp.addEventListener('keydown',ev=>{if(ev.key==='Enter')inp.blur();if(ev.key==='Escape')valEl.innerHTML=fmt(cur)||'0₽';});
  e.stopPropagation();
}
function editBalance(id){
  const a=D.accounts.find(x=>x.id===id); if(!a)return;
  openItemModal('account',id);
}

function saveItem(){
  const name=document.getElementById('mName').value.trim();
  if(!name){showToast('Введите название');return;}
  const isComposite=document.getElementById('mComposite').value==='1';
  const repeat=document.getElementById('mRepeat')?.value||'monthly';
  let days=[];
  if(repeat==='lastDay'){
    const _ld=new Date(curYear,curMonth+1,0).getDate();
    days=[_ld];
  } else if(repeat==='weekly'){
    document.querySelectorAll('[id^="mWdBtn"]').forEach(b=>{if(b.dataset.sel==='1') days.push(parseInt(b.id.replace('mWdBtn','')));});
    if(!days.length) days=[1];
  } else {
    document.querySelectorAll('[id^="mDayBtn"]').forEach(b=>{if(b.dataset.sel==='1') days.push(parseInt(b.id.replace('mDayBtn','')));});
    if(!days.length) days=[1];
  }
  const taxRateEl=document.getElementById('mTaxRate');
  const taxRate=taxRateEl?parseFloat(taxRateEl.value)||0:0;

  const catKey=name.toLowerCase().replace(/[^a-zа-яё0-9]/g,'_');

  const mShared=document.getElementById('mShared');
  const sharePercent=mShared&&mShared.checked?(parseFloat(document.getElementById('mShareVal')?.value)||50):null;
  const acctId=document.getElementById('mAcctId')?.value||null;
  const partnerId=mShared&&mShared.checked?(document.getElementById('mPartnerId')?.value||null):null;
  const moneyTo=mShared&&mShared.checked?(document.getElementById('mMoneyTo')?.value||'split'):null;
  const weekDays=repeat==='weekly'?[...days]:undefined;
  const iconUrl=document.getElementById('mIconUrl')?.value.trim()||null;
  const itemData={category:name,categoryKey:catKey,icon:_modalIcon,iconUrl:iconUrl||null,taxRate,sharePercent,acctId,partnerId,moneyTo,weekDays};
  if(days&&days.length) itemData.days=days;

  if(isComposite){
    itemData.composite=true;
    itemData.amount=0;
    itemData.repeat=repeat;
    itemData.subItems=_modalSubItems.filter(s=>s.name.trim());
  } else {
    const amount=parseFloat(document.getElementById('mAmount').value)||0;
    itemData.composite=false;
    itemData.amount=amount;
    itemData.repeat=repeat;
    itemData.subItems=[];
  }

  const tp=editingId?(D.items.find(x=>x.id===editingId)?.type||modalType):modalType;
  if(editingId){
    const it=D.items.find(x=>x.id===editingId);
    if(it){
      Object.assign(it,itemData);
      if(repeat==='weekly'){it._refYear=curYear;it._refMonth=curMonth;}else{delete it._refYear;delete it._refMonth;}
    }
  } else {
    const newItem={id:uid(),type:tp,...itemData};
    if(repeat==='weekly'){newItem._refYear=curYear;newItem._refMonth=curMonth;}
    D.items.push(newItem);
  }
  closeModal(); pushData(); rerender(); showToast('✓ Сохранено');
}

function delItem(cat,id){
  if(!confirm('Удалить?'))return;
  if(cat==='account')D.accounts=D.accounts.filter(x=>x.id!==id);
  else D.items=D.items.filter(x=>x.id!==id);
  closeModal(); pushData(); rerender(); showToast('Удалено');
}

function rerender(){
  const _st=saveOpenState(), _sy=window.scrollY;
  renderAll();
  restoreOpenState(_st);
  document.querySelectorAll('.pvz-group-body.open, .cat-body:not(.collapsed), .cat-tile-body.open').forEach(el=>{el.style.transition='none';});
  window.scrollTo(0,_sy);
  requestAnimationFrame(()=>{document.querySelectorAll('.pvz-group-body, .cat-body, .cat-tile-body').forEach(el=>{el.style.transition='';});});
}
function closeModal(){document.getElementById('itemModal').classList.remove('open');}
document.getElementById('itemModal').addEventListener('click',e=>{if(e.target===document.getElementById('itemModal'))closeModal();});

// ══════════════════════════════════
// TAX SETTINGS
// ══════════════════════════════════
function saveTaxRate(){D.settings.taxRate=parseFloat(document.getElementById('taxRate').value)||7;pushData();rerender();}
function saveTaxBase(){D.settings.taxBase=document.getElementById('taxBase').value;pushData();rerender();}

function togglePaid(){D.settings.paidToday=document.getElementById('paidToday').checked;pushData();rerender();}

// ══════════════════════════════════
// NAV
// ══════════════════════════════════
function showView(id,btn){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.querySelectorAll('.tbb,.ntab').forEach(b=>b.classList.remove('active'));
  document.getElementById('view-'+id).classList.add('active');
  ['tbb-','dtbb-'].forEach(p=>{const b=document.getElementById(p+id);if(b)b.classList.add('active');});
  if(id==='feed') renderFeed();
}
function chMonth(d){
  const _sy=window.scrollY;
  curMonth+=d;
  if(curMonth>11){curMonth=0;curYear++;}
  if(curMonth<0){curMonth=11;curYear--;}
  renderAll();
  requestAnimationFrame(()=>window.scrollTo(0,_sy));
}
function chFcMonth(d){
  chMonth(d);
}

// ══════════════════════════════════
// INIT
// ══════════════════════════════════
initApp();
</script>
