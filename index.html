<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Кассовый план</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#080b12;--s1:rgba(18,22,32,0.88);--s2:rgba(24,28,40,0.78);--s3:rgba(30,35,48,0.66);--s4:rgba(38,43,58,0.54);--s5:rgba(46,52,68,0.44);
  --brd:rgba(255,255,255,0.06);--brd2:rgba(255,255,255,0.10);
  --acc:#34d399;--acc-d:rgba(52,211,153,0.12);--acc-m:rgba(52,211,153,0.22);
  --blue:#60a5fa;--blue-d:rgba(96,165,250,0.12);
  --red:#f87171;--red-d:rgba(248,113,113,0.12);
  --amber:#fbbf24;--amber-d:rgba(251,191,36,0.12);
  --grn:#4ade80;--grn-d:rgba(74,222,128,0.12);
  --plan:#818cf8;--plan-d:rgba(129,140,248,0.12);
  --t1:#f0f4f8;--t2:#94a3b8;--t3:#4b5a6e;--t4:#2a3344;
  --r:16px;--rsm:10px;
  --f:'Inter',-apple-system,sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--t1);font-family:var(--f);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100dvh;background-image:radial-gradient(ellipse at 25% 30%,rgba(52,211,153,.04) 0%,transparent 60%),radial-gradient(ellipse at 75% 20%,rgba(96,165,250,.04) 0%,transparent 60%),radial-gradient(ellipse at 50% 80%,rgba(129,140,248,.03) 0%,transparent 60%)}

/* NAV */
.topbar{position:sticky;top:0;z-index:50;background:rgba(8,11,18,0.82);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-bottom:1px solid var(--brd);display:flex;align-items:center;gap:14px;padding:0 24px;height:56px;flex-shrink:0}
.logo{font-size:16px;font-weight:800;color:var(--acc);letter-spacing:-.5px}
.logo span{color:var(--t3);font-weight:400}
.nav-tabs{display:flex;gap:2px;background:var(--s3);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--brd);border-radius:var(--rsm);padding:3px;margin-left:auto}
.ntab{padding:5px 14px;border-radius:6px;border:none;background:none;color:var(--t3);font-family:var(--f);font-size:12px;font-weight:500;cursor:pointer;transition:all .15s;white-space:nowrap}
.ntab.active{background:var(--s5);color:var(--t1)}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--t3);flex-shrink:0;transition:background .3s}
.sync-dot.ok{background:var(--grn)}
.sync-dot.sync{background:var(--amber);animation:pulse .8s infinite}
.sync-dot.err{background:var(--red)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.2}}
.sync-label{font-size:11px;color:var(--t3);white-space:nowrap}

/* VIEWS */
.view{display:none;padding:28px 24px;max-width:1200px;margin:0 auto}
.view.active{display:block}
@media(max-width:599px){.view{padding:16px 12px}}

/* ══ DASHBOARD ══ */
/* top KPI bar */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:28px}
.kpi{background:var(--s2);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--brd);border-radius:var(--r);padding:18px 20px;box-shadow:0 4px 24px rgba(0,0,0,.3)}
.kpi-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.7px;color:var(--t3);margin-bottom:8px}
.kpi-val{font-size:24px;font-weight:800;line-height:1;letter-spacing:-.5px}
.kpi-val.g{color:var(--grn)}.kpi-val.r{color:var(--red)}.kpi-val.a{color:var(--acc)}.kpi-val.b{color:var(--blue)}.kpi-val.p{color:var(--plan)}.kpi-val.am{color:var(--amber)}
.kpi-sub{font-size:11px;color:var(--t3);margin-top:4px}

/* ACCOUNTS */
.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.section-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--t3);padding:0 2px}

.accounts-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-bottom:28px}
.acct-card{background:var(--s2);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--brd);border-radius:var(--r);padding:16px 18px;cursor:pointer;transition:border-color .15s;box-shadow:0 4px 20px rgba(0,0,0,.25);-webkit-tap-highlight-color:transparent}
.acct-card:hover{border-color:var(--brd2)}
.acct-card.editing{border-color:var(--acc);background:var(--acc-d)}
.acct-name{font-size:12px;font-weight:600;color:var(--t2);margin-bottom:8px;display:flex;align-items:center;gap:8px}
.acct-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.acct-val{font-size:22px;font-weight:700;letter-spacing:-.3px;color:var(--t1)}
.acct-input{width:100%;background:none;border:none;outline:none;font-family:var(--f);font-size:19px;font-weight:700;color:var(--t1);padding:0}

/* DAILY CASHFLOW TABLE */
.cf-wrap{overflow-x:auto;border-radius:var(--r);border:1px solid var(--brd);margin-bottom:28px;background:var(--s1);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 4px 24px rgba(0,0,0,.3)}
.cf-table{border-collapse:collapse;min-width:100%;font-size:13px}
.cf-table th{background:rgba(24,28,40,0.95);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--brd);border-right:1px solid var(--brd);padding:10px 14px;white-space:nowrap;font-weight:600;color:var(--t2);text-align:right;position:sticky;top:0;z-index:10}
.cf-table th:first-child{text-align:left;position:sticky;left:0;z-index:20;background:rgba(30,35,48,0.96);min-width:200px}
.cf-table th.today-col{background:rgba(52,211,153,.08)!important;color:var(--acc)!important;border-bottom:2px solid var(--acc)!important}
.cf-table td{border-right:1px solid var(--brd);border-bottom:1px solid rgba(255,255,255,.03);padding:9px 14px;text-align:right;vertical-align:middle;white-space:nowrap}
.cf-table td:first-child{text-align:left;position:sticky;left:0;z-index:5;background:rgba(24,28,40,0.93);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-right:1px solid var(--brd);font-weight:500;font-size:13px;padding:9px 14px}
.cf-table tr:hover td{background:rgba(255,255,255,.02)}
.cf-table tr:hover td:first-child{background:rgba(30,35,48,0.95)}
/* weekend */
th.we-col{opacity:.6}
td.we-col{background:rgba(248,113,113,.015)!important}
/* today */
td.today-col{background:rgba(52,211,153,.03)!important;border-left:1px solid rgba(52,211,153,.12)!important;border-right:1px solid rgba(52,211,153,.12)!important}
/* danger */
td.danger{color:var(--red)!important;font-weight:700}
td.warning{color:var(--amber)!important;font-weight:600}
/* row types */
tr.row-income td:first-child{color:var(--grn)}
tr.row-expense td:first-child{color:var(--red)}
tr.row-tax td:first-child{color:var(--amber)}
tr.row-balance td{font-weight:700;font-size:14px}
tr.row-balance td.danger{background:rgba(248,113,113,.06)!important}
tr.row-balance td.warning{background:rgba(251,191,36,.04)!important}
tr.row-balance td:first-child{color:var(--acc);font-size:12px;background:var(--s3)!important}
tr.row-section td{background:var(--s3)!important;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--t3);padding:12px 14px 6px}
tr.row-section td:first-child{background:var(--s4)!important}
tr.row-total td{border-top:1.5px solid var(--brd2);font-weight:700;background:rgba(255,255,255,.02)!important}
tr.row-total td:first-child{background:var(--s3)!important;color:var(--t2)}

/* val cells */
.val-pos{color:var(--grn)}.val-neg{color:var(--red)}.val-zero{color:var(--t4)}
.val-bal-ok{color:var(--acc)}.val-bal-warn{color:var(--amber)}.val-bal-bad{color:var(--red)}

/* month nav */
.month-nav{display:flex;align-items:center;gap:12px;margin-bottom:24px}
.mnav-btn{width:36px;height:36px;background:var(--s3);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--brd);color:var(--t1);border-radius:var(--rsm);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:background .1s;flex-shrink:0}
.mnav-btn:hover{background:var(--s4)}
.month-label{font-size:18px;font-weight:700;color:var(--t1)}
.month-sub{font-size:13px;color:var(--t3);margin-left:10px}

/* ══ SETTINGS ══ */
.settings-section{background:var(--s2);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--brd);border-radius:var(--r);margin-bottom:24px;overflow:hidden;box-shadow:0 4px 24px rgba(0,0,0,.3)}
.settings-section-title{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--brd);background:var(--s3);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.ss-title{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--t2)}
.ss-add-btn{background:var(--acc-d);border:1px solid rgba(52,211,153,.25);color:var(--acc);font-family:var(--f);font-size:12px;font-weight:600;padding:5px 12px;border-radius:6px;cursor:pointer;transition:all .12s}
.ss-add-btn:hover{background:var(--acc-m)}

.item-row{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--brd);transition:background .1s}
.item-row:last-child{border-bottom:none}
.item-row:hover{background:rgba(255,255,255,.02)}
.item-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;cursor:pointer}
.item-name{flex:1;font-size:14px;font-weight:500;color:var(--t1);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item-amount{font-size:14px;font-weight:600;min-width:100px;text-align:right}
.item-amount.inc{color:var(--grn)}.item-amount.exp{color:var(--red)}.item-amount.tax{color:var(--amber)}
.item-day-badge{background:rgba(38,43,58,0.7);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--brd);border-radius:6px;padding:3px 8px;font-size:12px;font-weight:600;color:var(--t2);white-space:nowrap;flex-shrink:0}
.item-repeat-badge{background:rgba(129,140,248,.12);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(129,140,248,.2);border-radius:6px;padding:3px 8px;font-size:11px;font-weight:600;color:var(--plan);white-space:nowrap;flex-shrink:0}
.item-edit{background:none;border:none;color:var(--t3);cursor:pointer;font-size:13px;padding:2px 6px;border-radius:4px;line-height:1;flex-shrink:0;font-family:var(--f);transition:color .1s}
.item-edit:hover{color:var(--t1);background:var(--s4)}
.auto-tag{background:var(--amber-d);border:1px solid rgba(251,191,36,.25);color:var(--amber);font-size:10px;font-weight:700;padding:2px 6px;border-radius:4px;white-space:nowrap}

/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);z-index:100;display:none;align-items:flex-end;justify-content:center}
.overlay.open{display:flex}
@media(min-width:600px){.overlay{align-items:center}}
.modal{background:var(--s2);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid var(--brd2);border-radius:20px 20px 0 0;width:100%;max-width:520px;padding:24px 24px 40px;max-height:92dvh;overflow-y:auto;box-shadow:0 -8px 40px rgba(0,0,0,.4)}
@media(min-width:600px){.modal{border-radius:16px;max-height:80vh}}
.mhandle{width:36px;height:4px;background:var(--s5);border-radius:2px;margin:0 auto 18px}
.mtitle{font-size:19px;font-weight:700;margin-bottom:22px}
.frow{margin-bottom:18px}
.flabel{display:block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:var(--t3);margin-bottom:8px}
.finput,.fselect{width:100%;background:var(--s3);border:1.5px solid var(--brd);border-radius:10px;padding:14px 16px;color:var(--t1);font-family:var(--f);font-size:15px;outline:none;transition:border-color .15s;-webkit-appearance:none;appearance:none}
.finput:focus,.fselect:focus{border-color:var(--acc)}
.finput.small{font-size:14px;padding:10px 12px}
.frow-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mbtns{display:flex;gap:10px;margin-top:24px}
.mbtn{flex:1;padding:14px;border-radius:10px;border:1.5px solid var(--brd2);background:var(--s3);color:var(--t1);font-family:var(--f);font-size:14px;font-weight:600;cursor:pointer;transition:all .15s}
.mbtn:active{opacity:.8}
.mbtn.ok{background:var(--acc-d);color:var(--acc);border-color:rgba(52,211,153,.3)}
.mbtn.danger{background:var(--red-d);color:var(--red);border-color:rgba(248,113,113,.2)}

/* COLOR SWATCHES */
.cswatches{display:flex;gap:8px;flex-wrap:wrap}
.csw{width:28px;height:28px;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:transform .1s,border-color .1s}
.csw.sel{border-color:var(--t1);transform:scale(1.15)}

/* TOAST */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(12px);background:var(--s4);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--brd2);border-radius:20px;padding:10px 20px;font-size:13px;font-weight:500;color:var(--t1);opacity:0;transition:all .2s;pointer-events:none;white-space:nowrap;z-index:300}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* LOADING */
.loader{position:fixed;inset:0;background:var(--bg);z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:opacity .4s}
.loader.done{opacity:0;pointer-events:none}
.spin{width:34px;height:34px;border:2.5px solid var(--s4);border-top-color:var(--acc);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loader-text{font-size:13px;color:var(--t3);font-weight:500}

/* DANGER ZONE at bottom */
.free-money-bar{display:flex;align-items:center;justify-content:space-between;background:var(--s2);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--brd);border-radius:var(--r);padding:20px 24px;margin-bottom:28px;gap:20px;flex-wrap:wrap;box-shadow:0 4px 24px rgba(0,0,0,.3)}
.fm-label{font-size:13px;color:var(--t3);font-weight:600;text-transform:uppercase;letter-spacing:.6px}
.fm-val{font-size:32px;font-weight:800;letter-spacing:-.5px}
.fm-val.ok{color:var(--acc)}.fm-val.warn{color:var(--amber)}.fm-val.bad{color:var(--red)}
.fm-desc{font-size:12px;color:var(--t3);margin-top:2px}

.cat-header{display:flex;align-items:center;gap:8px;padding:12px 20px;cursor:pointer;user-select:none;border-bottom:1px solid var(--brd);position:relative;border-left:3px solid transparent}
.cat-header.inc{border-left-color:var(--grn);background:linear-gradient(90deg,rgba(74,222,128,.08),var(--s3))}
.cat-header.exp{border-left-color:var(--red);background:linear-gradient(90deg,rgba(248,113,113,.08),var(--s3))}
.cat-header::before{content:'▼';margin-right:8px;font-size:8px;transition:transform .15s;color:var(--t3)}
.cat-header.collapsed::before{transform:rotate(-90deg)}
.cat-body{overflow:hidden;transition:max-height .2s;margin:0 0 10px 18px;border-left:2px solid var(--brd);padding-left:6px}
.cat-body.collapsed{max-height:0!important;border-left-color:transparent}
.cat-body .item-row{padding-left:14px;border-left:2px solid var(--brd);margin-top:2px;border-radius:0 6px 6px 0}
.cat-body .item-row:last-child{border-bottom:none}
.cat-body .item-row:hover{background:rgba(255,255,255,.02)}
.ie-amt{background:var(--s3);border:1px solid var(--brd2);border-radius:4px;color:var(--t1);font-family:var(--f);font-size:inherit;width:80px;padding:2px 6px;outline:none;font-weight:600;text-align:right}
.ie-rep{background:var(--plan-d);border:1px solid rgba(129,140,248,.2);border-radius:4px;color:var(--plan);font-family:var(--f);font-size:10px;padding:1px 4px;outline:none;font-weight:600}
.ie-day{background:var(--s3);border:1px solid var(--brd2);border-radius:4px;color:var(--t1);font-family:var(--f);font-size:inherit;width:50px;padding:2px 6px;outline:none;font-weight:600;text-align:center}
.cal-popup{background:var(--s4);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid var(--brd2);border-radius:14px;padding:10px;width:210px;position:fixed;z-index:300;transform:translateX(-50%);box-shadow:0 8px 40px rgba(0,0,0,.6)}
.cal-title{font-size:11px;font-weight:700;text-align:center;color:var(--t1);margin-bottom:6px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-wd{font-size:8px;font-weight:700;text-align:center;color:var(--t3);padding:3px 0}
.cal-emp{height:0}
.cal-day{font-size:12px;font-weight:600;text-align:center;padding:5px 2px;border-radius:8px;cursor:pointer;color:var(--t2);transition:all .1s}
.cal-day:hover{background:var(--s5);color:var(--t1)}
.cal-day.sel{background:var(--acc);color:var(--bg);font-weight:800}
.item-day-badge[data-id]{position:relative}
.item-amount[data-id],.item-day-badge[data-id],.item-repeat-badge[data-id]{cursor:pointer}
.tg{position:relative;display:inline-block;width:44px;height:26px;flex-shrink:0;cursor:pointer}
.tg input{opacity:0;width:0;height:0}
.tg-s{position:absolute;inset:0;background:var(--s5);border-radius:13px;transition:.25s}
.tg-s::before{content:'';position:absolute;width:20px;height:20px;border-radius:50%;background:var(--t3);top:3px;left:3px;transition:.25s}
.tg input:checked+.tg-s{background:var(--acc-d)}
.tg input:checked+.tg-s::before{background:var(--acc);transform:translateX(18px)}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:var(--s5);border-radius:3px}
@media(max-width:599px){
  body{font-size:13px}
  .cf-table{font-size:11px}
  .cf-table td{padding:7px 8px}
  .cf-table td:first-child{padding:7px 10px;font-size:12px}
  .cf-table th{padding:8px 8px}
  .cf-table th:first-child{min-width:140px}
  .kpi-grid{gap:8px;margin-bottom:16px}
  .kpi{padding:12px 14px}
  .kpi-label{font-size:9px}
  .kpi-val{font-size:18px}
  .acct-card{padding:12px 14px}
  .acct-val{font-size:17px}
  .accounts-grid{gap:8px;margin-bottom:16px}
  .item-row{padding:10px 14px;gap:8px}
  .item-name{font-size:13px}
  .item-amount{font-size:13px;min-width:60px}
  .item-day-badge{font-size:11px;padding:2px 7px}
  .item-repeat-badge{font-size:10px;padding:2px 6px}
  .cat-header{padding:10px 14px}
  .cat-body .item-row{padding-left:10px}
  .settings-section{margin-bottom:16px}
  .settings-section-title{padding:12px 14px}
  .ss-title{font-size:12px}
  .modal{padding:18px 18px 28px}
  .finput,.fselect{font-size:14px;padding:12px 14px}
  .month-nav{gap:8px;margin-bottom:16px}
  .month-label{font-size:15px}
  .fm-val{font-size:22px}
  .section-title{font-size:11px}
  .cat-header::before{font-size:8px}
  .topbar{padding:0 12px}
  .logo{font-size:13px}
  .free-money-bar{padding:14px 16px;margin-bottom:16px}
  .cf-wrap{margin-bottom:16px}
}
</style>
</head>
<body>

<div class="loader" id="loader">
  <div class="spin"></div>
  <div class="loader-text" id="loaderTxt">Подключение…</div>
</div>

<div class="topbar">
  <div class="logo">КП <span>/ Кассовый план</span></div>
  <div class="nav-tabs">
    <button class="ntab active" onclick="showView('dashboard',this)">Дашборд</button>
    <button class="ntab" onclick="showView('settings',this)">Настройки</button>
  </div>
  <div class="sync-dot" id="sdot"></div>
  <div class="sync-label" id="slabel">—</div>
</div>

<!-- ════ DASHBOARD ════ -->
<div class="view active" id="view-dashboard">

  <div class="month-nav">
    <button class="mnav-btn" onclick="chMonth(-1)">‹</button>

// ══════════════════════════════════
// CASHFLOW LOGIC
// ══════════════════════════════════
function buildDailyCF(year,month,startOverride){
  const days=getDays(year,month);
  const taxRate=(D.settings.taxRate||7)/100;
  const taxBase=D.settings.taxBase||'all';

  // quarters: Q1=Mar, Q2=Jun, Q3=Sep, Q4=Dec
  const taxMonths=[2,5,8,11];
  const isTaxMonth=taxMonths.includes(month);

  // starting balance — use override if given, else current accounts sum
  const rawBalance=D.accounts.reduce((s,a)=>s+(Number(a.balance)||0),0);
  const startBalance=startOverride!==undefined?startOverride:rawBalance;

  // build day-level events
  const events={};
  for(let d=1;d<=days;d++)events[d]=[];

  // income items
  const incomes=D.items.filter(i=>i.type==='income'&&(Number(i.amount)||0)>0);
  for(const item of incomes){
    const amt=Number(item.amount);
    const dlist=itemDays(item);
    for(const d0 of dlist){
      if(item.repeat==='weekly'){
        for(let d2=d0;d2<=days;d2+=7){
          events[d2].push({name:item.category,amount:amt,type:'income',color:item.color,id:item.id});
          if(isTaxMonth&&item.taxable&&amt>0){
            const taxOk=taxBase==='all'||(taxBase==='pvz'&&item.pvzAddr)||(taxBase==='pvz_w'&&(item.pvzAddr||item.categoryKey==='w'));
            if(taxOk) events[d2].push({name:'Налог',amount:-Math.round(amt*taxRate),type:'tax',color:'#fbbf24',auto:true});
          }
        }
      } else if(item.repeat==='monthly'||item.repeat===undefined||item.repeat==='once'){
        const d=Math.min(d0,days);
        events[d].push({name:item.category,amount:amt,type:'income',color:item.color,id:item.id});
        if(isTaxMonth&&item.taxable&&amt>0){
          const taxOk=taxBase==='all'||(taxBase==='pvz'&&item.pvzAddr)||(taxBase==='pvz_w'&&(item.pvzAddr||item.categoryKey==='w'));
          if(taxOk) events[d].push({name:'Налог',amount:-Math.round(amt*taxRate),type:'tax',color:'#fbbf24',auto:true});
        }
      }
    }
  }

  // compute total tax for KPI
  let taxableIncome=0;
  for(const item of incomes){
    if(!item.taxable)continue;
    if(taxBase==='pvz'&&!item.pvzAddr)continue;
    if(taxBase==='pvz_w'&&!item.pvzAddr&&item.categoryKey!=='w')continue;
    taxableIncome+=Number(item.amount)||0;
  }
  const taxAmount=Math.round(taxableIncome*taxRate);

  // expense items — salary is handled separately
  const expenses=D.items.filter(i=>i.type==='expense'&&(Number(i.amount)||0)>0&&i.categoryKey!=='zp');
  for(const item of expenses){
    const dlist=itemDays(item);
    for(const d0 of dlist){
      const d=Math.min(d0,days);
      if(item.repeat==='weekly'){
        for(let d2=d;d2<=days;d2+=7){
          events[d2].push({name:item.category,amount:-Number(item.amount),type:'expense',color:item.color,id:item.id});
        }
      } else if(item.repeat==='monthly'||item.repeat===undefined||item.repeat==='once'){
        events[d].push({name:item.category,amount:-Number(item.amount),type:'expense',color:item.color,id:item.id});
      } else if(item.repeat==='quarterly'){
        events[d].push({name:item.category,amount:-Number(item.amount),type:'expense',color:item.color,id:item.id});
      }
    }
  }

  // salary: auto 5th & 20th from shiftCost
  const salaryItems=D.items.filter(i=>i.categoryKey==='zp'&&(Number(i.amount)||0)>0);
  if(salaryItems.length){
    let pm=month-1,py=year; if(pm<0){pm=11;py--;}
    const pmd=getDays(py,pm); // days in previous month
    const days5=pmd-15; // 16..last inclusive
    const days20=15;    // 1..15 inclusive
    for(const item of salaryItems){
      const sc=Number(item.amount)||0;
      const pvzName=(PVZ_LIST.find(p=>p.key===item.pvzAddr)||{}).name||item.pvzAddr||'';
      const d5=Math.min(5,days), d20=Math.min(20,days);
      if(d5<=days) events[d5].push({name:pvzName+' — аванс',amount:-Math.round(sc*days5),type:'expense',color:item.color,id:item.id});
      if(d20<=days) events[d20].push({name:pvzName+' — зп',amount:-Math.round(sc*days20),type:'expense',color:item.color,id:item.id});
    }
  }

  // build daily running balance
  const daily=[];
  let balance=startBalance;
  for(let d=1;d<=days;d++){
    const dayEvents=events[d];
    const dayIncome=dayEvents.filter(e=>e.type==='income').reduce((s,e)=>s+e.amount,0);
    let dayExpense=dayEvents.filter(e=>e.type!=='income').reduce((s,e)=>s+e.amount,0);
    if(isToday(year,month,d)&&D.settings.paidToday) dayExpense=0;
    const dayNet=dayIncome+dayExpense;
    balance+=dayNet;
    daily.push({d,events:dayEvents,income:dayIncome,expense:dayExpense,net:dayNet,balance,we:isWe(year,month,d),tod:isToday(year,month,d)});
  }

  return {daily,startBalance:rawBalance,taxAmount,taxableIncome,isTaxMonth};
}

// compute projected balance at day 1 of (year,month)
function getMonthStartBalance(year,month){
  const now=new Date(), cy=now.getFullYear(), cm=now.getMonth(), cd=now.getDate();
  const current=D.accounts.reduce((s,a)=>s+(Number(a.balance)||0),0);

  // same month → undo events from day 1 to yesterday
  if(year===cy&&month===cm){
    const cf=buildDailyCF(year,month,0);
    let net=0;
    for(let d=1;d<cd;d++) net+=cf.daily[d-1]?.net||0;
    return current-net;
  }

  // past month → undo all events from target day 1 to today
  if(year<cy||(year===cy&&month<cm)){
    let net=0, y=year, m=month;
    while(y<cy||(y===cy&&m<=cm)){
      const cf=buildDailyCF(y,m,0);
      const dim=getDays(y,m);
      for(let d=1;d<=dim;d++){
        if(y===year&&m===month&&d===1) continue;
        if(y===cy&&m===cm&&d>cd) break;
        net+=cf.daily[d-1]?.net||0;
      }
      m++; if(m>11){m=0;y++;}
    }
    return current-net;
  }

  // future month → add events from today to end of prev month
  let net=0, y=cy, m=cm;
  while(y<year||(y===year&&m<month)){
    const cf=buildDailyCF(y,m,0);
    const dim=getDays(y,m);
    for(let d=1;d<=dim;d++){
      if(y===cy&&m===cm&&d<cd) continue;
      net+=cf.daily[d-1]?.net||0;
    }
    m++; if(m>11){m=0;y++;}
  }
  return current+net;
}

function renderAll(){
  document.getElementById('monthLabel').textContent=MONTHS[curMonth]+' '+curYear;
  document.getElementById('monthSub').textContent='';
  const msb=getMonthStartBalance(curYear,curMonth);
  renderKPI(msb);
  renderAccounts();
  renderCashflow(msb);
  renderSettings();
  // restore tax settings inputs
  document.getElementById('taxRate').value=D.settings.taxRate||7;
  document.getElementById('taxBase').value=D.settings.taxBase||'all';
  document.getElementById('paidToday').checked=D.settings.paidToday||false;
}

function renderKPI(msb){
  const {daily,startBalance,taxAmount,taxableIncome}=buildDailyCF(curYear,curMonth,msb);
  const totalIncome=D.items.filter(i=>i.type==='income').reduce((s,i)=>s+(Number(i.amount)||0),0);
  const totalExpense=daily.reduce((s,d)=>s+Math.abs(d.expense),0)+taxAmount;
  const endBalance=daily.length?daily[daily.length-1].balance:startBalance;
  const freeMoney=endBalance; // balance at end of month = free

  document.getElementById('kpiGrid').innerHTML=[
    {label:'Текущий баланс', val:fmtK(startBalance), cls:startBalance<0?'r':startBalance<50000?'am':'a'},
    {label:'Прогноз доходов', val:fmtK(totalIncome), cls:'g'},
    {label:'Прогноз расходов', val:fmtK(totalExpense), cls:'r'},
    {label:'Налог '+((D.settings.taxRate)||7)+'%', val:fmtK(taxAmount), cls:'am'},
    {label:'Остаток конец мес.', val:fmtK(endBalance), cls:endBalance<0?'r':endBalance<30000?'am':'a'},
  ].map(k=>`<div class="kpi"><div class="kpi-label">${k.label}</div><div class="kpi-val ${k.cls}">${k.val}</div></div>`).join('');

  const freeCls=freeMoney<0?'bad':freeMoney<50000?'warn':'ok';
  const freeDesc=freeMoney<0?'⚠ Кассовый разрыв! Нужно пополнить счета или сократить расходы':
    freeMoney<50000?'Мало свободных денег — проверь расходы':'Прогноз положительный';
  document.getElementById('freeMoneyBar').innerHTML=`
    <div>
      <div class="fm-label">Свободные деньги на конец месяца</div>
      <div class="fm-val ${freeCls}">${fmt(freeMoney)}</div>
      <div class="fm-desc">${freeDesc}</div>
    </div>
    <div style="text-align:right">
      <div style="font-size:11px;color:var(--t3);margin-bottom:4px">Начало месяца</div>
      <div style="font-size:16px;font-weight:700;color:var(--t2)">${fmt(startBalance)}</div>
    </div>`;
}

function renderAccounts(){

function renderCashflow(msb){
  const {daily}=buildDailyCF(curYear,curMonth,msb);
  const incomeItems=D.items.filter(i=>i.type==='income'&&(Number(i.amount)||0)>0);
  const expItems=D.items.filter(i=>i.type==='expense'&&(Number(i.amount)||0)>0);

  const itemDayMap={}; // itemId -> {day: amount}
  const taxDayMap={};

  for(const day of daily){
    for(const ev of day.events){
      if(ev.auto){taxDayMap[day.d]=(taxDayMap[day.d]||0)+Math.abs(ev.amount);}
      else if(ev.id){
        if(!itemDayMap[ev.id])itemDayMap[ev.id]={};
        itemDayMap[ev.id][day.d]=Math.abs(ev.amount);
      }
    }
  }

  const days=daily.length;
  const cols=daily;

  let html='<thead><tr><th class="row-head">Статья</th>';
  for(const day of cols){
    const cl=(day.we?'we-col':'')+(day.tod?' today-col':'');
    html+=`<th class="${cl}" style="min-width:56px"><div style="font-size:12px;font-weight:700">${day.d}</div><div style="font-size:9px;opacity:.5;margin-top:1px">${WD[getWd(curYear,curMonth,day.d)]}</div></th>`;
  }
  html+='</tr></thead><tbody>';

  // ── INCOME (grouped by categoryKey) ──
  html+=`<tr class="row-section"><td colspan="${days+1}">Доходы</td></tr>`;

  const incGroups={};
  for(const item of incomeItems){
    const key=item.categoryKey||item.id;
    if(!incGroups[key]) incGroups[key]={name:item.category||item.id,items:[]};
    incGroups[key].items.push(item);
  }
  for(const [key,grp] of Object.entries(incGroups)){
    html+=`<tr class="row-income"><td>${grp.name}</td>`;
    for(const day of cols){
      const v=grp.items.reduce((s,it)=>s+((itemDayMap[it.id]||{})[day.d]||0),0);
      const cl=(day.we?'we-col':'')+(day.tod?' today-col':'');
      html+=`<td class="${cl} ${v?'val-pos':'val-zero'}">${v?fmt(v):''}</td>`;
    }
    html+='</tr>';
  }
  html+=`<tr class="row-total"><td>Итого доходов</td>`;
  for(const day of cols){
    const cl=(day.we?'we-col':'')+(day.tod?' today-col':'');
    html+=`<td class="${cl} ${day.income?'val-pos':'val-zero'}">${day.income?fmt(day.income):''}</td>`;
  }
  html+='</tr>';

  // ── EXPENSES (per PVZ, all categories aggregated) ──
  html+=`<tr class="row-section"><td colspan="${days+1}">Расходы по ПВЗ</td></tr>`;

  const pvzExpDayMap={}; // pvzAddr -> {day: totalAmount}
  for(const item of expItems.filter(i=>i.pvzAddr)){
    const dm=itemDayMap[item.id]||{};
    for(const [d,v] of Object.entries(dm)){
      if(!pvzExpDayMap[item.pvzAddr]) pvzExpDayMap[item.pvzAddr]={};
      pvzExpDayMap[item.pvzAddr][d]=(pvzExpDayMap[item.pvzAddr][d]||0)+v;
    }
  }

  for(const pvz of PVZ_LIST){
    const dm=pvzExpDayMap[pvz.key]||{};
    if(!Object.values(dm).some(v=>v>0)) continue;
    html+=`<tr class="row-expense"><td style="padding-left:12px">
      <div style="display:flex;align-items:center;gap:6px">
        <div style="width:6px;height:6px;border-radius:50%;background:${pvz.color};flex-shrink:0"></div>
        ${pvz.name}
      </div></td>`;
    for(const day of cols){
      const v=dm[day.d]||0;
      const cl=(day.we?'we-col':'')+(day.tod?' today-col':'');
      html+=`<td class="${cl} ${v?'val-neg':'val-zero'}">${v?fmt(v):''}</td>`;
    }
    html+='</tr>';
  }

  // non-PVZ expenses
  const genExpItems=expItems.filter(i=>!i.pvzAddr);
  if(genExpItems.length){
    html+=`<tr class="row-section"><td colspan="${days+1}">Общие расходы</td></tr>`;
    for(const item of genExpItems){
      html+=`<tr class="row-expense"><td>${item.category||item.id}</td>`;
      for(const day of cols){
        const v=itemDayMap[item.id]?itemDayMap[item.id][day.d]:0;
        const cl=(day.we?'we-col':'')+(day.tod?' today-col':'');
        html+=`<td class="${cl} ${v?'val-neg':'val-zero'}">${v?fmt(v):''}</td>`;
      }
      html+='</tr>';
    }
  }

  // tax
  const hasTax=Object.values(taxDayMap).some(v=>v>0);
  if(hasTax){
    html+=`<tr class="row-tax"><td>Налог УСН ${D.settings.taxRate||7}% <span class="auto-tag">авто</span></td>`;
    for(const day of cols){
      const v=taxDayMap[day.d]||0;
      const cl=(day.we?'we-col':'')+(day.tod?' today-col':'');
      html+=`<td class="${cl} ${v?'val-neg':'val-zero'}">${v?fmt(v):''}</td>`;
    }
    html+='</tr>';
  }

  html+=`<tr class="row-total"><td>Итого расходов</td>`;
  for(const day of cols){
    const cl=(day.we?'we-col':'')+(day.tod?' today-col':'');
    const v=Math.abs(day.expense)+(taxDayMap[day.d]||0);
    html+=`<td class="${cl} ${v?'val-neg':'val-zero'}">${v?fmt(v):''}</td>`;
  }
  html+='</tr>';

  // ── BALANCE ──
  html+=`<tr class="row-section"><td colspan="${days+1}">Баланс</td></tr>`;
  html+=`<tr class="row-balance"><td>Остаток на конец дня</td>`;
  for(const day of cols){
    const b=day.balance;
    const balCls=b<0?'danger':b<50000?'warning':'';
    const cl=(day.we?'we-col':'')+(day.tod?' today-col':'');
    html+=`<td class="${cl} ${balCls}">${fmt(b)}</td>`;
  }
  html+='</tr>';

  html+='</tbody>';
  document.getElementById('cfTable').innerHTML=html;
  setTimeout(()=>{
    const tc=document.querySelector('.cf-table th.today-col');
    if(tc)tc.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});
  },100);
}

}

        <div style="font-size:12px;font-weight:600;color:var(--grn)">${svcTotal?fmt(svcTotal):'—'}</div>

      for(const pvz of PVZ_LIST){
        const item=svcItems.find(i=>i.pvzAddr===pvz.key);
        if(!item) continue;
        incHtml+=`<div class="item-row" style="padding-left:20px">
          <div class="item-dot" style="background:${pvz.color};opacity:.6" onclick="openItemModal('income','${item.id}')"></div>
          <div class="item-name" style="font-size:12px">${pvz.name}</div>
          <div class="item-amount inc" data-id="${item.id}">${fmt(item.amount)||'—'}</div>
          <div class="item-day-badge" data-id="${item.id}">${item.days?item.days.join(', '):(item.day||'—')}</div>
          <div class="item-repeat-badge" data-id="${item.id}">${repeatLabel(item.repeat)}</div>
          <button class="item-edit" onclick="openItemModal('income','${item.id}')">✎</button>
        </div>`;
      }

      incHtml+=`</div>`;
    }
  }

  if(otherIncItems.length){
    incHtml+=subHead('Другие источники');
    incHtml+=otherIncItems.map(i=>itemRowHtml(i,'income')).join('');
  }
  document.getElementById('settingIncome').innerHTML=incHtml||'<div style="padding:16px;color:var(--t3);font-size:13px">Нет доходов</div>';

  // ── Расходы (категория → ПВЗ) ──
  const pvzExpItems=D.items.filter(i=>i.type==='expense'&&i.pvzAddr);
  const genExpItems=D.items.filter(i=>i.type==='expense'&&!i.pvzAddr);
  let expHtml='';

  if(pvzExpItems.length){
    expHtml+=subHead('Расходы');

    for(const cat of EXP_CATS){
      const catItems=pvzExpItems.filter(i=>i.categoryKey===cat.key);
      if(!catItems.length) continue;
      const catTotal=catItems.reduce((s,i)=>s+(Number(i.amount)||0),0);

      expHtml+=`<div class="cat-header exp" onclick="toggleCat(this)">
        <div style="font-size:12px;font-weight:600;color:var(--t2);flex:1">${cat.name}</div>
        <div style="font-size:12px;font-weight:600;color:var(--red)">${catTotal?fmt(catTotal):'—'}${cat.key==='zp'?' <span style="font-size:9px;color:var(--t3);font-weight:400">/смена</span>':''}</div>
      </div>
      <div class="cat-body">`;

      for(const pvz of PVZ_LIST){
        const item=catItems.find(i=>i.pvzAddr===pvz.key);

          <div class="item-amount exp" data-id="${item.id}">${fmt(item.amount)||'—'}</div>

          <button class="item-edit" onclick="openItemModal('expense','${item.id}')">✎</button>

      expHtml+=`</div>`;
    }
  }

  if(genExpItems.length){
    expHtml+=subHead('Общие расходы');
    expHtml+=genExpItems.map(i=>itemRowHtml(i,'expense')).join('');
  }

  document.getElementById('settingExpenses').innerHTML=expHtml||'<div style="padding:16px;color:var(--t3);font-size:13px">Нет расходов</div>';
}

function toggleCat(el){
  const body=el.nextElementSibling;
  if(!body||!body.classList.contains('cat-body')) return;
  el.classList.toggle('collapsed');
  body.classList.toggle('collapsed');
}

document.addEventListener('click',function(e){
  const amt=e.target.closest('.item-amount[data-id]');
  if(amt&&!amt.querySelector('input')){
    const id=amt.dataset.id, isAcct=amt.dataset.acct!==undefined;
    const item=isAcct?D.accounts.find(x=>x.id===id):D.items.find(x=>x.id===id);
    if(!item) return;
    const val=isAcct?item.balance:item.amount;
    amt.innerHTML=`<input class="ie-amt" type="number" value="${val||0}" step="${isAcct?'1000':'100'}">`;
    const inp=amt.querySelector('input');
    inp.focus(); inp.select();
    const save=()=>{
      const v=parseFloat(inp.value)||0;
      if(isAcct) item.balance=v; else item.amount=v;
      pushData(); renderAll();
    };
    inp.addEventListener('blur',save);
    inp.addEventListener('keydown',ev=>{ if(ev.key==='Enter') inp.blur(); });
    return;
  }
  const dayEl=e.target.closest('.item-day-badge[data-id]');
  if(dayEl&&!document.querySelector('.cal-popup')&&!dayEl.querySelector('input')){
    const id=dayEl.dataset.id, item=D.items.find(x=>x.id===id);
    if(!item) return;
    // multi-day: show text input with comma-separated values
    const inp=document.createElement('input');
    inp.className='ie-day';
    inp.type='text';
    inp.value=item.days?item.days.join(', '):(item.day||'1');
    inp.style.width='80px';
    dayEl.textContent=''; dayEl.appendChild(inp); inp.focus(); inp.select();
    const save=()=>{
      const raw=inp.value.trim();
      const nums=raw.split(',').map(s=>parseInt(s.trim())).filter(n=>!isNaN(n)&&n>=1&&n<=31);
      if(nums.length){item.days=nums; delete item.day;}
      else if(nums.length===1){item.days=nums;}
      pushData(); renderAll();
    };
    inp.addEventListener('blur',save);
    inp.addEventListener('keydown',ev=>{ if(ev.key==='Enter') inp.blur(); });
    return;
  }
  const rep=e.target.closest('.item-repeat-badge[data-id]');
  if(rep&&!rep.querySelector('select')){
    const id=rep.dataset.id, item=D.items.find(x=>x.id===id);
    if(!item) return;
    const sel=document.createElement('select'); sel.className='ie-rep';
    ['monthly','weekly','quarterly','once'].forEach(o=>{ const opt=document.createElement('option'); opt.value=o; opt.textContent=repeatLabel(o); if(item.repeat===o) opt.selected=true; sel.appendChild(opt); });
    rep.innerHTML=''; rep.appendChild(sel); sel.focus();
    sel.addEventListener('change',()=>{ item.repeat=sel.value; pushData(); renderAll(); });
    return;
  }
});

function repeatLabel(r){return {monthly:'Мес.',weekly:'Нед.',quarterly:'Кв.',once:'Один'}[r||'monthly']||'Мес.'}

function itemRowHtml(item,type){
  const amtCls=type==='income'?'inc':'exp';
  return `<div class="item-row">
    <div class="item-dot" style="background:${item.color}" onclick="openItemModal('${type}','${item.id}')"></div>
    <div class="item-name">${item.category||item.id}${item.taxable?'<span style="font-size:9px;color:var(--amber);margin-left:6px">УСН</span>':''}</div>
    <div class="item-amount ${amtCls}" data-id="${item.id}">${fmt(item.amount)||'—'}</div>
    <div class="item-day-badge" data-id="${item.id}">${item.days?item.days.join(', '):(item.day||'—')}</div>
    <div class="item-repeat-badge" data-id="${item.id}">${repeatLabel(item.repeat)}</div>
    <button class="item-edit" onclick="openItemModal('${type}','${item.id}')">✎</button>
  </div>`;
}

  if(type==='account'){
    titleTxt=isEdit?`Счёт: ${mo.name}`:'Новый счёт';
    body=`
      <div class="frow"><label class="flabel">Название</label>
        <input class="finput" id="mName" value="${isEdit?mo.name:''}" placeholder="Название счёта"></div>
      <div class="frow"><label class="flabel">Текущий остаток, ₽</label>
        <input class="finput" id="mBalance" type="number" value="${isEdit?mo.balance:''}" placeholder="0"></div>
      <div class="frow"><label class="flabel">Цвет</label>
        <div class="cswatches" id="cpicker"></div></div>`;
    btns=isEdit?
      `<button class="mbtn danger" onclick="delItem('account','${id}')">Удалить</button>
       <button class="mbtn" onclick="closeModal()">Отмена</button>
       <button class="mbtn ok" onclick="saveAccount()">Сохранить</button>`:
      `<button class="mbtn" onclick="closeModal()">Отмена</button>
       <button class="mbtn ok" onclick="saveAccount()">Добавить</button>`;
  } else {
    titleTxt=isEdit?`Редактировать`:(type==='income'?'Новый доход':'Новый расход');
    const isIncome=type==='income'||(isEdit&&mo&&mo.type==='income');
    body=`
      <div class="frow"><label class="flabel">Категория</label>
        <select class="fselect" id="mCategory">
          ${(isIncome?PVZ_SERVICES:EXP_CATS).map(c=>`<option value="${c.key}" ${isEdit&&mo.categoryKey===c.key?'selected':''}>${c.name}</option>`).join('')}
          <option value="__other__" ${isEdit&&!PVZ_SERVICES.some(s=>s.key===mo.categoryKey)&&!EXP_CATS.some(c=>c.key===mo.categoryKey)?'selected':''}>Другое…</option>
        </select></div>
      <div class="frow" id="mOtherCatRow" style="display:${isEdit&&!PVZ_SERVICES.some(s=>s.key===mo.categoryKey)&&!EXP_CATS.some(c=>c.key===mo.categoryKey)?'flex':'none'}"><label class="flabel">Своя категория</label>
        <input class="finput" id="mOtherCat" value="${isEdit?mo.category:''}" placeholder="Название"></div>
      <div class="frow"><label class="flabel">ПВЗ</label>
        <select class="fselect" id="mPvzAddr">
          <option value="">Не привязан к ПВЗ</option>
          ${PVZ_LIST.map(p=>`<option value="${p.key}" ${isEdit&&mo.pvzAddr===p.key?'selected':''}>${p.name}</option>`).join('')}
        </select></div>
      <div class="frow-grid">
        <div class="frow"><label class="flabel" id="mAmtLabel">${isEdit&&mo.categoryKey==='zp'?'Стоимость смены, ₽':'Сумма, ₽'}</label>
          <input class="finput" id="mAmount" type="number" value="${isEdit?(mo.amount||''):''}" placeholder="0"></div>
        <div class="frow" id="mDayRow" style="display:${isEdit&&mo.categoryKey==='zp'?'none':'block'}"><label class="flabel">Дни месяца</label>
          <input class="finput" id="mDay" type="text" value="${isEdit?(mo.days?mo.days.join(', '):(mo.day||'1')):'1'}" placeholder="1, 15, 20"></div>
      </div>
      <div class="frow" id="mRepeatRow" style="display:${isEdit&&mo.categoryKey==='zp'?'none':'block'}"><label class="flabel">Повторение</label>
        <select class="fselect" id="mRepeat">
          <option value="monthly" ${(!isEdit||mo.repeat==='monthly')?'selected':''}>Каждый месяц</option>
          <option value="weekly" ${isEdit&&mo.repeat==='weekly'?'selected':''}>Каждую неделю</option>
          <option value="quarterly" ${isEdit&&mo.repeat==='quarterly'?'selected':''}>Каждый квартал</option>
           <option value="once" ${isEdit&&mo.repeat==='once'?'selected':''}>Один</option>
        </select></div>
      ${isIncome?`
      <div class="frow"><label class="flabel">Налогооблагаемый доход (УСН)</label>
        <select class="fselect" id="mTaxable">
          <option value="1" ${(!isEdit||mo.taxable)?'selected':''}>Да</option>
          <option value="0" ${isEdit&&!mo.taxable?'selected':''}>Нет</option>
        </select></div>`:''}
      <div class="frow"><label class="flabel">Цвет</label>
        <div class="cswatches" id="cpicker"></div></div>`;
    btns=isEdit?
      `<button class="mbtn danger" onclick="delItem('item','${id}')">Удалить</button>
       <button class="mbtn" onclick="closeModal()">Отмена</button>
       <button class="mbtn ok" onclick="saveItem()">Сохранить</button>`:
      `<button class="mbtn" onclick="closeModal()">Отмена</button>
       <button class="mbtn ok" onclick="saveItem()">Добавить</button>`;
  }

  document.getElementById('iModalTitle').textContent=titleTxt;
  document.getElementById('iModalBody').innerHTML=body;
  document.getElementById('iModalBtns').innerHTML=btns;
  buildCP();
  const catSel=document.getElementById('mCategory');
  if(catSel){
    catSel.onchange=()=>{
      const row=document.getElementById('mOtherCatRow');
      if(row) row.style.display=catSel.value==='__other__'?'flex':'none';
      const isZP=catSel.value==='zp';
      const dr=document.getElementById('mDayRow');
      const rr=document.getElementById('mRepeatRow');
      const al=document.getElementById('mAmtLabel');
      if(dr) dr.style.display=isZP?'none':'block';
      if(rr) rr.style.display=isZP?'none':'block';
      if(al) al.textContent=isZP?'Стоимость смены, ₽':'Сумма, ₽';
    };
  }
  document.getElementById('itemModal').classList.add('open');
  setTimeout(()=>{
    const firstInput=document.getElementById('mOtherCat')||catSel;
    if(firstInput) firstInput.focus();
  },80);
}

function buildCP(){
  const el=document.getElementById('cpicker'); if(!el)return;
  el.innerHTML=COLORS.map(c=>`<div class="csw ${c===selColor?'sel':''}" style="background:${c}" onclick="pickC('${c}')"></div>`).join('');
}
function pickC(c){
  selColor=c;
  document.querySelectorAll('#cpicker .csw').forEach(s=>s.classList.toggle('sel',s.style.background===c||s.style.backgroundColor===c));
}

function saveAccount(){
  const name=document.getElementById('mName').value.trim();
  const balance=parseFloat(document.getElementById('mBalance').value)||0;
  if(!name){showToast('Введите название');return;}
  if(editingId){
    const a=D.accounts.find(x=>x.id===editingId);
    if(a){a.name=name;a.balance=balance;a.color=selColor;}
  } else {
    D.accounts.push({id:uid(),name,balance,color:selColor});
  }
  closeModal(); pushData(); renderAll(); showToast('✓ Сохранено');
}

function saveItem(){
  const categoryKey=document.getElementById('mCategory').value;
  const otherCat=document.getElementById('mOtherCat')?.value.trim();
  const pvzAddr=document.getElementById('mPvzAddr').value||null;
  const amount=parseFloat(document.getElementById('mAmount').value)||0;
  const daysRaw=document.getElementById('mDay').value.trim();
  const days=categoryKey==='zp'?null:daysRaw.split(',').map(s=>parseInt(s.trim())).filter(n=>!isNaN(n)&&n>=1&&n<=31);
  const repeat=document.getElementById('mRepeat').value;
  const taxableEl=document.getElementById('mTaxable');
  const taxable=taxableEl?taxableEl.value==='1':false;

  let catName='', catKey='';
  if(categoryKey==='__other__'){
    if(!otherCat){showToast('Введите категорию');return;}
    catName=otherCat; catKey=otherCat.toLowerCase().replace(/[^a-zа-яё0-9]/g,'_');
  } else {
    const tp=modalType||'income';
    const list=tp==='income'?PVZ_SERVICES:EXP_CATS;
    const found=list.find(c=>c.key===categoryKey);
    if(found){catName=found.name;catKey=found.key;}
    else{catName=categoryKey;catKey=categoryKey;}
  }

  const itemData={category:catName,categoryKey:catKey,pvzAddr,amount,repeat,taxable,color:selColor};
  if(categoryKey==='zp'){itemData.days=null;itemData.day=null;}
  else if(days&&days.length) itemData.days=days;

  const tp=editingId?(D.items.find(x=>x.id===editingId)?.type||modalType):modalType;
  if(editingId){
    const it=D.items.find(x=>x.id===editingId);
    if(it){Object.assign(it,itemData);}
  } else {
    D.items.push({id:uid(),type:tp,...itemData});
  }
  closeModal(); pushData(); renderAll(); showToast('✓ Сохранено');
}

function delItem(cat,id){
  if(!confirm('Удалить?'))return;
  if(cat==='account')D.accounts=D.accounts.filter(x=>x.id!==id);
  else D.items=D.items.filter(x=>x.id!==id);
  closeModal(); pushData(); renderAll(); showToast('Удалено');
}

function closeModal(){document.getElementById('itemModal').classList.remove('open');}
document.getElementById('itemModal').addEventListener('click',e=>{if(e.target===document.getElementById('itemModal'))closeModal();});

// ══════════════════════════════════
// TAX SETTINGS
// ══════════════════════════════════
function saveTaxRate(){D.settings.taxRate=parseFloat(document.getElementById('taxRate').value)||7;pushData();renderAll();}
function saveTaxBase(){D.settings.taxBase=document.getElementById('taxBase').value;pushData();renderAll();}

function togglePaid(){D.settings.paidToday=document.getElementById('paidToday').checked;pushData();renderAll();}

// ══════════════════════════════════
// NAV
// ══════════════════════════════════
function showView(id,btn){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.querySelectorAll('.ntab').forEach(b=>b.classList.remove('active'));
  document.getElementById('view-'+id).classList.add('active');
  btn.classList.add('active');
}
function chMonth(d){
  curMonth+=d;
  if(curMonth>11){curMonth=0;curYear++;}
  if(curMonth<0){curMonth=11;curYear--;}
  renderAll();
}

// ══════════════════════════════════
// INIT
// ══════════════════════════════════
initApp();
</script>
</body>
</html>
