<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Платёжный календарь</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;400;600;800&family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#090b0e; --s1:#0f1217; --s2:#151920; --s3:#1c2028; --s4:#212833;
  --border:#1f2630; --border2:#2a3340;
  --acc:#00e5a0; --acc-dim:rgba(0,229,160,0.07); --acc-mid:rgba(0,229,160,0.16);
  --blue:#3b7fff; --blue-dim:rgba(59,127,255,0.08);
  --red:#ff4545; --red-dim:rgba(255,69,69,0.07);
  --green:#00c46e; --green-dim:rgba(0,196,110,0.07);
  --amber:#f5a623; --amber-dim:rgba(245,166,35,0.1);
  --plan-color:#5d7aff; --fact-color:#00c46e; --dev-pos:#00e5a0; --dev-neg:#ff4545;
  --t1:#dde4ef; --t2:#5d6e82; --t3:#323d4a;
  --font-head:'Unbounded',sans-serif; --font-mono:'JetBrains Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--t1);font-family:var(--font-mono);font-size:13px}

/* HEADER */
header{height:54px;display:flex;align-items:center;gap:14px;padding:0 18px;
  border-bottom:1px solid var(--border);background:rgba(9,11,14,0.96);
  backdrop-filter:blur(20px);position:relative;z-index:50;flex-shrink:0}
.logo{font-family:var(--font-head);font-size:12px;font-weight:800;color:var(--acc);
  letter-spacing:-.5px;white-space:nowrap}
.logo em{color:var(--t3);font-style:normal}
.month-nav{display:flex;align-items:center;gap:5px;margin-left:auto}
.nav-btn{background:var(--s2);border:1px solid var(--border);color:var(--t1);
  width:26px;height:26px;border-radius:5px;cursor:pointer;font-size:11px;
  display:flex;align-items:center;justify-content:center;transition:background .1s}
.nav-btn:hover{background:var(--s3)}
.month-label{font-family:var(--font-head);font-size:11px;font-weight:600;
  min-width:136px;text-align:center}

/* Mode toggle */
.mode-toggle{display:flex;background:var(--s2);border:1px solid var(--border);
  border-radius:7px;padding:2px;gap:2px}
.mtbtn{padding:4px 11px;border-radius:5px;border:none;background:none;
  color:var(--t2);font-family:var(--font-mono);font-size:10px;cursor:pointer;
  transition:all .12s;white-space:nowrap}
.mtbtn.active{background:var(--s4);color:var(--t1)}
.mtbtn.plan.active{color:var(--plan-color)}
.mtbtn.fact.active{color:var(--fact-color)}
.mtbtn.both.active{color:var(--acc)}

.header-actions{display:flex;gap:5px}
.hbtn{display:flex;align-items:center;gap:5px;padding:4px 11px;border-radius:6px;
  border:1px solid var(--border);background:var(--s2);color:var(--t2);
  font-family:var(--font-mono);font-size:11px;cursor:pointer;transition:all .14s;white-space:nowrap}
.hbtn:hover{background:var(--s3);color:var(--t1);border-color:var(--border2)}
.hbtn.primary{background:var(--acc-dim);color:var(--acc);border-color:rgba(0,229,160,.25)}
.hbtn.primary:hover{background:var(--acc-mid)}
.icon{font-size:13px;line-height:1}

/* LAYOUT */
.app{display:flex;height:calc(100vh - 54px);overflow:hidden}

/* SIDEBAR */
.sidebar{width:204px;min-width:204px;border-right:1px solid var(--border);
  display:flex;flex-direction:column;background:var(--s1);overflow:hidden}
.sb-top{flex:1;overflow-y:auto;padding:10px 0}
.sb-sec-title{font-size:9px;text-transform:uppercase;letter-spacing:1.5px;
  color:var(--t3);padding:4px 13px 5px}
.sb-row{display:flex;align-items:center;gap:6px;padding:5px 13px;
  cursor:pointer;border-left:2px solid transparent;transition:all .1s;position:relative}
.sb-row:hover{background:var(--s2)}
.sb-row.active{border-left-color:var(--acc);background:var(--acc-dim);color:var(--acc)}
.sb-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.sb-name{font-size:11px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-del{display:none;background:none;border:none;color:var(--red);cursor:pointer;
  font-size:14px;padding:0 3px;opacity:.6;line-height:1}
.sb-del:hover{opacity:1}
.sb-row:hover .sb-del{display:block}
.sb-div{height:1px;background:var(--border);margin:6px 11px}
.sb-bottom{padding:9px;border-top:1px solid var(--border);flex-shrink:0}
.add-row-btn{width:100%;padding:7px;border-radius:6px;border:1px dashed var(--border2);
  background:none;color:var(--t3);font-family:var(--font-mono);font-size:11px;
  cursor:pointer;transition:all .14s;text-align:center}
.add-row-btn:hover{border-color:var(--acc);color:var(--acc);background:var(--acc-dim)}

/* CONTENT */
.content{flex:1;overflow:hidden;display:flex;flex-direction:column}

/* SUMMARY */
.summary{display:grid;grid-template-columns:repeat(6,1fr);
  border-bottom:1px solid var(--border);flex-shrink:0}
.sum-card{padding:10px 14px;border-right:1px solid var(--border);background:var(--s1)}
.sum-card:last-child{border-right:none}
.sum-label{font-size:9px;text-transform:uppercase;letter-spacing:.8px;color:var(--t3);margin-bottom:4px}
.sum-val{font-family:var(--font-head);font-size:14px;font-weight:600}
.sum-val.g{color:var(--green)} .sum-val.r{color:var(--red)}
.sum-val.a{color:var(--acc)} .sum-val.b{color:var(--blue)}
.sum-val.p{color:var(--plan-color)} .sum-val.am{color:var(--amber)}
.sum-sub{font-size:9px;color:var(--t3);margin-top:2px}

/* TABLE */
.tbl-wrap{flex:1;overflow:auto}
table{border-collapse:collapse;font-size:12px;min-width:100%}

thead th{position:sticky;top:0;z-index:20;background:var(--s2);
  border-bottom:1px solid var(--border);border-right:1px solid var(--border);
  padding:6px 4px;white-space:nowrap;font-size:10px;font-weight:500;color:var(--t2);
  text-align:center}
thead th.row-head{position:sticky;left:0;z-index:30;background:var(--s3);
  min-width:195px;text-align:left;padding:6px 10px;
  font-family:var(--font-head);font-size:8px;letter-spacing:.3px}
th.we{background:rgba(255,69,69,.06)!important;color:var(--red)!important;opacity:.8}
th.tod{background:rgba(0,229,160,.1)!important;color:var(--acc)!important;
  border-bottom:2px solid var(--acc)!important}

tbody tr:hover td{background:rgba(255,255,255,.012)}
tbody tr:hover td.sticky-col{background:var(--s2)}
td{border-right:1px solid var(--border);border-bottom:1px solid rgba(31,38,48,.5);
  padding:0;vertical-align:top;white-space:nowrap}
td.sticky-col{position:sticky;left:0;z-index:10;background:var(--s1);
  border-right:1px solid var(--border);min-width:195px;vertical-align:middle}
td.we-col{background:rgba(255,69,69,.02)!important}
td.tod-col{background:rgba(0,229,160,.025)!important;
  border-left:1px solid rgba(0,229,160,.12)!important;
  border-right:1px solid rgba(0,229,160,.12)!important}

/* total rows */
tr.tot-row td{background:rgba(0,229,160,.025)}
tr.tot-row td.sticky-col{background:rgba(0,229,160,.04)}
tr.tot-row td{border-top:1px solid rgba(0,229,160,.12)}

/* row label */
.row-label{display:flex;align-items:center;gap:6px;padding:5px 9px;min-height:42px}
.row-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.row-name{font-size:11px;color:var(--t1);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-actions{display:none;gap:3px;flex-shrink:0}
td.sticky-col:hover .row-actions{display:flex}
.ract{background:none;border:none;cursor:pointer;font-size:11px;padding:2px 3px;
  border-radius:3px;color:var(--t3);line-height:1}
.ract:hover{background:var(--s3);color:var(--t1)}
.ract.del:hover{color:var(--red)}

/* ── CELL DUAL (plan+fact) ── */
.cell-dual{display:flex;flex-direction:column;width:100%;cursor:pointer;min-height:42px}
.cell-plan-line,.cell-fact-line{
  display:flex;align-items:center;justify-content:flex-end;
  padding:0 7px;height:21px;font-family:var(--font-mono);font-size:11px;
  font-weight:500;transition:background .1s;position:relative;
}
.cell-plan-line{border-bottom:1px solid rgba(31,38,48,.4)}
.cell-plan-line:hover{background:rgba(93,122,255,.07)}
.cell-fact-line:hover{background:rgba(0,196,110,.06)}

/* plan line */
.cell-plan-line.empty{color:var(--t3)}
.cell-plan-line.has-val{color:var(--plan-color)}
.cell-plan-line .line-tag{font-size:8px;opacity:.5;margin-right:4px;font-weight:300}

/* fact line */
.cell-fact-line.empty{color:var(--t3)}
.cell-fact-line.has-val.inc{color:var(--green)}
.cell-fact-line.has-val.exp{color:var(--red)}
.cell-fact-line.has-val.note{color:var(--t2)}

/* deviation badge */
.dev-badge{
  position:absolute;right:4px;top:1px;
  font-size:7px;padding:0 3px;border-radius:2px;line-height:14px;
}
.dev-badge.pos{background:rgba(0,229,160,.15);color:var(--dev-pos)}
.dev-badge.neg{background:rgba(255,69,69,.15);color:var(--dev-neg)}

/* single-mode cell */
.cell-single{display:flex;align-items:center;justify-content:flex-end;
  padding:0 8px;min-height:42px;cursor:pointer;
  font-family:var(--font-mono);font-size:12px;font-weight:500;
  color:var(--t3);transition:background .1s}
.cell-single:hover{background:rgba(255,255,255,.03)}
.cell-single.has-val.plan{color:var(--plan-color)}
.cell-single.has-val.inc{color:var(--green)}
.cell-single.has-val.exp{color:var(--red)}
.cell-single.has-val.bal{color:var(--acc)}
.cell-single.has-val.neg{color:var(--red)}
.cell-single.has-val.cum{color:var(--blue)}
.cell-single.has-val.cum-neg{color:var(--red)}
.cell-single.has-val.note{color:var(--t2)}

/* input */
.cell-input{width:100%;padding:0 8px;background:var(--acc-dim);border:none;
  outline:2px solid var(--acc);color:var(--t1);font-family:var(--font-mono);
  font-size:11px;text-align:right;height:21px}
.cell-input.plan-input{background:var(--blue-dim);outline-color:var(--plan-color)}
.cell-input.fact-input{background:var(--green-dim);outline-color:var(--fact-color)}
.cell-input-full{width:100%;padding:0 8px;background:var(--acc-dim);border:none;
  outline:2px solid var(--acc);color:var(--t1);font-family:var(--font-mono);
  font-size:12px;text-align:right;min-height:42px}
.cell-input-full.plan-input{background:var(--blue-dim);outline-color:var(--plan-color)}
.cell-input-full.fact-input{background:var(--green-dim);outline-color:var(--fact-color)}

/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.77);backdrop-filter:blur(6px);
  z-index:100;display:none;align-items:center;justify-content:center}
.overlay.open{display:flex}
.modal{background:var(--s2);border:1px solid var(--border2);border-radius:13px;
  width:420px;max-height:90vh;overflow-y:auto;
  padding:22px;box-shadow:0 24px 80px rgba(0,0,0,.6)}
.modal-title{font-family:var(--font-head);font-size:13px;font-weight:600;margin-bottom:18px}
.form-row{margin-bottom:13px}
.form-label{font-size:9px;color:var(--t2);text-transform:uppercase;letter-spacing:1px;margin-bottom:5px}
.form-input,.form-select{width:100%;background:var(--s3);border:1px solid var(--border2);
  border-radius:6px;padding:8px 11px;color:var(--t1);font-family:var(--font-mono);
  font-size:12px;outline:none;transition:border .14s}
.form-input:focus,.form-select:focus{border-color:var(--acc)}
.form-select{cursor:pointer;-webkit-appearance:none}
.color-row{display:flex;gap:7px;flex-wrap:wrap}
.cswatch{width:22px;height:22px;border-radius:50%;cursor:pointer;
  border:2px solid transparent;transition:transform .1s,border-color .1s}
.cswatch:hover{transform:scale(1.15)}
.cswatch.sel{border-color:var(--t1);transform:scale(1.12)}
.modal-btns{display:flex;gap:7px;margin-top:18px;justify-content:flex-end}
.mbtn{padding:7px 16px;border-radius:6px;border:1px solid var(--border2);
  background:var(--s3);color:var(--t1);font-family:var(--font-mono);
  font-size:11px;cursor:pointer;transition:all .14s}
.mbtn:hover{background:var(--border2)}
.mbtn.ok{background:var(--acc-dim);color:var(--acc);border-color:rgba(0,229,160,.3)}
.mbtn.ok:hover{background:var(--acc-mid)}
.mbtn.danger{background:var(--red-dim);color:var(--red);border-color:rgba(255,69,69,.2)}

/* Legend strip */
.legend{display:flex;align-items:center;gap:14px;padding:5px 14px;
  border-bottom:1px solid var(--border);background:var(--s1);flex-shrink:0;font-size:10px;color:var(--t2)}
.leg-item{display:flex;align-items:center;gap:5px}
.leg-dot{width:8px;height:8px;border-radius:2px}

/* TOAST */
.toast{position:fixed;bottom:20px;right:20px;z-index:200;background:var(--s3);
  border:1px solid var(--border2);border-radius:7px;padding:9px 14px;
  font-size:11px;color:var(--t1);transform:translateY(16px);opacity:0;
  transition:all .18s;pointer-events:none}
.toast.show{transform:translateY(0);opacity:1}

::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
</style>
</head>
<body>

<header>
  <div class="logo">ПК<em>—</em>CAL</div>
  <div style="font-size:10px;color:var(--t3)">Платёжный календарь</div>

  <div class="month-nav">
    <button class="nav-btn" onclick="changeMonth(-1)">◀</button>
    <div class="month-label" id="monthLabel"></div>
    <button class="nav-btn" onclick="changeMonth(1)">▶</button>
  </div>

  <div class="mode-toggle">
    <button class="mtbtn plan" onclick="setMode('plan',this)">План</button>
    <button class="mtbtn fact" onclick="setMode('fact',this)">Факт</button>
    <button class="mtbtn both active" onclick="setMode('both',this)">План + Факт</button>
  </div>

  <div class="header-actions">
    <button class="hbtn" onclick="clearMonth()"><span class="icon">⌫</span> Очистить</button>
    <button class="hbtn" onclick="exportCSV()"><span class="icon">↓</span> CSV</button>
    <button class="hbtn primary" onclick="openAddRow()"><span class="icon">＋</span> Строка</button>
  </div>
</header>

<div style="display:flex;flex-direction:column;height:calc(100vh - 54px)">
  <div class="summary" id="summary"></div>
  <div class="app">
    <div class="sidebar">
      <div class="sb-top" id="sbList"></div>
      <div class="sb-bottom">
        <button class="add-row-btn" onclick="openAddRow()">＋ Новая строка</button>
      </div>
    </div>
    <div class="content">
      <div class="legend" id="legend"></div>
      <div class="tbl-wrap">
        <table id="mainTable">
          <thead id="tHead"></thead>
          <tbody id="tBody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- ADD ROW MODAL -->
<div class="overlay" id="addRowModal">
  <div class="modal">
    <div class="modal-title" id="modalTitle">Новая строка</div>
    <div class="form-row">
      <div class="form-label">Название</div>
      <input class="form-input" id="rowName" placeholder="Например: Аренда офиса" maxlength="50">
    </div>
    <div class="form-row">
      <div class="form-label">Тип</div>
      <select class="form-select" id="rowType">
        <option value="income">📈 Доход</option>
        <option value="expense">📉 Расход</option>
        <option value="note">📝 Прочее</option>
      </select>
    </div>
    <div class="form-row">
      <div class="form-label">Цвет</div>
      <div class="color-row" id="colorPicker"></div>
    </div>
    <div class="modal-btns">
      <button class="mbtn" onclick="closeModal('addRowModal')">Отмена</button>
      <button class="mbtn ok" onclick="saveRow()">Добавить</button>
    </div>
  </div>
</div>

<!-- EDIT ROW MODAL -->
<div class="overlay" id="editRowModal">
  <div class="modal">
    <div class="modal-title">Редактировать строку</div>
    <div class="form-row">
      <div class="form-label">Название</div>
      <input class="form-input" id="editRowName" maxlength="50">
    </div>
    <div class="form-row">
      <div class="form-label">Тип</div>
      <select class="form-select" id="editRowType">
        <option value="income">📈 Доход</option>
        <option value="expense">📉 Расход</option>
        <option value="note">📝 Прочее</option>
      </select>
    </div>
    <div class="form-row">
      <div class="form-label">Цвет</div>
      <div class="color-row" id="editColorPicker"></div>
    </div>
    <div class="modal-btns">
      <button class="mbtn danger" onclick="deleteRow()">Удалить</button>
      <button class="mbtn" onclick="closeModal('editRowModal')">Отмена</button>
      <button class="mbtn ok" onclick="saveEditRow()">Сохранить</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ═══════════════════════════════════════════
// CONSTANTS
// ═══════════════════════════════════════════
const MONTHS=['Январь','Февраль','Март','Апрель','Май','Июнь',
              'Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const WD=['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
const COLORS=['#00e5a0','#00c46e','#5d7aff','#ff4545','#f5a623',
              '#a855f7','#ec4899','#06b6d4','#84cc16','#f97316',
              '#e879f9','#facc15','#94a3b8','#fb923c','#38bdf8'];
const STORAGE='pk_v4';

// ═══════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════
let S = {
  year: new Date().getFullYear(),
  month: new Date().getMonth(),
  mode: 'both',   // 'plan' | 'fact' | 'both'
  filter: 'all',
  rows: [],
  // cells: { "rowId_y_m_d_plan": num, "rowId_y_m_d_fact": num }
  cells: {},
};

let editingRowId = null;
let selColor = COLORS[0];
let editSelColor = COLORS[0];
let activeInput = null; // { el, rowId, day, kind }

// ═══════════════════════════════════════════
// STORAGE
// ═══════════════════════════════════════════
function persist() {
  localStorage.setItem(STORAGE, JSON.stringify({rows:S.rows, cells:S.cells}));
}
function hydrate() {
  try {
    const d = JSON.parse(localStorage.getItem(STORAGE)||'{}');
    S.rows = d.rows||[];
    S.cells = d.cells||{};
  } catch(e){}
  if (!S.rows.length) S.rows = [
    {id:'r1',name:'ЗП / Зарплата',         type:'income', color:'#00c46e'},
    {id:'r2',name:'Агентские вознагр.',     type:'income', color:'#5d7aff'},
    {id:'r3',name:'ДОПы ПВЗ',              type:'income', color:'#a855f7'},
    {id:'r4',name:'Дивиденды',              type:'income', color:'#f5a623'},
    {id:'r5',name:'Аренда — Красноярская',  type:'expense',color:'#06b6d4'},
    {id:'r6',name:'Аренда — Кецинского',    type:'expense',color:'#10b981'},
    {id:'r7',name:'Оплата ЖКХ',            type:'expense',color:'#ff4545'},
    {id:'r8',name:'Интернет',              type:'expense',color:'#38bdf8'},
    {id:'r9',name:'ЕДА и Я',              type:'expense',color:'#ec4899'},
    {id:'r10',name:'Хоз-во / Откладывать', type:'expense',color:'#84cc16'},
  ];
}

function ck(rowId, y, m, d, kind) { return `${rowId}_${y}_${m}_${d}_${kind}`; }
function getV(rowId, y, m, d, kind) { return S.cells[ck(rowId,y,m,d,kind)]||0; }
function setV(rowId, y, m, d, kind, val) {
  const k = ck(rowId,y,m,d,kind);
  if (!val) delete S.cells[k]; else S.cells[k]=val;
  persist();
}

// ═══════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════
const getDays = () => new Date(S.year, S.month+1, 0).getDate();
const getWD   = d  => new Date(S.year, S.month, d).getDay();
const isWE    = d  => { const w=getWD(d); return w===0||w===6; };
const isToday = d  => {
  const t=new Date();
  return t.getFullYear()===S.year&&t.getMonth()===S.month&&t.getDate()===d;
};

function fmt(n) {
  if (!n) return '';
  return Math.abs(n).toLocaleString('ru-RU')+'₽';
}
function fmtSign(n) {
  if (!n) return '0₽';
  return (n>0?'+':'−')+Math.abs(n).toLocaleString('ru-RU')+'₽';
}
function devClass(dev) { return dev>0?'pos':'neg'; }
function devText(dev)  { return (dev>0?'+':'')+Math.round(dev)+'%'; }

// ═══════════════════════════════════════════
// AGGREGATES
// ═══════════════════════════════════════════
function dayAgg(d) {
  let pi=0,pe=0,fi=0,fe=0;
  for (const r of S.rows) {
    const p=getV(r.id,S.year,S.month,d,'plan');
    const f=getV(r.id,S.year,S.month,d,'fact');
    if (r.type==='income')  { pi+=p; fi+=f; }
    if (r.type==='expense') { pe+=p; fe+=f; }
  }
  return {pi,pe,fi,fe,pnet:pi-pe,fnet:fi-fe};
}
function monthAgg() {
  const days=getDays();
  let pi=0,pe=0,fi=0,fe=0;
  for (let d=1;d<=days;d++) {
    const a=dayAgg(d);
    pi+=a.pi; pe+=a.pe; fi+=a.fi; fe+=a.fe;
  }
  return {pi,pe,fi,fe,pnet:pi-pe,fnet:fi-fe};
}
function cumulatives() {
  const days=getDays();
  const out={};
  let pcum=0, fcum=0;
  for (let d=1;d<=days;d++) {
    const a=dayAgg(d);
    pcum+=a.pnet; fcum+=a.fnet;
    out[d]={...a,pcum,fcum};
  }
  return out;
}

  const expDev  = ma.pe ? Math.round((ma.fe-ma.pe)/ma.pe*100) : null;

  const today=new Date();

    <div class="sum-card">
      <div class="sum-label">Доходы план</div>

      <div class="sum-sub" style="color:var(--fact-color)">факт ${fmt(ma.fi)||'—'}</div>
    </div>
    <div class="sum-card">
      <div class="sum-label">Расходы план</div>
      <div class="sum-val p">${fmt(ma.pe)||'—'}</div>

    </div>

    </div>

      <div class="sum-label">Откл. расходов</div>
      <div class="sum-val ${expDev===null?'b':expDev<=0?'g':'r'}">${expDev===null?'—':(expDev>=0?'+':'')+expDev+'%'}</div>
      <div class="sum-sub">${fmt(ma.fe-ma.pe)||'нет данных'}</div>

function renderTable() {
  const days = getDays();
  const cum  = cumulatives();
  const visRows = S.filter==='all' ? S.rows : S.rows.filter(r=>r.id===S.filter);
  const isBoth  = S.mode==='both';
  const isPlan  = S.mode==='plan';
  const isFact  = S.mode==='fact';

  // cell min-width
  const cw = isBoth ? 88 : 68;

  // ── HEAD ──
  let hh = `<tr><th class="row-head">Строка / День</th>`;
  for (let d=1;d<=days;d++) {
    let cls = isWE(d)?'we':'';
    if (isToday(d)) cls='tod';
    hh += `<th class="${cls}" style="min-width:${cw}px">
      <div style="font-size:12px;font-weight:600">${d}</div>
      <div style="font-size:9px;font-weight:400;opacity:.65;margin-top:1px">${WD[getWD(d)]}</div>
    </th>`;
  }
  hh += '</tr>';
  document.getElementById('tHead').innerHTML = hh;

  // ── BODY ──
  let bh = '';

  for (const row of visRows) {
    bh += `<tr>
      <td class="sticky-col">
        <div class="row-label">
          <div class="row-dot" style="background:${row.color}"></div>
          <div class="row-name" title="${row.name}">${row.name}</div>
          <div class="row-actions">
            <button class="ract" onclick="openEditRow('${row.id}')">✎</button>
            <button class="ract del" onclick="promptDelete('${row.id}')">×</button>
          </div>
        </div>
      </td>`;

    for (let d=1;d<=days;d++) {
      const plan = getV(row.id, S.year, S.month, d, 'plan');
      const fact = getV(row.id, S.year, S.month, d, 'fact');
      let colCls = isWE(d)?' we-col':'';
      if (isToday(d)) colCls+=' tod-col';

      if (isBoth) {
        // Deviation
        let devHtml = '';
        if (plan && fact) {
          const dev = Math.round((fact-plan)/plan*100);
          const dc  = row.type==='expense' ? (dev<=0?'pos':'neg') : devClass(dev);
          devHtml = `<span class="dev-badge ${dc}">${devText(dev)}</span>`;
        }
        const factCls = fact ? (row.type==='income'?'inc':row.type==='expense'?'exp':'note') : '';
        bh += `<td class="${colCls}" style="min-width:${cw}px">
          <div class="cell-dual">
            <div class="cell-plan-line ${plan?'has-val':'empty'}"
                 onclick="startEdit(this,'${row.id}',${d},'plan')">
              <span class="line-tag">П</span>${plan?fmt(plan):''}
              ${devHtml}
            </div>
            <div class="cell-fact-line ${fact?'has-val '+factCls:'empty'}"
                 onclick="startEdit(this,'${row.id}',${d},'fact')">
              <span class="line-tag">Ф</span>${fact?fmt(fact):''}
            </div>
          </div>
        </td>`;
      } else {
        const kind = isPlan ? 'plan' : 'fact';
        const val  = isPlan ? plan : fact;
        const valCls = val ? (isPlan?'plan':row.type==='income'?'inc':row.type==='expense'?'exp':'note') : '';
        bh += `<td class="${colCls}" style="min-width:${cw}px">
          <div class="cell-single ${val?'has-val '+valCls:''}"
               onclick="startEdit(this,'${row.id}',${d},'${kind}')">
            ${val?fmt(val):''}
          </div>
        </td>`;
      }
    }
    bh += '</tr>';
  }

  // ── TOTALS ──
  if (S.filter==='all') {
    const totalDefs = [
      {label:'Итого доходов',  color:'var(--green)', getPlan:a=>a.pi, getFact:a=>a.fi, isFact:true},
      {label:'Итого расходов', color:'var(--red)',   getPlan:a=>a.pe, getFact:a=>a.fe, isFact:true},
      {label:'Баланс дня',     color:'var(--acc)',   getPlan:a=>a.pnet, getFact:a=>a.fnet, signed:true},
      {label:'Накопл. итог',   color:'var(--blue)',  getPlan:a=>cum[a.d].pcum, getFact:a=>cum[a.d].fcum, signed:true},
    ];

    for (const td of totalDefs) {
      bh += `<tr class="tot-row">
        <td class="sticky-col">
          <div class="row-label">
            <div class="row-dot" style="background:${td.color}"></div>
            <div class="row-name" style="color:${td.color};font-weight:500">${td.label}</div>
          </div>
        </td>`;

      for (let d=1;d<=days;d++) {
        const a  = {...dayAgg(d), d};
        const pv = td.getPlan(a);
        const fv = td.getFact(a);
        let colCls = isWE(d)?' we-col':'';
        if (isToday(d)) colCls+=' tod-col';

        if (isBoth) {
          const f = td.signed ? fmtSign : fmt;
          const pShow = td.signed ? pv!==0 : !!pv;
          const fShow = td.signed ? fv!==0 : !!fv;
          bh += `<td class="${colCls}" style="min-width:${cw}px">
            <div class="cell-dual">
              <div class="cell-plan-line ${pShow?'has-val':'empty'}" style="cursor:default">
                <span class="line-tag">П</span>${pShow?f(pv):''}
              </div>
              <div class="cell-fact-line ${fShow?'has-val fact':'empty'}" style="cursor:default;color:${td.color}">
                <span class="line-tag">Ф</span>${fShow?f(fv):''}
              </div>
            </div>
          </td>`;
        } else {
          const kind = isPlan?'plan':'fact';
          const val  = isPlan?pv:fv;
          const f    = td.signed ? fmtSign : fmt;
          const show = td.signed ? val!==0 : !!val;
          bh += `<td class="${colCls}" style="min-width:${cw}px">
            <div class="cell-single ${show?'has-val cum':''}" style="color:${show?td.color:''}">
              ${show?f(val):''}
            </div>
          </td>`;
        }
      }
      bh += '</tr>';
    }
  }

  document.getElementById('tBody').innerHTML = bh;
}

// ═══════════════════════════════════════════
// CELL EDITING
// ═══════════════════════════════════════════
function startEdit(lineEl, rowId, day, kind) {
  if (activeInput) commitEdit(activeInput, true);

  const isBoth = S.mode==='both';
  const val = getV(rowId, S.year, S.month, day, kind);

  const inp = document.createElement('input');
  inp.type='number'; inp.min='0';
  inp.value = val||'';
  inp.placeholder = '0';

  if (isBoth) {
    inp.className = `cell-input ${kind}-input`;
    lineEl.innerHTML = '';
    lineEl.appendChild(inp);
  } else {
    inp.className = `cell-input-full ${kind}-input`;
    const parent = lineEl.parentElement;
    parent.innerHTML = '';
    parent.appendChild(inp);
  }

  inp.focus(); inp.select();
  activeInput = { inp, lineEl, rowId, day, kind, isBoth };

  inp.addEventListener('blur', () => {
    if (activeInput && activeInput.inp===inp) commitEdit(activeInput, true);
  });
  inp.addEventListener('keydown', e => {
    if (e.key==='Enter') {
      commitEdit(activeInput, true);
      activeInput = null;
      moveEdit(rowId, day, kind, 1);
    }
    if (e.key==='Escape') {
      commitEdit(activeInput, false);
      activeInput = null;
    }
    if (e.key==='Tab') {
      e.preventDefault();
      commitEdit(activeInput, true);
      activeInput = null;
      moveEdit(rowId, day, kind, e.shiftKey?-1:1);
    }
  });
}

function commitEdit(ctx, doSave) {
  if (!ctx) return;
  const {inp, rowId, day, kind, isBoth} = ctx;
  const raw = inp.value.trim();
  const val = raw===''?0:parseFloat(raw)||0;
  if (doSave) setV(rowId, S.year, S.month, day, kind, val);

  // Re-render just this cell
  restoreCell(rowId, day);
  renderSummary();

  // Update totals
  updateTotals();
}

function restoreCell(rowId, day) {
  const plan = getV(rowId, S.year, S.month, day, 'plan');
  const fact  = getV(rowId, S.year, S.month, day, 'fact');
  const row  = S.rows.find(r=>r.id===rowId);
  if (!row) return;

  // Find the td
  const td = document.querySelector(`td[data-rid="${rowId}"][data-day="${day}"]`);
  if (td) {
    td.innerHTML = buildCellHTML(row, day, plan, fact);
    return;
  }
  // fallback: full table re-render
  renderTable();
}

function buildCellHTML(row, day, plan, fact) {
  const isBoth = S.mode==='both';
  const isPlan = S.mode==='plan';
  const cw = isBoth?88:68;
  if (isBoth) {
    let devHtml='';
    if (plan&&fact) {
      const dev=Math.round((fact-plan)/plan*100);
      const dc=row.type==='expense'?(dev<=0?'pos':'neg'):devClass(dev);
      devHtml=`<span class="dev-badge ${dc}">${devText(dev)}</span>`;
    }
    const factCls=fact?(row.type==='income'?'inc':row.type==='expense'?'exp':'note'):'';
    return `<div class="cell-dual">
      <div class="cell-plan-line ${plan?'has-val':'empty'}" onclick="startEdit(this,'${row.id}',${day},'plan')">
        <span class="line-tag">П</span>${plan?fmt(plan):''}${devHtml}
      </div>
      <div class="cell-fact-line ${fact?'has-val '+factCls:'empty'}" onclick="startEdit(this,'${fact?factCls:''}','${row.id}',${day},'fact')" onclick="startEdit(this,'${row.id}',${day},'fact')">
        <span class="line-tag">Ф</span>${fact?fmt(fact):''}
      </div>
    </div>`;
  } else {
    const kind=isPlan?'plan':'fact';
    const val=isPlan?plan:fact;
    const valCls=val?(isPlan?'plan':row.type==='income'?'inc':row.type==='expense'?'exp':'note'):'';
    return `<div class="cell-single ${val?'has-val '+valCls:''}" onclick="startEdit(this,'${row.id}',${day},'${kind}')">
      ${val?fmt(val):''}
    </div>`;
  }
}

function moveEdit(rowId, day, kind, delta) {
  const days = getDays();
  const nd = day+delta;
  if (nd<1||nd>days) return;
  setTimeout(()=>{
    const sel = S.mode==='both'
      ? `td[data-rid="${rowId}"][data-day="${nd}"] .cell-${kind}-line`
      : `td[data-rid="${rowId}"][data-day="${nd}"] .cell-single`;
    const el = document.querySelector(sel);
    if (el) el.click();
  }, 40);
}

function updateTotals() {
  // Re-render total rows by doing a selective update
  // For simplicity in this build, we re-render the whole table body
  renderTable();
}

// ═══════════════════════════════════════════
// ROW MANAGEMENT
// ═══════════════════════════════════════════
function uid(){ return 'r'+Date.now()+Math.random().toString(36).slice(2,5); }

function openAddRow() {
  selColor = COLORS[Math.floor(Math.random()*COLORS.length)];
  document.getElementById('rowName').value='';
  document.getElementById('rowType').value='expense';
  document.getElementById('modalTitle').textContent='Новая строка';
  buildColorPicker('colorPicker', selColor, c=>selColor=c);
  document.getElementById('addRowModal').classList.add('open');
  setTimeout(()=>document.getElementById('rowName').focus(),80);
}
function saveRow() {
  const name=document.getElementById('rowName').value.trim();
  if (!name){showToast('Введите название');return;}
  S.rows.push({id:uid(), name, type:document.getElementById('rowType').value, color:selColor});
  persist(); closeModal('addRowModal'); render(); showToast('✓ Строка добавлена');
}
function openEditRow(rowId) {
  editingRowId=rowId;
  const r=S.rows.find(r=>r.id===rowId); if(!r)return;
  editSelColor=r.color;
  document.getElementById('editRowName').value=r.name;
  document.getElementById('editRowType').value=r.type;
  buildColorPicker('editColorPicker', editSelColor, c=>editSelColor=c);
  document.getElementById('editRowModal').classList.add('open');
  setTimeout(()=>document.getElementById('editRowName').focus(),80);
}
function saveEditRow() {
  const name=document.getElementById('editRowName').value.trim();
  if (!name){showToast('Введите название');return;}
  const r=S.rows.find(r=>r.id===editingRowId); if(!r)return;
  r.name=name; r.type=document.getElementById('editRowType').value; r.color=editSelColor;
  persist(); closeModal('editRowModal'); render(); showToast('✓ Обновлено');
}
function deleteRow() {
  if (!confirm('Удалить строку?')) return;
  promptDelete(editingRowId,true); closeModal('editRowModal');
}
function promptDelete(rowId, skip) {
  if (!skip&&!confirm('Удалить?')) return;
  S.rows=S.rows.filter(r=>r.id!==rowId);
  Object.keys(S.cells).forEach(k=>{ if(k.startsWith(rowId+'_')) delete S.cells[k]; });
  if (S.filter===rowId) S.filter='all';
  persist(); render(); showToast('Строка удалена');
}

// ═══════════════════════════════════════════
// COLOR PICKER
// ═══════════════════════════════════════════
function buildColorPicker(id, selected, onChange) {
  const el=document.getElementById(id);
  el.innerHTML=COLORS.map(c=>`<div class="cswatch ${c===selected?'sel':''}"
    style="background:${c}" onclick="pickC('${id}','${c}')"></div>`).join('');
  el._cb=onChange;
}
function pickC(id, color) {
  const el=document.getElementById(id);
  el.querySelectorAll('.cswatch').forEach(s=>s.classList.toggle('sel',s.style.background===color||s.style.backgroundColor===color));
  if (id==='colorPicker') selColor=color; else editSelColor=color;
  if (el._cb) el._cb(color);
}

// ═══════════════════════════════════════════
// CONTROLS
// ═══════════════════════════════════════════
function changeMonth(d) {
  S.month+=d;
  if (S.month>11){S.month=0;S.year++;}
  if (S.month<0){S.month=11;S.year--;}
  render();
}
function setMode(m, btn) {
  S.mode=m;
  document.querySelectorAll('.mtbtn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  render();
}
function setFilter(id) { S.filter=id; render(); }
function closeModal(id){ document.getElementById(id).classList.remove('open'); }

document.querySelectorAll('.overlay').forEach(el=>{
  el.addEventListener('click', e=>{ if(e.target===el) el.classList.remove('open'); });
});

function clearMonth() {
  if (!confirm(`Очистить данные за ${MONTHS[S.month]} ${S.year}?`)) return;
  const p=`_${S.year}_${S.month}_`;
  Object.keys(S.cells).forEach(k=>{ if(k.includes(p)) delete S.cells[k]; });
  persist(); render(); showToast('Месяц очищен');
}

function exportCSV() {
  const days=getDays();
  const header=['Строка','Тип',...Array.from({length:days},(_,i)=>`${i+1} план`),...Array.from({length:days},(_,i)=>`${i+1} факт`)];
  const csvRows=[header];
  for (const r of S.rows) {
    const plans=Array.from({length:days},(_,i)=>getV(r.id,S.year,S.month,i+1,'plan')||'');
    const facts=Array.from({length:days},(_,i)=>getV(r.id,S.year,S.month,i+1,'fact')||'');
    csvRows.push([r.name,r.type,...plans,...facts]);
  }
  const csv=csvRows.map(r=>r.join(';')).join('\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));
  a.download=`pk_${S.year}_${S.month+1}.csv`;
  a.click();
  showToast('✓ CSV экспортирован');
}

let _tt;
function showToast(msg) {
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(_tt); _tt=setTimeout(()=>t.classList.remove('show'),2200);
}

// ═══════════════════════════════════════════
// KEYBOARD
// ═══════════════════════════════════════════
document.addEventListener('keydown', e=>{
  if (e.target.tagName==='INPUT'||e.target.tagName==='SELECT') return;
  if (e.key==='ArrowLeft')  changeMonth(-1);
  if (e.key==='ArrowRight') changeMonth(1);
  if (e.key==='n'||e.key==='N') openAddRow();
  if (e.key==='1') setMode('plan', document.querySelector('.mtbtn.plan'));
  if (e.key==='2') setMode('fact', document.querySelector('.mtbtn.fact'));
  if (e.key==='3') setMode('both', document.querySelector('.mtbtn.both'));
});

// ═══════════════════════════════════════════
// INIT  — patch renderTable to set data-attrs
// ═══════════════════════════════════════════
const _origRenderTable = renderTable;
// We need td[data-rid][data-day] for restoreCell — patch after build
function renderTablePatched() {
  _origRenderTable();
  // add data attrs to all data tds
  document.querySelectorAll('#tBody tr').forEach(tr=>{
    const stickyTd = tr.querySelector('td.sticky-col');
    if (!stickyTd) return;
    const btn = stickyTd.querySelector('.ract');
    if (!btn) return;
    // extract rowId from onclick
    const m = btn.getAttribute('onclick').match(/'([^']+)'/);
    if (!m) return;
    const rowId = m[1];
    const dataTds = tr.querySelectorAll('td:not(.sticky-col)');
    dataTds.forEach((td,i)=>{
      td.setAttribute('data-rid', rowId);
      td.setAttribute('data-day', i+1);
    });
  });
}

hydrate();
renderTablePatched();
renderSidebar();
renderSummary();
renderLegend();
document.getElementById('monthLabel').textContent=`${MONTHS[S.month]} ${S.year}`;

// Override render to also patch
const _baseRender = render;
window.render = function() {
  _baseRender();
  // patch data-attrs
  document.querySelectorAll('#tBody tr').forEach(tr=>{
    const stickyTd = tr.querySelector('td.sticky-col');
    if (!stickyTd) return;
    const btn = stickyTd.querySelector('[onclick*="openEditRow"]');
    if (!btn) return;
    const m = btn.getAttribute('onclick').match(/'([^']+)'/);
    if (!m) return;
    const rowId = m[1];
    tr.querySelectorAll('td:not(.sticky-col)').forEach((td,i)=>{
      td.setAttribute('data-rid', rowId);
      td.setAttribute('data-day', i+1);
    });
  });
};

setTimeout(()=>{
  const tod = document.querySelector('th.tod');
  if (tod) tod.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});
},200);
</script>
