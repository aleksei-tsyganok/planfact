<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Кассовый план</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07090e;
  --s1:#0d1018;--s2:#111520;--s3:#161b27;--s4:#1c2230;--s5:#222b3a;
  --brd:rgba(255,255,255,0.055);--brd2:rgba(255,255,255,0.1);--brd3:rgba(255,255,255,0.16);
  --acc:#2dd4a0;--acc-d:rgba(45,212,160,0.1);--acc-m:rgba(45,212,160,0.2);
  --blue:#5b9cf6;--blue-d:rgba(91,156,246,0.1);
  --red:#f06565;--red-d:rgba(240,101,101,0.1);
  --amber:#e8ac3a;--amber-d:rgba(232,172,58,0.1);
  --grn:#3fcf7a;--grn-d:rgba(63,207,122,0.1);
  --plan:#7c88f5;--plan-d:rgba(124,136,245,0.1);
  --t1:#e8edf5;--t2:#7e8ea3;--t3:#3e4e62;--t4:#1e2a38;
  --r:14px;--rsm:9px;
  --f:'Inter',-apple-system,sans-serif;
  --shadow-sm:0 1px 3px rgba(0,0,0,.4),0 1px 2px rgba(0,0,0,.3);
  --shadow-md:0 4px 16px rgba(0,0,0,.5),0 2px 6px rgba(0,0,0,.3);
  --shadow-lg:0 12px 40px rgba(0,0,0,.6),0 4px 12px rgba(0,0,0,.4);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg);
  color:var(--t1);
  font-family:var(--f);
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  min-height:100dvh;
  background-image:
    radial-gradient(ellipse 80% 40% at 20% 0%,rgba(45,212,160,.035) 0%,transparent 70%),
    radial-gradient(ellipse 60% 30% at 80% 10%,rgba(91,156,246,.025) 0%,transparent 70%),
    radial-gradient(ellipse 40% 50% at 50% 100%,rgba(124,136,245,.02) 0%,transparent 60%);
}

/* ── TOPBAR ── */
.topbar{
  position:sticky;top:0;z-index:50;
  height:54px;display:flex;align-items:center;gap:12px;padding:0 20px;
  background:rgba(7,9,14,0.88);
  backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);
  border-bottom:1px solid var(--brd);
}
.logo{
  font-size:15px;font-weight:800;letter-spacing:-.6px;
  background:linear-gradient(135deg,var(--acc) 0%,var(--blue) 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.logo span{-webkit-text-fill-color:var(--t3);font-weight:400;font-size:13px;letter-spacing:0}
.nav-tabs{
  display:flex;gap:1px;
  background:var(--s3);border:1px solid var(--brd);border-radius:var(--rsm);
  padding:3px;margin-left:auto;
}
.ntab{
  padding:5px 16px;border-radius:6px;border:none;background:none;
  color:var(--t3);font-family:var(--f);font-size:12px;font-weight:500;
  cursor:pointer;transition:all .15s;white-space:nowrap;letter-spacing:.01em;
}
.ntab.active{background:var(--s5);color:var(--t1);box-shadow:var(--shadow-sm)}
.sync-dot{width:6px;height:6px;border-radius:50%;background:var(--t3);flex-shrink:0;transition:background .3s}
.sync-dot.ok{background:var(--grn)}
.sync-dot.sync{background:var(--amber);animation:blink .9s ease-in-out infinite}
.sync-dot.err{background:var(--red)}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
.sync-label{font-size:11px;color:var(--t3);white-space:nowrap;font-weight:500}

/* ── VIEWS ── */
.view{display:none;padding:24px 20px;max-width:1240px;margin:0 auto}
.view.active{display:block}
@media(max-width:599px){.view{padding:14px 12px}}

/* ── KPI GRID ── */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:10px;margin-bottom:24px}
.kpi{
  background:var(--s2);
  border:1px solid var(--brd);
  border-radius:var(--r);
  padding:16px 18px;
  position:relative;
  overflow:hidden;
  transition:border-color .2s;
  box-shadow:var(--shadow-sm);
}
.kpi::before{
  content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.06),transparent);
}
.kpi:hover{border-color:var(--brd2)}
.kpi-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.8px;color:var(--t3);margin-bottom:9px}
.kpi-val{font-size:22px;font-weight:800;line-height:1;letter-spacing:-.4px;font-variant-numeric:tabular-nums}
.kpi-val.g{color:var(--grn)}.kpi-val.r{color:var(--red)}.kpi-val.a{color:var(--acc)}
.kpi-val.b{color:var(--blue)}.kpi-val.p{color:var(--plan)}.kpi-val.am{color:var(--amber)}
.kpi-sub{font-size:11px;color:var(--t3);margin-top:5px;font-weight:400}

/* ── FREE MONEY BAR ── */
.free-money-bar{
  display:flex;align-items:center;justify-content:space-between;
  border-radius:var(--r);padding:18px 22px;margin-bottom:24px;gap:16px;flex-wrap:wrap;
  background:var(--s2);border:1px solid var(--brd);
  box-shadow:var(--shadow-sm);
  position:relative;overflow:hidden;
}
.free-money-bar::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(45,212,160,.04) 0%,transparent 60%);
  pointer-events:none;
}
.fm-label{font-size:11px;color:var(--t3);font-weight:600;text-transform:uppercase;letter-spacing:.7px;margin-bottom:6px}
.fm-val{font-size:30px;font-weight:800;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.fm-val.ok{color:var(--acc)}.fm-val.warn{color:var(--amber)}.fm-val.bad{color:var(--red)}
.fm-desc{font-size:12px;color:var(--t3);margin-top:3px;font-weight:400}

/* ── SECTION HEAD ── */
.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.section-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.9px;color:var(--t3)}
.sec-action{
  background:none;border:none;color:var(--t3);font-size:12px;cursor:pointer;
  padding:4px 10px;border-radius:6px;font-family:var(--f);transition:all .12s;font-weight:500;
}
.sec-action:hover{background:var(--s3);color:var(--t1)}

/* ── ACCOUNTS ── */
.accounts-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:24px}
.acct-card{
  background:var(--s2);border:1px solid var(--brd);border-radius:var(--r);
  padding:14px 16px;cursor:pointer;
  transition:border-color .15s,transform .12s;
  box-shadow:var(--shadow-sm);
  -webkit-tap-highlight-color:transparent;
  position:relative;overflow:hidden;
}
.acct-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,var(--brd2),transparent);
}
.acct-card:hover{border-color:var(--brd2);transform:translateY(-1px);box-shadow:var(--shadow-md)}
.acct-card:active{transform:translateY(0)}
.acct-name{font-size:11px;font-weight:600;color:var(--t2);margin-bottom:8px;display:flex;align-items:center;gap:7px;letter-spacing:.01em}
.acct-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.acct-val{font-size:20px;font-weight:700;letter-spacing:-.3px;color:var(--t1);font-variant-numeric:tabular-nums}

/* ── CASHFLOW TABLE ── */
.cf-wrap{
  overflow-x:auto;border-radius:var(--r);border:1px solid var(--brd);
  margin-bottom:24px;background:var(--s1);box-shadow:var(--shadow-md);
}
.cf-table{border-collapse:collapse;min-width:100%;font-size:12px;font-variant-numeric:tabular-nums}
.cf-table th{
  background:rgba(17,21,32,0.98);
  border-bottom:1px solid var(--brd);border-right:1px solid var(--brd);
  padding:9px 12px;white-space:nowrap;font-weight:600;color:var(--t2);
  text-align:right;position:sticky;top:0;z-index:10;font-size:11px;letter-spacing:.02em;
}
.cf-table th:first-child{
  text-align:left;position:sticky;left:0;z-index:20;
  background:rgba(22,27,39,0.98);min-width:190px;
}
.cf-table th.today-col{
  background:rgba(45,212,160,.1)!important;
  color:var(--acc)!important;
  border-bottom:2px solid var(--acc)!important;
}
.cf-table td{
  border-right:1px solid var(--brd);border-bottom:1px solid rgba(255,255,255,.025);
  padding:8px 12px;text-align:right;vertical-align:middle;white-space:nowrap;
  font-size:12px;
}
.cf-table td:first-child{
  text-align:left;position:sticky;left:0;z-index:5;
  background:rgba(13,16,24,0.97);
  border-right:1px solid var(--brd);font-weight:500;padding:8px 12px;
}
.cf-table tr:hover td{background:rgba(255,255,255,.018)}
.cf-table tr:hover td:first-child{background:rgba(17,21,32,0.98)}
th.we-col{opacity:.55}
td.we-col{background:rgba(240,101,101,.012)!important}
td.today-col{
  background:rgba(45,212,160,.025)!important;
  border-left:1px solid rgba(45,212,160,.1)!important;
  border-right:1px solid rgba(45,212,160,.1)!important;
}
td.danger{color:var(--red)!important;font-weight:700}
td.warning{color:var(--amber)!important;font-weight:600}
tr.row-income td:first-child{color:var(--grn);font-weight:500}
tr.row-expense td:first-child{color:var(--red);font-weight:500}
tr.row-tax td:first-child{color:var(--amber);font-weight:500}
tr.row-balance td{font-weight:700;font-size:13px}
tr.row-balance td.danger{background:rgba(240,101,101,.06)!important}
tr.row-balance td.warning{background:rgba(232,172,58,.05)!important}
tr.row-balance td:first-child{color:var(--acc);font-size:11px;background:var(--s3)!important}
tr.row-section td{
  background:var(--s3)!important;
  font-size:10px;font-weight:700;text-transform:uppercase;
  letter-spacing:.9px;color:var(--t3);padding:10px 12px 5px;
}
tr.row-section td:first-child{background:var(--s4)!important}
tr.row-total td{
  border-top:1px solid var(--brd2);font-weight:700;
  background:rgba(255,255,255,.018)!important;
}
tr.row-total td:first-child{background:var(--s3)!important;color:var(--t2)}
.val-pos{color:var(--grn)}.val-neg{color:var(--red)}.val-zero{color:var(--t4)}

/* ── MONTH NAV ── */
.month-nav{display:flex;align-items:center;gap:10px;margin-bottom:22px}
.mnav-btn{
  width:34px;height:34px;background:var(--s3);border:1px solid var(--brd);
  color:var(--t1);border-radius:var(--rsm);cursor:pointer;font-size:16px;
  display:flex;align-items:center;justify-content:center;
  transition:all .12s;flex-shrink:0;font-weight:600;
}
.mnav-btn:hover{background:var(--s4);border-color:var(--brd2)}
.month-label{font-size:20px;font-weight:800;color:var(--t1);letter-spacing:-.3px}
.month-sub{font-size:13px;color:var(--t3);margin-left:6px}

/* ── SETTINGS ── */
.settings-section{
  background:var(--s2);border:1px solid var(--brd);border-radius:var(--r);
  margin-bottom:20px;overflow:hidden;box-shadow:var(--shadow-sm);
}
.settings-section-title{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 18px;border-bottom:1px solid var(--brd);background:var(--s3);
}
.ss-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--t2)}
.ss-add-btn{
  background:var(--acc-d);border:1px solid rgba(45,212,160,.25);
  color:var(--acc);font-family:var(--f);font-size:12px;font-weight:600;
  padding:5px 12px;border-radius:6px;cursor:pointer;transition:all .12s;letter-spacing:.01em;
}
.ss-add-btn:hover{background:var(--acc-m)}

/* ── ITEM ROW ── */
.item-row{
  display:flex;align-items:center;gap:10px;padding:12px 18px;
  border-bottom:1px solid var(--brd);transition:background .1s;
}
.item-row:last-child{border-bottom:none}
.item-row:hover{background:rgba(255,255,255,.02)}
.item-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;cursor:pointer;transition:transform .1s}
.item-dot:hover{transform:scale(1.4)}
.item-name{flex:1;font-size:13px;font-weight:500;color:var(--t1);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item-amount{font-size:13px;font-weight:600;min-width:90px;text-align:right;font-variant-numeric:tabular-nums}
.item-amount.inc{color:var(--grn)}.item-amount.exp{color:var(--red)}.item-amount.tax{color:var(--amber)}
.item-day-badge{
  background:var(--s3);border:1px solid var(--brd2);border-radius:6px;
  padding:3px 8px;font-size:11px;font-weight:600;color:var(--t2);white-space:nowrap;flex-shrink:0;
  cursor:pointer;transition:border-color .1s;
}
.item-day-badge:hover{border-color:var(--brd3);color:var(--t1)}
.item-repeat-badge{
  background:var(--plan-d);border:1px solid rgba(124,136,245,.2);border-radius:6px;
  padding:3px 8px;font-size:10px;font-weight:700;color:var(--plan);white-space:nowrap;flex-shrink:0;
  cursor:pointer;transition:all .1s;letter-spacing:.02em;text-transform:uppercase;
}
.item-repeat-badge:hover{background:rgba(124,136,245,.2)}
.item-edit{
  background:none;border:none;color:var(--t3);cursor:pointer;
  font-size:14px;padding:3px 7px;border-radius:6px;line-height:1;flex-shrink:0;
  font-family:var(--f);transition:all .1s;
}
.item-edit:hover{color:var(--t1);background:var(--s4)}
.auto-tag{
  background:var(--amber-d);border:1px solid rgba(232,172,58,.25);
  color:var(--amber);font-size:9px;font-weight:700;padding:2px 6px;border-radius:4px;
  white-space:nowrap;text-transform:uppercase;letter-spacing:.05em;
}

/* ── CAT HEADER ── */
.cat-header{
  display:flex;align-items:center;gap:8px;padding:11px 18px;
  cursor:pointer;user-select:none;border-bottom:1px solid var(--brd);
  position:relative;border-left:3px solid transparent;
  transition:background .12s;
}
.cat-header::before{
  content:'▶';font-size:8px;color:var(--t3);
  transition:transform .15s;flex-shrink:0;
}
.cat-header.collapsed::before{transform:rotate(0deg)}
.cat-header:not(.collapsed)::before{transform:rotate(90deg)}
.cat-header:hover{background:rgba(255,255,255,.02)}
.cat-header.inc{border-left-color:var(--grn)}
.cat-header.exp{border-left-color:var(--red)}
.cat-body{
  overflow:hidden;transition:max-height .2s ease;
  border-left:2px solid var(--brd);margin-left:16px;
}
.cat-body.collapsed{max-height:0!important;border-left-color:transparent}
.cat-body .item-row{padding-left:14px}

/* ── INLINE EDIT ── */
.ie-amt{
  background:var(--s4);border:1px solid var(--brd3);border-radius:5px;
  color:var(--t1);font-family:var(--f);font-size:inherit;
  width:85px;padding:2px 7px;outline:none;font-weight:600;text-align:right;
  font-variant-numeric:tabular-nums;
}
.ie-rep{
  background:var(--plan-d);border:1px solid rgba(124,136,245,.25);border-radius:5px;
  color:var(--plan);font-family:var(--f);font-size:10px;
  padding:2px 5px;outline:none;font-weight:700;text-transform:uppercase;
}
.ie-day{
  background:var(--s4);border:1px solid var(--brd3);border-radius:5px;
  color:var(--t1);font-family:var(--f);font-size:inherit;
  width:60px;padding:2px 6px;outline:none;font-weight:600;text-align:center;
}

/* ── TOGGLE ── */
.tg{position:relative;display:inline-block;width:40px;height:24px;flex-shrink:0;cursor:pointer}
.tg input{opacity:0;width:0;height:0}
.tg-s{position:absolute;inset:0;background:var(--s5);border-radius:12px;transition:.2s;border:1px solid var(--brd2)}
.tg-s::before{content:'';position:absolute;width:18px;height:18px;border-radius:50%;background:var(--t3);top:2px;left:2px;transition:.2s}
.tg input:checked+.tg-s{background:var(--acc-d);border-color:rgba(45,212,160,.3)}
.tg input:checked+.tg-s::before{background:var(--acc);transform:translateX(16px)}

/* ── MODAL ── */
.overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.65);
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  z-index:100;display:none;align-items:flex-end;justify-content:center;
}
.overlay.open{display:flex}
@media(min-width:600px){.overlay{align-items:center}}
.modal{
  background:var(--s2);border:1px solid var(--brd2);
  border-radius:20px 20px 0 0;width:100%;max-width:520px;
  padding:22px 22px 40px;max-height:92dvh;overflow-y:auto;
  box-shadow:0 -12px 60px rgba(0,0,0,.6),0 -2px 8px rgba(0,0,0,.4);
  position:relative;
}
.modal::before{
  content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,var(--brd2),transparent);
}
@media(min-width:600px){.modal{border-radius:16px;max-height:80vh}}
.mhandle{width:32px;height:3px;background:var(--s5);border-radius:2px;margin:0 auto 20px}
.mtitle{font-size:18px;font-weight:800;margin-bottom:20px;letter-spacing:-.2px}
.frow{margin-bottom:16px}
.flabel{display:block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--t3);margin-bottom:7px}
.finput,.fselect{
  width:100%;background:var(--s3);border:1.5px solid var(--brd);border-radius:10px;
  padding:12px 14px;color:var(--t1);font-family:var(--f);font-size:14px;
  outline:none;transition:border-color .15s,background .15s;-webkit-appearance:none;appearance:none;
}
.finput:focus,.fselect:focus{border-color:var(--acc);background:var(--s4)}
.finput::placeholder{color:var(--t3)}
.finput.small{font-size:13px;padding:9px 12px}
.frow-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mbtns{display:flex;gap:8px;margin-top:20px}
.mbtn{
  flex:1;padding:13px;border-radius:10px;border:1.5px solid var(--brd2);
  background:var(--s3);color:var(--t1);font-family:var(--f);
  font-size:14px;font-weight:600;cursor:pointer;transition:all .15s;letter-spacing:.01em;
}
.mbtn:hover{background:var(--s4);border-color:var(--brd3)}
.mbtn:active{opacity:.8}
.mbtn.ok{background:var(--acc-d);color:var(--acc);border-color:rgba(45,212,160,.3)}
.mbtn.ok:hover{background:var(--acc-m)}
.mbtn.danger{background:var(--red-d);color:var(--red);border-color:rgba(240,101,101,.2)}

/* ── COLOR SWATCHES ── */
.cswatches{display:flex;gap:8px;flex-wrap:wrap;padding:2px}
.csw{
  width:28px;height:28px;border-radius:50%;cursor:pointer;
  border:2.5px solid transparent;transition:transform .12s,border-color .12s;
  -webkit-tap-highlight-color:transparent;
}
.csw:hover{transform:scale(1.15)}
.csw.sel{border-color:rgba(255,255,255,.85);transform:scale(1.18)}

/* ── TOAST ── */
.toast{
  position:fixed;bottom:24px;left:50%;
  transform:translateX(-50%) translateY(16px);
  background:var(--s4);border:1px solid var(--brd3);border-radius:20px;
  padding:10px 22px;font-size:13px;font-weight:500;color:var(--t1);
  opacity:0;transition:all .22s;pointer-events:none;white-space:nowrap;z-index:300;
  box-shadow:var(--shadow-lg);letter-spacing:.01em;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ── LOADER ── */
.loader{
  position:fixed;inset:0;background:var(--bg);z-index:200;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
  transition:opacity .4s;
}
.loader.done{opacity:0;pointer-events:none}
.spin{
  width:36px;height:36px;border:2.5px solid var(--s4);
  border-top-color:var(--acc);border-radius:50%;animation:spin .7s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.loader-text{font-size:13px;color:var(--t3);font-weight:500;letter-spacing:.02em}

/* ── CALENDAR POPUP ── */
.cal-popup{
  background:var(--s4);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border:1px solid var(--brd2);border-radius:14px;padding:12px;
  width:220px;position:fixed;z-index:300;transform:translateX(-50%);
  box-shadow:var(--shadow-lg);
}

// LOCALSTORAGE
// ══════════════════════════════════
function saveL(){try{localStorage.setItem(LS,JSON.stringify(D));}catch(e){}}
function loadL(){try{const d=JSON.parse(localStorage.getItem(LS)||'null');if(d)D=d;}catch(e){}}

// ══════════════════════════════════
// SUPABASE INIT — single JSON row
// ══════════════════════════════════
async function initApp(){
  setLT('Загрузка…');
  try{
    // Supabase — главный источник данных, загружаем первым
    const rows=await sGet('kp_data','key=eq.main&select=data');
    if(rows.length>0&&rows[0].data){
      const remote=rows[0].data;
      if(remote.accounts&&remote.accounts.length) D.accounts=remote.accounts;
      if(remote.items&&remote.items.length) D.items=remote.items;
      D.done=remote.done||{};
      D.settings=remote.settings||D.settings||{taxRate:7,taxBase:'all'};
    } else {
      // Supabase пуст — берём из localStorage как запасной вариант
      loadL();
    }
    dbOk=true; ss('ok'); saveL();
  }catch(e){
    // Supabase недоступен — берём из localStorage
    dbOk=false; ss('err');
    loadL();
    console.warn('DB:',e);
  }
  // seed defaults — только для новых пользователей
  if(!D.accounts.length) D.accounts=DEFAULT_ACCOUNTS;
  if(!D.items.length) D.items=DEFAULT_ITEMS;
  // migrate old single vvd to 3 separate items
  const oldIdx=D.items.findIndex(i=>i.id==='e_vvd');
  if(oldIdx>=0){
    const old=D.items[oldIdx];
    const amt=Math.round((Number(old.amount)||0)/3);
    D.items.splice(oldIdx,1,
      {id:'e_vvd1', type:'expense', categoryKey:'vvd', category:'Вывод себе (личное) 1', pvzAddr:null, amount:amt, day:1, repeat:'monthly', taxable:false, color:old.color||'#e879f9'},
      {id:'e_vvd2', type:'expense', categoryKey:'vvd', category:'Вывод себе (личное) 2', pvzAddr:null, amount:amt, day:10, repeat:'monthly', taxable:false, color:old.color||'#e879f9'},
      {id:'e_vvd3', type:'expense', categoryKey:'vvd', category:'Вывод себе (личное) 3', pvzAddr:null, amount:amt, day:20, repeat:'monthly', taxable:false, color:old.color||'#e879f9'}
    );
  }
  // migrate: add Управление items if missing
  const hasMgmt=D.items.some(i=>i.categoryKey==='mgmt');
  if(!hasMgmt){
    const mgmtItems=PVZ_LIST.map(p=>({
      id:'e_mgmt_'+p.key, type:'expense',
      categoryKey:'mgmt', category:'Управление',
      pvzAddr:p.key, amount:0, day:5,
      repeat:'monthly', taxable:false, color:p.color,
    }));
    const lastZpIdx=D.items.reduce((acc,it,i)=>it.categoryKey==='zp'?i:acc,-1);
    if(lastZpIdx>=0) D.items.splice(lastZpIdx+1,0,...mgmtItems);
    else D.items.push(...mgmtItems);
  }
  D.settings=D.settings||{taxRate:7,taxBase:'all'};
  saveL();
  if(dbOk){try{await sUp('kp_data',[{key:'main',data:D}]);}catch(e){}}

  hideLoader(); renderAll();
  setInterval(trySync,45000);
}

async function pushData(){
  if(!dbOk){saveL();return;}
  ss('sync');
  try{await sUp('kp_data',[{key:'main',data:D}]);ss('ok');saveL();}
  catch(e){ss('err');saveL();}
}

async function trySync(){
  if(dbOk)return;
  try{await sGet('kp_data','limit=1');dbOk=true;await pushData();}catch(e){}
}

function uid(){return 'x'+Date.now()+Math.random().toString(36).slice(2,6);}
function getDays(y,m){return new Date(y,m+1,0).getDate();}
function getWd(y,m,d){return new Date(y,m,d).getDay();}
function isWe(y,m,d){const w=getWd(y,m,d);return w===0||w===6;}
function isToday(y,m,d){const t=new Date();return t.getFullYear()===y&&t.getMonth()===m&&t.getDate()===d;}
function workdays(y,m,f,t){let n=0;for(let d=f;d<=t;d++){const w=getWd(y,m,d);if(w>=1&&w<=5)n++;}return n;}
function itemDays(item){return (item.days&&item.days.length)?item.days:[item.day||1];}
function fmt(n,plus){
  if(n===null||n===undefined||n===0)return n===0?'0₽':'';
  const s=Math.abs(n).toLocaleString('ru-RU');
  if(plus&&n>0)return '+'+s+'₽';
  return (n<0?'−':'')+s+'₽';
}
function fmtK(n){
  if(!n)return '0₽';
  const abs=Math.abs(n);
  const s=abs>=1000000?(abs/1000000).toFixed(1).replace('.0','')+'М':abs>=1000?(abs/1000).toFixed(0)+'к':abs.toString();
  return (n<0?'−':'')+s+'₽';
}

// ══════════════════════════════════
// CASHFLOW LOGIC
// ══════════════════════════════════
function buildDailyCF(year,month,startOverride){
  const days=getDays(year,month);
  const taxRate=(D.settings.taxRate||7)/100;
  const taxBase=D.settings.taxBase||'all';

  // quarters: Q1=Mar, Q2=Jun, Q3=Sep, Q4=Dec
  const taxMonths=[2,5,8,11];
  const isTaxMonth=taxMonths.includes(month);

  // starting balance — use override if given, else current accounts sum
  const rawBalance=D.accounts.reduce((s,a)=>s+(Number(a.balance)||0),0);
  const startBalance=startOverride!==undefined?startOverride:rawBalance;

  // build day-level events
  const events={};
  for(let d=1;d<=days;d++)events[d]=[];

  // income items
  const now_=new Date(), cy_=now_.getFullYear(), cm_=now_.getMonth();
  const isCurMonth=(year===cy_&&month===cm_);
  const incomes=D.items.filter(i=>i.type==='income'&&(Number(i.amount)||0)>0);
  for(const item of incomes){
    const amt=Number(item.amount);
    const dlist=itemDays(item);
    for(let di=0;di<dlist.length;di++){
      const d0=dlist[di];
      // done key: first date = itemId, second date = itemId_2
      const doneKey=di===0?item.id:item.id+'_2';
      const isDone=isCurMonth&&D.done[doneKey];
      if(isDone) continue; // skip — already processed
      if(item.repeat==='weekly'){
        for(let d2=d0;d2<=days;d2+=7){
          if(isCurMonth&&D.done[weeklyDoneKey(item.id,d2)]) continue;
          events[d2].push({name:item.category,amount:amt,type:'income',color:item.color,id:item.id});
          if(isTaxMonth&&item.taxable&&amt>0){
            const taxOk=taxBase==='all'||(taxBase==='pvz'&&item.pvzAddr)||(taxBase==='pvz_w'&&(item.pvzAddr||item.categoryKey==='w'));
            if(taxOk) events[d2].push({name:'Налог',amount:-Math.round(amt*taxRate),type:'tax',color:'#fbbf24',auto:true});
          }
        }
      } else if(item.repeat==='monthly'||item.repeat===undefined||item.repeat==='once'){
        const d=Math.min(d0,days);
        events[d].push({name:item.category,amount:amt,type:'income',color:item.color,id:item.id});
        if(isTaxMonth&&item.taxable&&amt>0){
          const taxOk=taxBase==='all'||(taxBase==='pvz'&&item.pvzAddr)||(taxBase==='pvz_w'&&(item.pvzAddr||item.categoryKey==='w'));
          if(taxOk) events[d].push({name:'Налог',amount:-Math.round(amt*taxRate),type:'tax',color:'#fbbf24',auto:true});
        }
      }
    }
  }

  // compute total tax for KPI
  let taxableIncome=0;
  for(const item of incomes){
    if(!item.taxable)continue;
    if(taxBase==='pvz'&&!item.pvzAddr)continue;
    if(taxBase==='pvz_w'&&!item.pvzAddr&&item.categoryKey!=='w')continue;
    taxableIncome+=Number(item.amount)||0;
  }
  const taxAmount=Math.round(taxableIncome*taxRate);

  // expense items — salary is handled separately
  const expenses=D.items.filter(i=>i.type==='expense'&&(Number(i.amount)||0)>0&&i.categoryKey!=='zp');
  for(const item of expenses){
    const dlist=itemDays(item);
    for(let di=0;di<dlist.length;di++){
      const d0=dlist[di];
      const doneKey=di===0?item.id:item.id+'_2';
      const isDone=isCurMonth&&D.done[doneKey];
      if(isDone) continue;
      const d=Math.min(d0,days);
      if(item.repeat==='weekly'){
        for(let d2=d;d2<=days;d2+=7){
          if(isCurMonth&&D.done[weeklyDoneKey(item.id,d2)]) continue;
          events[d2].push({name:item.category,amount:-Number(item.amount),type:'expense',color:item.color,id:item.id});
        }
      } else if(item.repeat==='monthly'||item.repeat===undefined||item.repeat==='once'){
        events[d].push({name:item.category,amount:-Number(item.amount),type:'expense',color:item.color,id:item.id});
      } else if(item.repeat==='quarterly'){
        events[d].push({name:item.category,amount:-Number(item.amount),type:'expense',color:item.color,id:item.id});
      }
    }
  }

  // salary: auto 5th & 20th from shiftCost
  const salaryItems=D.items.filter(i=>i.categoryKey==='zp'&&(Number(i.amount)||0)>0);
  if(salaryItems.length){
    let pm=month-1,py=year; if(pm<0){pm=11;py--;}
    const pmd=getDays(py,pm);
    const days5=pmd-15;
    const days20=15;
    for(const item of salaryItems){
      const sc=Number(item.amount)||0;
      const pvzName=(PVZ_LIST.find(p=>p.key===item.pvzAddr)||{}).name||item.pvzAddr||'';
      const d5=Math.min(5,days), d20=Math.min(20,days);
      const done1=isCurMonth&&D.done[item.id];
      const done2=isCurMonth&&D.done[item.id+'_2'];
      if(!done1&&d5<=days) events[d5].push({name:pvzName+' — аванс',amount:-Math.round(sc*days5),type:'expense',color:item.color,id:item.id});
      if(!done2&&d20<=days) events[d20].push({name:pvzName+' — зп',amount:-Math.round(sc*days20),type:'expense',color:item.color,id:item.id});
    }
  }

  // build daily running balance
  const daily=[];
  let balance=startBalance;
  for(let d=1;d<=days;d++){
    const dayEvents=events[d];
    let dayIncome=dayEvents.filter(e=>e.type==='income').reduce((s,e)=>s+e.amount,0);
    let dayExpense=dayEvents.filter(e=>e.type!=='income').reduce((s,e)=>s+e.amount,0);

    const dayNet=dayIncome+dayExpense;
    balance+=dayNet;
    daily.push({d,events:dayEvents,income:dayIncome,expense:dayExpense,net:dayNet,balance,we:isWe(year,month,d),tod:isToday(year,month,d)});
  }

  return {daily,startBalance:rawBalance,taxAmount,taxableIncome,isTaxMonth};
}

// Стартовый баланс для месяца:
// Текущий месяц — реальный баланс счетов (buildDailyCF считает с 1-го числа)
// Будущий месяц — итог предыдущего месяца
// Прошлое — не используется
function getMonthStartBalance(year,month){
  const now=new Date(), cy=now.getFullYear(), cm=now.getMonth();
  const current=D.accounts.reduce((s,a)=>s+(Number(a.balance)||0),0);

  if(year===cy&&month===cm) return current;

  if(year>cy||(year===cy&&month>cm)){
    // future: chain from current month
    let bal=current;
    let y=cy, m=cm;
    while(y<year||(y===year&&m<month)){
      const cf=buildDailyCF(y,m,bal);
      bal=cf.daily[cf.daily.length-1].balance;
      m++; if(m>11){m=0;y++;}
    }
    return bal;
  }

  // past month — return current (no history)
  return current;
}

// ══════════════════════════════════
// SAFE WITHDRAWAL CALC
// ══════════════════════════════════
// Сколько можно вывести прямо сейчас, не уйдя в минус ни в один день
// начиная с сегодня и на 12 месяцев вперёд.
// Учитывает тумблер paidToday так же как buildDailyCF.
function calcSafeWithdrawal(){
  const now=new Date();
  const cy=now.getFullYear(), cm=now.getMonth(), cd=now.getDate();
  const currentTotal=D.accounts.reduce((s,a)=>s+(Number(a.balance)||0),0);

  let minBalance=Infinity;
  let minMonth=cm, minYear=cy;

  // --- Текущий месяц ---
  // Стартуем с реального баланса. buildDailyCF пропускает done-строки,
  // поэтому учитываются только непроведённые операции — весь месяц целиком.
  {
    const cf = buildDailyCF(cy, cm, currentTotal);
    for(const day of cf.daily){
      if(day.balance < minBalance){ minBalance = day.balance; minMonth = cm; minYear = cy; }
    }
    var carryBal = cf.daily[cf.daily.length-1].balance;
  }

  // --- Следующие 12 месяцев ---
  let scanM = cm + 1, scanY = cy;
  if(scanM > 11){ scanM = 0; scanY++; }

  for(let i = 0; i < 12; i++){
    const cf = buildDailyCF(scanY, scanM, carryBal);
    for(const day of cf.daily){
      if(day.balance < minBalance){ minBalance = day.balance; minMonth = scanM; minYear = scanY; }
    }
    carryBal = cf.daily[cf.daily.length - 1].balance;
    scanM++; if(scanM > 11){ scanM = 0; scanY++; }
  }

  const buffer = Number(D.settings.safetyBuffer)||0;
  const safe = Math.max(0, Math.floor(minBalance) - buffer);
  return { safe, minBalance: Math.floor(minBalance), minMonth, minYear };
}

function renderAll(){
  document.getElementById('monthLabel').textContent=MONTHS[curMonth]+' '+curYear;
  document.getElementById('monthSub').textContent='';
  const msb=getMonthStartBalance(curYear,curMonth);
  renderKPI(msb);
  renderAccounts();
  renderCashflow(msb);
  renderSettings();
  // restore tax settings inputs
  document.getElementById('taxRate').value=D.settings.taxRate||7;
  document.getElementById('taxBase').value=D.settings.taxBase||'all';

}

function renderKPI(msb){
  const {daily,startBalance,taxAmount,taxableIncome}=buildDailyCF(curYear,curMonth,msb);
  const totalIncome=D.items.filter(i=>i.type==='income').reduce((s,i)=>s+(Number(i.amount)||0),0);
  const totalExpense=daily.reduce((s,d)=>s+Math.abs(d.expense),0)+taxAmount;
  const endBalance=daily.length?daily[daily.length-1].balance:startBalance;

  document.getElementById('kpiGrid').innerHTML=[
    {label:'Текущий баланс',    val:fmtK(startBalance), cls:startBalance<0?'r':startBalance<50000?'am':'a'},
    {label:'Прогноз доходов',   val:fmtK(totalIncome),  cls:'g'},
    {label:'Прогноз расходов',  val:fmtK(totalExpense), cls:'r'},
    {label:'Налог '+((D.settings.taxRate)||7)+'%', val:fmtK(taxAmount), cls:'am'},
    {label:'Остаток конец мес.', val:fmtK(endBalance),  cls:endBalance<0?'r':endBalance<30000?'am':'a'},
  ].map(k=>`<div class="kpi"><div class="kpi-label">${k.label}</div><div class="kpi-val ${k.cls}">${k.val}</div></div>`).join('');

  // Расчёт безопасного вывода
  const {safe, minBalance, minMonth, minYear} = calcSafeWithdrawal();
  const safeCls = safe <= 0 ? 'bad' : safe < 100000 ? 'warn' : 'ok';
  const minLabel = MONTHS[minMonth] + ' ' + minYear;
  const safeDesc = safe <= 0
    ? `⚠ Вывод невозможен — разрыв в ${minLabel} (мин. остаток ${fmt(minBalance)})`
    : `Узкое место: ${minLabel} — минимальный остаток ${fmt(minBalance)}`;

  document.getElementById('freeMoneyBar').innerHTML=`
    <div style="flex:1;min-width:0">
      <div class="fm-label">Можно вывести из оборота сейчас</div>
      <div class="fm-val ${safeCls}">${safe > 0 ? fmt(safe) : '0₽'}</div>
      <div class="fm-desc">${safeDesc}</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:10px;align-items:flex-end;flex-shrink:0">
      <div style="text-align:right">
        <div style="font-size:11px;color:var(--t3);margin-bottom:3px">Баланс сейчас</div>
        <div style="font-size:16px;font-weight:700;color:var(--t2)">${fmt(D.accounts.reduce((s,a)=>s+(Number(a.balance)||0),0))}</div>
      </div>
      <div style="text-align:right">
        <div style="font-size:11px;color:var(--t3);margin-bottom:3px">Конец месяца</div>
        <div style="font-size:16px;font-weight:700;color:${endBalance<0?'var(--red)':endBalance<50000?'var(--amber)':'var(--t2)'}">${fmt(endBalance)}</div>
      </div>
      <div style="text-align:right">
        <div style="font-size:11px;color:var(--t3);margin-bottom:5px">Страховой буфер</div>
        <div style="display:flex;align-items:center;gap:6px;justify-content:flex-end">
          <input
            type="number" min="0" step="10000"
            value="${D.settings.safetyBuffer||0}"
            style="width:100px;background:var(--s3);border:1.5px solid var(--brd2);border-radius:8px;color:var(--t1);font-family:var(--f);font-size:13px;font-weight:600;padding:5px 8px;text-align:right;outline:none;"
            onchange="D.settings.safetyBuffer=Math.max(0,parseInt(this.value)||0);pushData();renderAll();"
            onfocus="this.style.borderColor='var(--acc)'"
            onblur="this.style.borderColor='var(--brd2)'"
            title="Минимальный остаток на счетах">
          <span style="font-size:13px;color:var(--t2);font-weight:600">₽</span>
        </div>
      </div>
    </div>`;
}

function renderCashflow(msb){
  const {daily}=buildDailyCF(curYear,curMonth,msb);
  const incomeItems=D.items.filter(i=>i.type==='income'&&(Number(i.amount)||0)>0);
  const expItems=D.items.filter(i=>i.type==='expense'&&(Number(i.amount)||0)>0);

  const itemDayMap={}; // itemId -> {day: amount}
  const taxDayMap={};

  for(const day of daily){
    for(const ev of day.events){
      if(ev.auto){taxDayMap[day.d]=(taxDayMap[day.d]||0)+Math.abs(ev.amount);}
      else if(ev.id){
        if(!itemDayMap[ev.id])itemDayMap[ev.id]={};
        itemDayMap[ev.id][day.d]=Math.abs(ev.amount);
      }
    }
  }

  const days=daily.length;
  const cols=daily;

  let html='<thead><tr><th class="row-head">Статья</th>';
  for(const day of cols){
    const cl=(day.we?'we-col':'')+(day.tod?' today-col':'');
    html+=`<th class="${cl}" style="min-width:56px"><div style="font-size:12px;font-weight:700">${day.d}</div><div style="font-size:9px;opacity:.5;margin-top:1px">${WD[getWd(curYear,curMonth,day.d)]}</div></th>`;
  }
  html+='</tr></thead><tbody>';

  // ── INCOME (grouped by categoryKey) ──
  html+=`<tr class="row-section"><td colspan="${days+1}">Доходы</td></tr>`;

  const incGroups={};
  for(const item of incomeItems){
    const key=item.categoryKey||item.id;
    if(!incGroups[key]) incGroups[key]={name:item.category||item.id,items:[]};
    incGroups[key].items.push(item);
  }
  for(const [key,grp] of Object.entries(incGroups)){
    html+=`<tr class="row-income"><td>${grp.name}</td>`;
    for(const day of cols){
      const v=grp.items.reduce((s,it)=>s+((itemDayMap[it.id]||{})[day.d]||0),0);
      const cl=(day.we?'we-col':'')+(day.tod?' today-col':'');
      html+=`<td class="${cl} ${v?'val-pos':'val-zero'}">${v?fmt(v):''}</td>`;
    }
    html+='</tr>';
  }
  html+=`<tr class="row-total"><td>Итого доходов</td>`;
  for(const day of cols){
    const cl=(day.we?'we-col':'')+(day.tod?' today-col':'');
    html+=`<td class="${cl} ${day.income?'val-pos':'val-zero'}">${day.income?fmt(day.income):''}</td>`;
  }
  html+='</tr>';

  // ── EXPENSES (per PVZ, all categories aggregated) ──
  html+=`<tr class="row-section"><td colspan="${days+1}">Расходы по ПВЗ</td></tr>`;

  const pvzExpDayMap={}; // pvzAddr -> {day: totalAmount}
  for(const item of expItems.filter(i=>i.pvzAddr)){
    const dm=itemDayMap[item.id]||{};
    for(const [d,v] of Object.entries(dm)){
      if(!pvzExpDayMap[item.pvzAddr]) pvzExpDayMap[item.pvzAddr]={};
      pvzExpDayMap[item.pvzAddr][d]=(pvzExpDayMap[item.pvzAddr][d]||0)+v;
    }
  }

  for(const pvz of PVZ_LIST){
    const dm=pvzExpDayMap[pvz.key]||{};
    if(!Object.values(dm).some(v=>v>0)) continue;
    html+=`<tr class="row-expense"><td style="padding-left:12px">
      <div style="display:flex;align-items:center;gap:6px">
        <div style="width:6px;height:6px;border-radius:50%;background:${pvz.color};flex-shrink:0"></div>
        ${pvz.name}
      </div></td>`;
    for(const day of cols){
      const v=dm[day.d]||0;
      const cl=(day.we?'we-col':'')+(day.tod?' today-col':'');
      html+=`<td class="${cl} ${v?'val-neg':'val-zero'}">${v?fmt(v):''}</td>`;
    }
    html+='</tr>';
  }

  // non-PVZ expenses
  const genExpItems=expItems.filter(i=>!i.pvzAddr);
  if(genExpItems.length){
    html+=`<tr class="row-section"><td colspan="${days+1}">Общие расходы</td></tr>`;
    for(const item of genExpItems){
      html+=`<tr class="row-expense"><td>${item.category||item.id}</td>`;
      for(const day of cols){
        const v=itemDayMap[item.id]?itemDayMap[item.id][day.d]:0;
        const cl=(day.we?'we-col':'')+(day.tod?' today-col':'');
        html+=`<td class="${cl} ${v?'val-neg':'val-zero'}">${v?fmt(v):''}</td>`;
      }
      html+='</tr>';
    }
  }

  // tax
  const hasTax=Object.values(taxDayMap).some(v=>v>0);
  if(hasTax){
    html+=`<tr class="row-tax"><td>Налог УСН ${D.settings.taxRate||7}% <span class="auto-tag">авто</span></td>`;
    for(const day of cols){
      const v=taxDayMap[day.d]||0;
      const cl=(day.we?'we-col':'')+(day.tod?' today-col':'');
      html+=`<td class="${cl} ${v?'val-neg':'val-zero'}">${v?fmt(v):''}</td>`;
    }
    html+='</tr>';
  }

  html+=`<tr class="row-total"><td>Итого расходов</td>`;
  for(const day of cols){
    const cl=(day.we?'we-col':'')+(day.tod?' today-col':'');
    const v=Math.abs(day.expense)+(taxDayMap[day.d]||0);
    html+=`<td class="${cl} ${v?'val-neg':'val-zero'}">${v?fmt(v):''}</td>`;
  }
  html+='</tr>';

  // ── BALANCE ──
  html+=`<tr class="row-section"><td colspan="${days+1}">Баланс</td></tr>`;
  html+=`<tr class="row-balance"><td>Остаток на конец дня</td>`;
  for(const day of cols){
    const b=day.balance;
    const balCls=b<0?'danger':b<50000?'warning':'';
    const cl=(day.we?'we-col':'')+(day.tod?' today-col':'');
    html+=`<td class="${cl} ${balCls}">${fmt(b)}</td>`;
  }
  html+='</tr>';

  html+='</tbody>';
  document.getElementById('cfTable').innerHTML=html;
  setTimeout(()=>{
    const tc=document.querySelector('.cf-table th.today-col');
    if(tc)tc.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});
  },100);
}

function subHead(label){
  return `<div style="padding:7px 16px 4px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--t3);background:var(--s3);border-bottom:1px solid var(--brd)">${label}</div>`;
}

function weeklyDates(item,year,month){
  const days=getDays(year,month);
  const start=Math.min(parseInt((item.days||[item.day||1])[0])||1,days);
  const dates=[];
  for(let d=start;d<=days;d+=7) dates.push(d);
  return dates;
}
function weeklyDoneKey(itemId,d){return itemId+'_d'+d;}

function isOverdue(item){
  // Only applies in current month, only if not done
  const now=new Date(), cy=now.getFullYear(), cm=now.getMonth(), cd=now.getDate();
  const isCurMonth=curYear===cy&&curMonth===cm;
  if(!isCurMonth) return false;
  if(item.repeat==='weekly'){
    return weeklyDates(item,cy,cm).some(d=>d<cd&&!D.done[weeklyDoneKey(item.id,d)]);
  }
  const dlist=itemDays(item);
  const key0=item.id,key1=item.id+'_2';
  if(dlist.length>=2){
    const d0passed=dlist[0]<cd,d1passed=dlist[1]<cd;
    return (d0passed&&!D.done[key0])||(d1passed&&!D.done[key1]);
  }
  return dlist[0]<cd&&!D.done[key0];
}

function isGroupOverdue(groupPvzKeys, catItems){
  // Группа просрочена если хотя бы одна строка внутри просрочена
  return catItems
    .filter(i=>groupPvzKeys.includes(i.pvzAddr))
    .some(i=>isOverdue(i));
}

function buildWeeklySub(item){
  const wdates=weeklyDates(item,curYear,curMonth);
  const now2=new Date(),cd2=(curYear===now2.getFullYear()&&curMonth===now2.getMonth())?now2.getDate():32;
  let h=`<div class="weekly-sub" id="wsub_${item.id}">`;
  wdates.forEach(d=>{
    const dk=weeklyDoneKey(item.id,d);
    const isDone=!!D.done[dk], isOvd=d<cd2&&!isDone;
    h+=`<div class="weekly-row ${isDone?'done-w':isOvd?'overdue-w':''}">
      <span class="weekly-date">${d} числа</span>
      <label class="tg" style="flex-shrink:0"><input type="checkbox" ${isDone?'checked':''} onchange="toggleWeeklyDone('${item.id}',${d})"><span class="tg-s"></span></label>
    </div>`;
  });
  h+=`</div>`;
  return h;
}

function toggleGroupDone(){
  const itemIds = window._ymAgIds || [];
  const allDone = itemIds.every(id => D.done[id]);
  itemIds.forEach(id => {
    if(allDone) delete D.done[id];
    else D.done[id] = true;
  });
  pushData();
  renderSettings();
  const msb = getMonthStartBalance(curYear, curMonth);
  renderCashflow(msb); renderKPI(msb);
}

function togglePvzGroup(id){
  const body=document.getElementById(id);
  const header=body?body.previousElementSibling:null;
  if(!body) return;
  const isOpen=body.classList.toggle('open');
  if(header) header.classList.toggle('open', isOpen);
}

function toggleCat(el){
  const body=el.nextElementSibling;
  if(!body||!body.classList.contains('cat-body')) return;
  el.classList.toggle('collapsed');
  body.classList.toggle('collapsed');
}

document.addEventListener('click',function(e){
  const amt=e.target.closest('.item-amount[data-id]');
  if(amt&&!amt.querySelector('input')){
    const id=amt.dataset.id, isAcct=amt.dataset.acct!==undefined;
    const item=isAcct?D.accounts.find(x=>x.id===id):D.items.find(x=>x.id===id);
    if(!item) return;
    const val=isAcct?item.balance:item.amount;
    amt.innerHTML=`<input class="ie-amt" type="number" value="${val||0}" step="${isAcct?'1000':'100'}">`;
    const inp=amt.querySelector('input');
    inp.focus(); inp.select();
    const save=()=>{
      const v=parseFloat(inp.value)||0;
      if(isAcct) item.balance=v; else item.amount=v;
      pushData(); renderAll();
    };
    inp.addEventListener('blur',save);
    inp.addEventListener('keydown',ev=>{ if(ev.key==='Enter') inp.blur(); });
    return;
  }
  const dayEl=e.target.closest('.item-day-badge[data-id]');
  if(dayEl&&!document.querySelector('.day-cal-popup')&&!dayEl.querySelector('input')){
    const id=dayEl.dataset.id, item=D.items.find(x=>x.id===id);
    if(!item) return;
    // For dual-date categories — show calendar popup
    if(DUAL_CAT.includes(item.categoryKey)){
      openDayCalPopup(dayEl, item);
      return;
    }
    // For all others — text input as before
    const inp=document.createElement('input');
    inp.className='ie-day';
    inp.type='text';
    inp.value=item.days?item.days.join(', '):(item.day||'1');
    inp.style.width='80px';
    dayEl.textContent=''; dayEl.appendChild(inp); inp.focus(); inp.select();
    const save=()=>{
      const raw=inp.value.trim();
      const nums=raw.split(',').map(s=>parseInt(s.trim())).filter(n=>!isNaN(n)&&n>=1&&n<=31);
      if(nums.length){item.days=nums; delete item.day;}
      else if(nums.length===1){item.days=nums;}
      pushData(); renderAll();
    };
    inp.addEventListener('blur',save);
    inp.addEventListener('keydown',ev=>{ if(ev.key==='Enter') inp.blur(); });
    return;
  }
  const rep=e.target.closest('.item-repeat-badge[data-id]');
  if(rep&&!rep.querySelector('select')){
    const id=rep.dataset.id, item=D.items.find(x=>x.id===id);
    if(!item) return;
    const sel=document.createElement('select'); sel.className='ie-rep';
    ['monthly','weekly','quarterly','once'].forEach(o=>{ const opt=document.createElement('option'); opt.value=o; opt.textContent=repeatLabel(o); if(item.repeat===o) opt.selected=true; sel.appendChild(opt); });
    rep.innerHTML=''; rep.appendChild(sel); sel.focus();
    sel.addEventListener('change',()=>{ item.repeat=sel.value; pushData(); renderAll(); });
    return;
  }
});

// ── DUAL DATE CALENDAR POPUP ──
const DUAL_CAT = ['zp','mgmt','w'];

let _calItem = null; // item being edited via popup

function openDayCalPopup(anchorEl, item){
  closeDayCalPopup();
  _calItem = item;
  const sel = (item.days||[item.day||1]).map(Number).slice(0,2);

  const popup = document.createElement('div');
  popup.className = 'day-cal-popup';
  popup.style.cssText = `
    position:fixed;z-index:500;
    background:var(--s3);border:1px solid var(--brd2);border-radius:14px;
    padding:14px;width:240px;
    box-shadow:0 12px 40px rgba(0,0,0,.6);
  `;

  popup.innerHTML = renderDayCalContent(sel);

  // Position near the badge
  document.body.appendChild(popup);
  const rect = anchorEl.getBoundingClientRect();
  const pw = 240, ph = 280;
  let top = rect.bottom + 6;
  let left = rect.left;
  if(left + pw > window.innerWidth - 10) left = window.innerWidth - pw - 10;
  if(top + ph > window.innerHeight - 10) top = rect.top - ph - 6;
  popup.style.top = top + 'px';
  popup.style.left = left + 'px';
}

function renderDayCalContent(sel){
  sel = sel.map(Number);
  let h = `<div style="font-size:11px;font-weight:700;color:var(--t2);text-align:center;margin-bottom:10px;text-transform:uppercase;letter-spacing:.6px">Выберите 2 даты</div>`;
  h += `<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:3px">`;
  for(let d=1;d<=31;d++){
    const isSel = sel.includes(d);
    h += `<div onclick="toggleCalDay(${d})" style="
      font-size:12px;font-weight:600;text-align:center;padding:6px 2px;border-radius:7px;cursor:pointer;
      background:${isSel?'var(--acc)':'var(--s4)'};
      color:${isSel?'var(--bg)':'var(--t2)'};
      transition:all .1s;
    ">${d}</div>`;
  }
  h += `</div>`;
  const sorted = [...sel].sort((a,b)=>a-b);
  h += `<div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--brd);display:flex;align-items:center;justify-content:space-between">`;
  h += `<div style="font-size:13px;color:var(--t2)">`;
  if(sorted.length===0) h += `<span style="color:var(--t3)">не выбрано</span>`;
  else h += sorted.map(d=>`<strong style="color:var(--acc)">${d}</strong>`).join(' и ') + ' <span style="color:var(--t3)">числа</span>';
  h += `</div>`;
  h += `<button onclick="closeDayCalPopup()" style="
    background:${sel.length===2?'var(--acc)':'var(--s5)'};
    border:none;border-radius:7px;padding:5px 10px;
    color:${sel.length===2?'var(--bg)':'var(--t3)'};
    font-family:var(--f);font-size:12px;font-weight:700;cursor:pointer;
  ">${sel.length===2?'Готово':'—'}</button>`;
  h += `</div>`;
  return h;
}

function toggleCalDay(d){
  if(!_calItem) return;
  let sel = (_calItem.days||[_calItem.day||1]).map(Number);
  const idx = sel.indexOf(d);
  if(idx>=0){ sel.splice(idx,1); }
  else if(sel.length<2){ sel.push(d); }
  else { sel = [sel[1], d]; } // replace oldest with new
  _calItem.days = sel; delete _calItem.day;
  // re-render popup content
  const popup = document.querySelector('.day-cal-popup');
  if(popup) popup.innerHTML = renderDayCalContent(sel);
  // save immediately on each click
  pushData(); renderSettings();
}

function closeDayCalPopup(){
  const popup = document.querySelector('.day-cal-popup');
  if(popup) popup.remove();
  _calItem = null;
}

// Close popup on outside click
document.addEventListener('click', function(ev){
  const popup = document.querySelector('.day-cal-popup');
  if(popup && !popup.contains(ev.target) && !ev.target.closest('.item-day-badge[data-id]')){
    closeDayCalPopup();
  }
}, true);

function repeatLabel(r){return {monthly:'Мес.',weekly:'Нед.',quarterly:'Кв.',once:'Один'}[r||'monthly']||'Мес.'}

// ── DONE TOGGLES ──
function toggleWeeklyDone(itemId,d){
  const key=weeklyDoneKey(itemId,d);
  if(D.done[key]) delete D.done[key]; else D.done[key]=true;
  pushData(); renderSettings();
  const msb=getMonthStartBalance(curYear,curMonth);
  renderCashflow(msb); renderKPI(msb);
}
function toggleWeeklySub(id){
  const el=document.getElementById(id);
  if(el) el.classList.toggle('open');
}
function toggleDone(itemId, dateIdx){
  const key = dateIdx===1 ? itemId+'_2' : itemId;
  if(D.done[key]) delete D.done[key]; else D.done[key]=true;
  pushData(); renderSettings(); renderCashflow(getMonthStartBalance(curYear,curMonth));
  // update KPI too
  const msb=getMonthStartBalance(curYear,curMonth);
  renderKPI(msb);
}

// Auto-reset done on 1st of each month at 01:00
function scheduleReset(){
  const now=new Date();
  const next=new Date(now.getFullYear(),now.getMonth()+1,1,1,0,0,0);
  const ms=next-now;
  setTimeout(()=>{
    D.done={}; pushData(); renderAll();
    scheduleReset();
  }, ms);
}
scheduleReset();

function doneToggleHtml(itemId, dateIdx){
  const key=dateIdx===1?itemId+'_2':itemId;
  const checked=D.done[key]?'checked':'';
  return `<label class="tg" title="${checked?'Проведено':'Отметить как проведено'}" style="flex-shrink:0">
    <input type="checkbox" ${checked} onchange="toggleDone('${itemId}',${dateIdx})">
    <span class="tg-s"></span>
  </label>`;
}

function itemRowHtml(item,type){
  const amtCls=type==='income'?'inc':'exp';
  const dlist=itemDays(item);
  const tgls=dlist.length>1
    ? dlist.map((_,i)=>doneToggleHtml(item.id,i)).join('')
    : doneToggleHtml(item.id,0);
  const isW=item.repeat==='weekly';
  return (`<div class="item-row ${isOverdue(item)?'overdue':''}" ${isW?`onclick="toggleWeeklySub('wsub_${item.id}')" style="cursor:pointer"`:''}>`+
    `<div class="item-dot" style="background:${item.color}" onclick="event.stopPropagation();openItemModal('${type}','${item.id}')"></div>`+
    `<div class="item-name">${item.category||item.id}${item.taxable?'<span style="font-size:9px;color:var(--amber);margin-left:6px">УСН</span>':''}</div>`+
    `<div class="item-amount ${amtCls}" data-id="${item.id}">${fmt(item.amount)||'—'}</div>`+
    `<div class="item-day-badge" data-id="${item.id}">${item.days?item.days.join(', '):(item.day||'—')}</div>`+
    `${isW?'<span style="font-size:10px;color:var(--t3);margin-left:4px">▾</span>':tgls}`+
    `<button class="item-edit" onclick="event.stopPropagation();openItemModal('${type}','${item.id}')">✎</button>`+
    `</div>`+
    (isW?buildWeeklySub(item):''));
}

// ══════════════════════════════════
// ACCOUNT BALANCE QUICK EDIT
// ══════════════════════════════════
function editBalance(id){
  const a=D.accounts.find(x=>x.id===id); if(!a)return;
  openItemModal('account',id);
}

// ══════════════════════════════════
// MODAL
// ══════════════════════════════════
function openItemModal(type,id){
  modalType=type; editingId=id||null;
  const isEdit=!!id;
  const mo=type==='account'?D.accounts.find(x=>x.id===id):D.items.find(x=>x.id===id);
  selColor=mo?mo.color:COLORS[Math.floor(Math.random()*COLORS.length)];

  let titleTxt='', body='', btns='';

  if(type==='account'){
    titleTxt=isEdit?`Счёт: ${mo.name}`:'Новый счёт';
    body=`
      <div class="frow"><label class="flabel">Название</label>
        <input class="finput" id="mName" value="${isEdit?mo.name:''}" placeholder="Название счёта"></div>
      <div class="frow"><label class="flabel">Текущий остаток, ₽</label>
        <input class="finput" id="mBalance" type="number" value="${isEdit?mo.balance:''}" placeholder="0"></div>
      <div class="frow"><label class="flabel">Цвет</label>
        <div class="cswatches" id="cpicker"></div></div>`;
    btns=isEdit?
      `<button class="mbtn danger" onclick="delItem('account','${id}')">Удалить</button>
       <button class="mbtn" onclick="closeModal()">Отмена</button>
       <button class="mbtn ok" onclick="saveAccount()">Сохранить</button>`:
      `<button class="mbtn" onclick="closeModal()">Отмена</button>
       <button class="mbtn ok" onclick="saveAccount()">Добавить</button>`;
  } else {
    titleTxt=isEdit?`Редактировать`:(type==='income'?'Новый доход':'Новый расход');
    const isIncome=type==='income'||(isEdit&&mo&&mo.type==='income');
    body=`
      <div class="frow"><label class="flabel">Категория</label>
        <select class="fselect" id="mCategory">
          ${(isIncome?PVZ_SERVICES:EXP_CATS).map(c=>`<option value="${c.key}" ${isEdit&&mo.categoryKey===c.key?'selected':''}>${c.name}</option>`).join('')}
          <option value="__other__" ${isEdit&&!PVZ_SERVICES.some(s=>s.key===mo.categoryKey)&&!EXP_CATS.some(c=>c.key===mo.categoryKey)?'selected':''}>Другое…</option>
        </select></div>
      <div class="frow" id="mOtherCatRow" style="display:${isEdit&&!PVZ_SERVICES.some(s=>s.key===mo.categoryKey)&&!EXP_CATS.some(c=>c.key===mo.categoryKey)?'flex':'none'}"><label class="flabel">Своя категория</label>
        <input class="finput" id="mOtherCat" value="${isEdit?mo.category:''}" placeholder="Название"></div>
      <div class="frow"><label class="flabel">ПВЗ</label>
        <select class="fselect" id="mPvzAddr">
          <option value="">Не привязан к ПВЗ</option>
          ${PVZ_LIST.map(p=>`<option value="${p.key}" ${isEdit&&mo.pvzAddr===p.key?'selected':''}>${p.name}</option>`).join('')}
        </select></div>
      <div class="frow-grid">
        <div class="frow"><label class="flabel" id="mAmtLabel">${isEdit&&mo.categoryKey==='zp'?'Стоимость смены, ₽':'Сумма, ₽'}</label>
          <input class="finput" id="mAmount" type="number" value="${isEdit?(mo.amount||''):''}" placeholder="0"></div>
        <div class="frow" id="mDayRow" style="display:${isEdit&&mo.categoryKey==='zp'?'none':'block'}"><label class="flabel">Дни месяца</label>
          <input class="finput" id="mDay" type="text" value="${isEdit?(mo.days?mo.days.join(', '):(mo.day||'1')):'1'}" placeholder="1, 15, 20"></div>
      </div>
      <div class="frow" id="mRepeatRow" style="display:${isEdit&&mo.categoryKey==='zp'?'none':'block'}"><label class="flabel">Повторение</label>
        <select class="fselect" id="mRepeat">
          <option value="monthly" ${(!isEdit||mo.repeat==='monthly')?'selected':''}>Каждый месяц</option>
          <option value="weekly" ${isEdit&&mo.repeat==='weekly'?'selected':''}>Каждую неделю</option>
          <option value="quarterly" ${isEdit&&mo.repeat==='quarterly'?'selected':''}>Каждый квартал</option>
           <option value="once" ${isEdit&&mo.repeat==='once'?'selected':''}>Один</option>
        </select></div>
      ${isIncome?`
      <div class="frow"><label class="flabel">Налогооблагаемый доход (УСН)</label>
        <select class="fselect" id="mTaxable">
          <option value="1" ${(!isEdit||mo.taxable)?'selected':''}>Да</option>
          <option value="0" ${isEdit&&!mo.taxable?'selected':''}>Нет</option>
        </select></div>`:''}
      <div class="frow"><label class="flabel">Цвет</label>
        <div class="cswatches" id="cpicker"></div></div>`;
    btns=isEdit?
      `<button class="mbtn danger" onclick="delItem('item','${id}')">Удалить</button>
       <button class="mbtn" onclick="closeModal()">Отмена</button>
       <button class="mbtn ok" onclick="saveItem()">Сохранить</button>`:
      `<button class="mbtn" onclick="closeModal()">Отмена</button>
       <button class="mbtn ok" onclick="saveItem()">Добавить</button>`;
  }

  document.getElementById('iModalTitle').textContent=titleTxt;
  document.getElementById('iModalBody').innerHTML=body;
  document.getElementById('iModalBtns').innerHTML=btns;
  buildCP();
  const catSel=document.getElementById('mCategory');
  if(catSel){
    catSel.onchange=()=>{
      const row=document.getElementById('mOtherCatRow');
      if(row) row.style.display=catSel.value==='__other__'?'flex':'none';
      const isZP=catSel.value==='zp';
      const dr=document.getElementById('mDayRow');
      const rr=document.getElementById('mRepeatRow');
      const al=document.getElementById('mAmtLabel');
      if(dr) dr.style.display=isZP?'none':'block';
      if(rr) rr.style.display=isZP?'none':'block';
      if(al) al.textContent=isZP?'Стоимость смены, ₽':'Сумма, ₽';
    };
  }
  document.getElementById('itemModal').classList.add('open');
  setTimeout(()=>{
    const firstInput=document.getElementById('mOtherCat')||catSel;
    if(firstInput) firstInput.focus();

  },80);
}

function buildCP(){
  const el=document.getElementById('cpicker'); if(!el)return;
  el.innerHTML=COLORS.map(c=>`<div class="csw ${c===selColor?'sel':''}" style="background:${c}" onclick="pickC('${c}')"></div>`).join('');
}
function pickC(c){
  selColor=c;
  document.querySelectorAll('#cpicker .csw').forEach(s=>s.classList.toggle('sel',s.style.background===c||s.style.backgroundColor===c));
}

function saveAccount(){
  const name=document.getElementById('mName').value.trim();
  const balance=parseFloat(document.getElementById('mBalance').value)||0;
  if(!name){showToast('Введите название');return;}
  if(editingId){
    const a=D.accounts.find(x=>x.id===editingId);
    if(a){a.name=name;a.balance=balance;a.color=selColor;}
  } else {
    D.accounts.push({id:uid(),name,balance,color:selColor});
  }
  closeModal(); pushData(); renderAll(); showToast('✓ Сохранено');
}

function saveItem(){
  const categoryKey=document.getElementById('mCategory').value;
  const otherCat=document.getElementById('mOtherCat')?.value.trim();
  const pvzAddr=document.getElementById('mPvzAddr').value||null;
  const amount=parseFloat(document.getElementById('mAmount').value)||0;
  const daysRaw=document.getElementById('mDay').value.trim();
  const days=categoryKey==='zp'?null:daysRaw.split(',').map(s=>parseInt(s.trim())).filter(n=>!isNaN(n)&&n>=1&&n<=31);
  const repeat=document.getElementById('mRepeat').value;
  const taxableEl=document.getElementById('mTaxable');
  const taxable=taxableEl?taxableEl.value==='1':false;

  let catName='', catKey='';
  if(categoryKey==='__other__'){
    if(!otherCat){showToast('Введите категорию');return;}
    catName=otherCat; catKey=otherCat.toLowerCase().replace(/[^a-zа-яё0-9]/g,'_');
  } else {
    const tp=modalType||'income';
    const list=tp==='income'?PVZ_SERVICES:EXP_CATS;
    const found=list.find(c=>c.key===categoryKey);
    if(found){catName=found.name;catKey=found.key;}
    else{catName=categoryKey;catKey=categoryKey;}
  }

  const itemData={category:catName,categoryKey:catKey,pvzAddr,amount,repeat,taxable,color:selColor};
  if(categoryKey==='zp'){itemData.days=null;itemData.day=null;}
  else if(days&&days.length) itemData.days=days;

  const tp=editingId?(D.items.find(x=>x.id===editingId)?.type||modalType):modalType;
  if(editingId){
    const it=D.items.find(x=>x.id===editingId);
    if(it){Object.assign(it,itemData);}
  } else {
    D.items.push({id:uid(),type:tp,...itemData});
  }
  closeModal(); pushData(); renderAll(); showToast('✓ Сохранено');
}

function delItem(cat,id){
  if(!confirm('Удалить?'))return;
  if(cat==='account')D.accounts=D.accounts.filter(x=>x.id!==id);
  else D.items=D.items.filter(x=>x.id!==id);
  closeModal(); pushData(); renderAll(); showToast('Удалено');
}

function closeModal(){document.getElementById('itemModal').classList.remove('open');}
document.getElementById('itemModal').addEventListener('click',e=>{if(e.target===document.getElementById('itemModal'))closeModal();});

// ══════════════════════════════════
// TAX SETTINGS
// ══════════════════════════════════
function saveTaxRate(){D.settings.taxRate=parseFloat(document.getElementById('taxRate').value)||7;pushData();renderAll();}
function saveTaxBase(){D.settings.taxBase=document.getElementById('taxBase').value;pushData();renderAll();}

function togglePaid(){D.settings.paidToday=document.getElementById('paidToday').checked;pushData();renderAll();}

// ══════════════════════════════════
// NAV
// ══════════════════════════════════
function showView(id,btn){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.querySelectorAll('.ntab').forEach(b=>b.classList.remove('active'));
  document.getElementById('view-'+id).classList.add('active');
  btn.classList.add('active');
}
function chMonth(d){
  curMonth+=d;
  if(curMonth>11){curMonth=0;curYear++;}
  if(curMonth<0){curMonth=11;curYear--;}
  renderAll();
}

// ══════════════════════════════════
// INIT
// ══════════════════════════════════
initApp();
</script>
