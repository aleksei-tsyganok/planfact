<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Платёжный календарь</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0e0e10;
  --s1:#111214;--s2:#18191c;--s3:#1f2023;--s4:#26272b;--s5:#2e2f33;
  --brd:rgba(255,255,255,.07);--brd2:rgba(255,255,255,.13);--brd3:rgba(255,255,255,.2);
  --acc:#34c759;--acc-d:rgba(52,199,89,.15);--acc-m:rgba(52,199,89,.25);
  --blue:#3a9fbf;--blue-d:rgba(58,159,191,.12);
  --red:#ff453a;--red-d:rgba(255,69,58,.12);
  --amber:#ff9f0a;--amber-d:rgba(255,159,10,.12);
  --grn:#34c759;--grn-d:rgba(52,199,89,.12);
  --plan:#bf5af2;--plan-d:rgba(191,90,242,.12);
  --t1:#d4d2cc;--t2:#6a6864;--t3:#3e3c3a;--t4:#26272b;
  --r:10px;--rsm:7px;
  --f:system-ui,-apple-system,sans-serif;
  --shadow-sm:0 1px 4px rgba(0,0,0,.5);
  --shadow-md:0 4px 16px rgba(0,0,0,.6);
  --shadow-lg:0 12px 40px rgba(0,0,0,.7);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg);
  background-image:radial-gradient(ellipse at 20% 0%,rgba(142,68,199,.08) 0%,transparent 50%),radial-gradient(ellipse at 80% 100%,rgba(58,159,191,.07) 0%,transparent 50%);
  background-attachment:fixed;
  color:var(--t1);
  font-family:var(--f);
  font-size:13px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  min-height:100dvh;
  overscroll-behavior:none;
  -webkit-tap-highlight-color:transparent;
}

/* ── TOPBAR ── */
.topbar{
  position:sticky;top:0;z-index:50;
  display:flex;align-items:center;gap:12px;padding:0 20px;height:48px;
  background:var(--bg);
  border-bottom:1px solid var(--brd);
}
.logo{
  font-size:15px;font-weight:800;letter-spacing:-.6px;
  background:linear-gradient(135deg,var(--acc) 0%,var(--blue) 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.logo span{-webkit-text-fill-color:var(--t3);font-weight:400;font-size:13px;letter-spacing:0}
.nav-tabs{display:flex;padding:0 4px;overflow-x:auto;scrollbar-width:none}
.nav-tabs::-webkit-scrollbar{display:none}
.ntab{padding:9px 14px;border:none;border-bottom:2px solid transparent;background:none;color:var(--t2);font-family:var(--f);font-size:13px;font-weight:500;cursor:pointer;transition:all .15s;white-space:nowrap}
.ntab:hover{color:var(--t1)}
.ntab.active{color:var(--t1);border-bottom-color:var(--acc)}
.sync-dot{width:6px;height:6px;border-radius:50%;background:var(--t3);flex-shrink:0;transition:background .3s}
.sync-dot.ok{background:var(--grn)}
.sync-dot.sync{background:var(--amber);animation:blink .9s ease-in-out infinite}
.sync-dot.err{background:var(--red)}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}


/* ── VIEWS ── */
.view{display:none;padding:24px 20px;max-width:1240px;margin:0 auto}
.view.active{display:block}
@media(max-width:599px){.view{padding:14px 12px}}

/* ── KPI GRID ── */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:10px;margin-bottom:24px}
.kpi{background:var(--s2);border:1px solid var(--brd);border-radius:10px;padding:11px 14px;position:relative;overflow:hidden;transition:border-color .2s}
.kpi:hover{border-color:var(--brd2)}
.kpi-label{font-size:10px;color:var(--t2);margin-bottom:2px;font-weight:400}
.kpi-val{font-size:16px;font-weight:700;line-height:1.1}
.kpi-val.g{color:var(--grn)}.kpi-val.r{color:var(--red)}.kpi-val.a{color:var(--acc)}
.kpi-val.b{color:var(--blue)}.kpi-val.p{color:var(--plan)}.kpi-val.am{color:var(--amber)}
.kpi-sub{font-size:11px;color:var(--t3);margin-top:5px;font-weight:400}

/* ── FREE MONEY BAR ── */
.free-money-bar{
  display:flex;align-items:center;justify-content:space-between;
  border-radius:var(--r);padding:18px 22px;margin-bottom:24px;gap:16px;flex-wrap:wrap;
  background:var(--s2);border:1px solid var(--brd);
  box-shadow:var(--shadow-sm);
  position:relative;overflow:hidden;
}
.free-money-bar::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(45,212,160,.04) 0%,transparent 60%);
  pointer-events:none;
}
.fm-label{font-size:11px;color:var(--t3);font-weight:600;text-transform:uppercase;letter-spacing:.7px;margin-bottom:6px}
.fm-val{font-size:30px;font-weight:800;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.fm-val.ok{color:var(--acc)}.fm-val.warn{color:var(--amber)}.fm-val.bad{color:var(--red)}
.fm-desc{font-size:12px;color:var(--t3);margin-top:3px;font-weight:400}

/* ── SECTION HEAD ── */
.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.section-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.9px;color:var(--t3)}
.sec-action{
  background:none;border:none;color:var(--t3);font-size:12px;cursor:pointer;
  padding:4px 10px;border-radius:6px;font-family:var(--f);transition:all .12s;font-weight:500;
}
.sec-action:hover{background:var(--s3);color:var(--t1)}

/* ── ACCOUNTS ── */
.accounts-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:24px}
.day-detail-overlay{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px);padding:20px}
.day-detail-panel{background:var(--s2);border-radius:16px;width:100%;max-width:480px;padding:20px;max-height:80dvh;overflow-y:auto;border:1px solid var(--brd2);box-shadow:0 24px 60px rgba(0,0,0,.5)}
.day-detail-title{font-size:16px;font-weight:700;color:var(--t1);margin-bottom:4px}
.day-detail-sub{font-size:12px;color:var(--t3);margin-bottom:16px}
.day-ev{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--brd)}
.day-ev:last-child{border-bottom:none}
.day-ev-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.day-ev-name{flex:1;font-size:13px;color:var(--t1);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.day-ev-amt{font-size:13px;font-weight:700;flex-shrink:0}
.acct-inline-input{background:transparent;border:none;border-bottom:2px solid var(--acc);color:var(--t1);font-family:var(--f);font-size:20px;font-weight:700;width:100%;outline:none;padding:2px 0;text-align:left}
.acct-card{
  background:var(--s2);border:1px solid var(--brd);border-radius:var(--r);
  padding:14px 16px;cursor:pointer;
  transition:border-color .15s,transform .12s;
  box-shadow:var(--shadow-sm);
  -webkit-tap-highlight-color:transparent;
  position:relative;overflow:hidden;
}
.acct-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,var(--brd2),transparent);
}
.acct-card:hover{border-color:var(--brd2);transform:translateY(-1px);box-shadow:var(--shadow-md)}
.acct-card:active{transform:translateY(0)}
.acct-name{font-size:11px;font-weight:600;color:var(--t2);margin-bottom:8px;display:flex;align-items:center;gap:7px;letter-spacing:.01em}
.acct-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.acct-val{font-size:20px;font-weight:700;letter-spacing:-.3px;color:var(--t1);font-variant-numeric:tabular-nums}

/* ── CASHFLOW TABLE ── */
.cf-wrap{
  overflow-x:auto;border-radius:var(--r);border:1px solid var(--brd);
  margin-bottom:24px;background:var(--s1);box-shadow:var(--shadow-md);
}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);border-radius:var(--r);overflow:hidden;border:1px solid var(--brd);margin-bottom:24px}
.cal-dow{background:var(--s3);padding:8px 4px;font-size:9px;font-weight:700;color:var(--t3);text-align:center;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--brd)}
.cal-cell{background:var(--s2);border-right:1px solid var(--brd);border-bottom:1px solid var(--brd);padding:22px 6px 5px;min-height:80px;box-sizing:border-box;position:relative}
.cal-cell:nth-child(7n){border-right:none}
.cal-cell.today{background:rgba(45,212,160,.07);box-shadow:inset 0 0 0 1px rgba(45,212,160,.35)}
.cal-cell.negative{background:rgba(248,113,113,.05)}
.cal-day{font-size:10px;font-weight:700;color:var(--t3);position:absolute;top:5px;right:6px;line-height:1}
.cal-cell.today .cal-day{color:var(--acc);font-size:11px}
.cal-inc{font-size:10px;font-weight:600;color:var(--grn);line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-exp{font-size:10px;font-weight:600;color:var(--red);line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-bal{font-size:10px;font-weight:700;padding:2px 4px;border-radius:3px;margin-top:3px;display:inline-block;line-height:1.3;white-space:nowrap}
.cal-bal.pos{background:rgba(63,207,122,.15);color:var(--grn)}
.cal-bal.neg{background:rgba(240,101,101,.18);color:var(--red)}
.cal-bal.warn{background:rgba(251,191,36,.15);color:var(--amber)}
.cal-empty{background:var(--s1);border-right:1px solid var(--brd);border-bottom:1px solid var(--brd)}
.cal-empty:nth-child(7n){border-right:none}
.settings-tabs{display:flex;gap:1px;background:var(--s3);border:1px solid var(--brd);border-radius:var(--rsm);padding:3px;margin-bottom:16px}
.stab{flex:1;padding:7px 4px;border-radius:6px;border:none;background:none;color:var(--t3);font-family:var(--f);font-size:12px;font-weight:500;cursor:pointer;transition:all .15s;text-align:center}
.stab.active{background:var(--s5);color:var(--t1);box-shadow:var(--shadow-sm)}
.cf-table{border-collapse:collapse;min-width:100%;font-size:12px;font-variant-numeric:tabular-nums}
.cf-table th{
  background:rgba(17,21,32,0.98);
  border-bottom:1px solid var(--brd);border-right:1px solid var(--brd);
  padding:9px 12px;white-space:nowrap;font-weight:600;color:var(--t2);
  text-align:right;position:sticky;top:0;z-index:10;font-size:11px;letter-spacing:.02em;
}
.cf-table th:first-child{
  text-align:left;position:sticky;left:0;z-index:20;
  background:rgba(22,27,39,0.98);min-width:190px;
}
.cf-table th.today-col{
  background:rgba(45,212,160,.1)!important;
  color:var(--acc)!important;
  border-bottom:2px solid var(--acc)!important;
}
.cf-table td{
  border-right:1px solid var(--brd);border-bottom:1px solid rgba(255,255,255,.025);
  padding:8px 12px;text-align:right;vertical-align:middle;white-space:nowrap;
  font-size:12px;
}
.cf-table td:first-child{
  text-align:left;position:sticky;left:0;z-index:5;
  background:rgba(13,16,24,0.97);
  border-right:1px solid var(--brd);font-weight:500;padding:8px 12px;
}
.cf-table tr:hover td{background:rgba(255,255,255,.018)}
.cf-table tr:hover td:first-child{background:rgba(17,21,32,0.98)}
th.we-col{opacity:.55}
td.we-col{background:rgba(240,101,101,.012)!important}
td.today-col{
  background:rgba(45,212,160,.025)!important;
  border-left:1px solid rgba(45,212,160,.1)!important;
  border-right:1px solid rgba(45,212,160,.1)!important;
}
td.danger{color:var(--red)!important;font-weight:700}
td.warning{color:var(--amber)!important;font-weight:600}
tr.row-income td:first-child{color:var(--grn);font-weight:500}
tr.row-expense td:first-child{color:var(--red);font-weight:500}
tr.row-tax td:first-child{color:var(--amber);font-weight:500}
tr.row-balance td{font-weight:700;font-size:13px}
tr.row-balance td.danger{background:rgba(240,101,101,.06)!important}
tr.row-balance td.warning{background:rgba(232,172,58,.05)!important}
tr.row-balance td:first-child{color:var(--acc);font-size:11px;background:var(--s3)!important}
tr.row-section td{
  background:var(--s3)!important;
  font-size:10px;font-weight:700;text-transform:uppercase;
  letter-spacing:.9px;color:var(--t3);padding:10px 12px 5px;
}
tr.row-section td:first-child{background:var(--s4)!important}
tr.row-total td{
  border-top:1px solid var(--brd2);font-weight:700;
  background:rgba(255,255,255,.018)!important;
}
tr.row-total td:first-child{background:var(--s3)!important;color:var(--t2)}
.val-pos{color:var(--grn)}.val-neg{color:var(--red)}.val-zero{color:var(--t4)}

/* ── MONTH NAV ── */
.month-nav{display:flex;align-items:center;gap:10px;margin-bottom:22px}
.mnav-btn{width:28px;height:28px;background:var(--s3);border:1px solid var(--brd);color:var(--t1);border-radius:7px;cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;line-height:1;padding:0;font-family:var(--f)}
.mnav-btn:hover{border-color:var(--brd2);background:var(--s4)}

.settings-section-title{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 18px;border-bottom:1px solid var(--brd);background:var(--s3);
}
.ss-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--t2)}
.ss-add-btn{
  background:var(--acc-d);border:1px solid rgba(45,212,160,.25);
  color:var(--acc);font-family:var(--f);font-size:12px;font-weight:600;
  padding:5px 12px;border-radius:6px;cursor:pointer;transition:all .12s;letter-spacing:.01em;
}
.ss-add-btn:hover{background:var(--acc-m)}

/* ── ITEM ROW ── */
.item-row{
  display:flex;align-items:center;gap:10px;padding:12px 18px;
  border-bottom:1px solid var(--brd);transition:background .1s;
}
.item-row:last-child{border-bottom:none}
.item-row:hover{background:rgba(255,255,255,.02)}
.item-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;cursor:pointer;transition:transform .1s}
.item-dot:hover{transform:scale(1.4)}
.item-dot-pvz{width:6px;height:6px;border-radius:50%;flex-shrink:0;cursor:pointer;transition:transform .1s;opacity:.6}
.item-dot-pvz:hover{transform:scale(1.4)}
.item-name{flex:1;font-size:13px;font-weight:500;color:var(--t1);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item-amount{font-size:13px;font-weight:600;min-width:90px;text-align:right;font-variant-numeric:tabular-nums}
.item-amount.inc{color:var(--grn)}.item-amount.exp{color:var(--red)}.item-amount.tax{color:var(--amber)}
.item-day-badge{
  background:var(--s3);border:1px solid var(--brd2);border-radius:6px;
  padding:3px 8px;font-size:11px;font-weight:600;color:var(--t2);white-space:nowrap;flex-shrink:0;
  cursor:pointer;transition:border-color .1s;
}
.item-day-badge:hover{border-color:var(--brd3);color:var(--t1)}
.item-repeat-badge{
  background:var(--plan-d);border:1px solid rgba(124,136,245,.2);border-radius:6px;
  padding:3px 8px;font-size:10px;font-weight:700;color:var(--plan);white-space:nowrap;flex-shrink:0;
  cursor:pointer;transition:all .1s;letter-spacing:.02em;text-transform:uppercase;
}
.item-repeat-badge:hover{background:rgba(124,136,245,.2)}
.item-edit{
  background:none;border:none;color:var(--t3);cursor:pointer;
  font-size:14px;padding:3px 7px;border-radius:6px;line-height:1;flex-shrink:0;
  font-family:var(--f);transition:all .1s;
}
.item-edit:hover{color:var(--t1);background:var(--s4)}
.auto-tag{
  background:var(--amber-d);border:1px solid rgba(232,172,58,.25);
  color:var(--amber);font-size:9px;font-weight:700;padding:2px 6px;border-radius:4px;
  white-space:nowrap;text-transform:uppercase;letter-spacing:.05em;
}

/* ── CAT HEADER ── */
.cat-header{
  display:flex;align-items:center;gap:8px;padding:11px 18px;
  cursor:pointer;user-select:none;border-bottom:1px solid var(--brd);
  position:relative;border-left:3px solid transparent;
  transition:background .12s;
}
.cat-header::before{
  content:'▶';font-size:8px;color:var(--t3);
  transition:transform .15s;flex-shrink:0;
}
.cat-header.collapsed::before{transform:rotate(0deg)}
.cat-header:not(.collapsed)::before{transform:rotate(90deg)}
.cat-header:hover{background:rgba(255,255,255,.02)}
.cat-header.inc{border-left-color:var(--grn)}
.cat-header.exp{border-left-color:var(--red)}
.cat-body{
  overflow:hidden;transition:max-height .2s ease;
  border-left:2px solid var(--brd);margin-left:16px;
}
.cat-body.collapsed{max-height:0!important;border-left-color:transparent}
.cat-body .item-row{padding-left:14px}

/* ── INLINE EDIT ── */
.ie-amt{
  background:var(--s4);border:1px solid var(--brd3);border-radius:5px;
  color:var(--t1);font-family:var(--f);font-size:inherit;
  width:85px;padding:2px 7px;outline:none;font-weight:600;text-align:right;
  font-variant-numeric:tabular-nums;
}
.ie-rep{
  background:var(--plan-d);border:1px solid rgba(124,136,245,.25);border-radius:5px;
  color:var(--plan);font-family:var(--f);font-size:10px;
  padding:2px 5px;outline:none;font-weight:700;text-transform:uppercase;
}
.ie-day{
  background:var(--s4);border:1px solid var(--brd3);border-radius:5px;
  color:var(--t1);font-family:var(--f);font-size:inherit;
  width:60px;padding:2px 6px;outline:none;font-weight:600;text-align:center;
}

/* ── TOGGLE ── */
.tg{position:relative;display:inline-block;width:40px;height:24px;flex-shrink:0;cursor:pointer}
.tg input{opacity:0;width:0;height:0}
.tg-s{position:absolute;inset:0;background:var(--s5);border-radius:12px;transition:.2s;border:1px solid var(--brd2)}
.tg-s::before{content:'';position:absolute;width:18px;height:18px;border-radius:50%;background:var(--t3);top:2px;left:2px;transition:.2s}
.tg input:checked+.tg-s{background:var(--acc-d);border-color:rgba(45,212,160,.3)}
.tg input:checked+.tg-s::before{background:var(--acc);transform:translateX(16px)}

/* ── MODAL ── */
.overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.65);
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  z-index:100;display:none;align-items:flex-end;justify-content:center;
}
.overlay.open{display:flex}
@media(min-width:600px){.overlay{align-items:center}}
.modal{
  background:var(--s2);border:1px solid var(--brd2);
  border-radius:20px 20px 0 0;width:100%;max-width:520px;
  padding:22px 22px 40px;max-height:92dvh;overflow-y:auto;
  box-shadow:0 -12px 60px rgba(0,0,0,.6),0 -2px 8px rgba(0,0,0,.4);
  position:relative;
}
.modal::before{
  content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,var(--brd2),transparent);
}
@media(min-width:600px){.modal{border-radius:16px;max-height:80vh}}
.mhandle{width:32px;height:3px;background:var(--s5);border-radius:2px;margin:0 auto 20px}
.mtitle{font-size:18px;font-weight:800;margin-bottom:20px;letter-spacing:-.2px}
.frow{margin-bottom:16px}
.flabel{display:block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--t3);margin-bottom:7px}
.finput,.fselect{
  width:100%;background:var(--s3);border:1.5px solid var(--brd);border-radius:10px;
  padding:12px 14px;color:var(--t1);font-family:var(--f);font-size:14px;
  outline:none;transition:border-color .15s,background .15s;-webkit-appearance:none;appearance:none;
}
.finput:focus,.fselect:focus{border-color:var(--acc);background:var(--s4)}
.finput::placeholder{color:var(--t3)}
.finput.small{font-size:13px;padding:9px 12px}
.frow-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mbtns{display:flex;gap:8px;margin-top:20px}
.mbtn{
  flex:1;padding:13px;border-radius:10px;border:1.5px solid var(--brd2);
  background:var(--s3);color:var(--t1);font-family:var(--f);
  font-size:14px;font-weight:600;cursor:pointer;transition:all .15s;letter-spacing:.01em;
}
.mbtn:hover{background:var(--s4);border-color:var(--brd3)}
.mbtn:active{opacity:.8}
.mbtn.ok{background:var(--acc-d);color:var(--acc);border-color:rgba(45,212,160,.3)}
.mbtn.ok:hover{background:var(--acc-m)}
.mbtn.danger{background:var(--red-d);color:var(--red);border-color:rgba(240,101,101,.2)}

/* ── COLOR SWATCHES ── */
.cswatches{display:flex;gap:8px;flex-wrap:wrap;padding:2px}
.csw{
  width:28px;height:28px;border-radius:50%;cursor:pointer;
  border:2.5px solid transparent;transition:transform .12s,border-color .12s;
  -webkit-tap-highlight-color:transparent;
}
.csw:hover{transform:scale(1.15)}
.csw.sel{border-color:rgba(255,255,255,.85);transform:scale(1.18)}

/* ── TOAST ── */
.toast{
  position:fixed;bottom:24px;left:50%;
  transform:translateX(-50%) translateY(16px);
  background:var(--s4);border:1px solid var(--brd3);border-radius:20px;
  padding:10px 22px;font-size:13px;font-weight:500;color:var(--t1);
  opacity:0;transition:all .22s;pointer-events:none;white-space:nowrap;z-index:300;
  box-shadow:var(--shadow-lg);letter-spacing:.01em;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ── LOADER ── */
.loader{
  position:fixed;inset:0;background:var(--bg);z-index:200;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
  transition:opacity .4s;
}
.loader.done{opacity:0;pointer-events:none}
.spin{
  width:36px;height:36px;border:2.5px solid var(--s4);
  border-top-color:var(--acc);border-radius:50%;animation:spin .7s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.loader-text{font-size:13px;color:var(--t3);font-weight:500;letter-spacing:.02em}

/* ── CALENDAR POPUP ── */
.cal-popup{
  background:var(--s4);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border:1px solid var(--brd2);border-radius:14px;padding:12px;
  width:220px;position:fixed;z-index:300;transform:translateX(-50%);
  box-shadow:var(--shadow-lg);
}
.cal-title{font-size:11px;font-weight:700;text-align:center;color:var(--t1);margin-bottom:8px;text-transform:uppercase;letter-spacing:.06em}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-wd{font-size:8px;font-weight:700;text-align:center;color:var(--t3);padding:3px 0;letter-spacing:.05em}
.cal-emp{height:0}
.cal-day{
  font-size:12px;font-weight:600;text-align:center;padding:6px 2px;
  border-radius:7px;cursor:pointer;color:var(--t2);transition:all .1s;
}
.cal-day:hover{background:var(--s5);color:var(--t1)}
.cal-day.sel{background:var(--acc);color:var(--bg);font-weight:800}

/* ── MOBILE ── */
@media(max-width:599px){
  body{font-size:13px}
  .cf-table{font-size:11px}
  .cf-table td{padding:7px 8px}
  .cf-table td:first-child{padding:7px 10px;min-width:130px}
  .cf-table th{padding:7px 8px}
  .cf-table th:first-child{min-width:130px}
  .kpi-grid{gap:8px;margin-bottom:18px;grid-template-columns:repeat(2,1fr)}
  .kpi{padding:12px 14px}.kpi-label{font-size:9px}.kpi-val{font-size:18px}
  .accounts-grid{gap:8px;margin-bottom:18px;grid-template-columns:repeat(2,1fr)}
  .acct-card{padding:12px 14px}.acct-val{font-size:17px}
  .item-row{padding:10px 14px;gap:8px}
  .item-name{font-size:12px}.item-amount{font-size:12px;min-width:70px}
  .settings-section{margin-bottom:14px}
  .settings-section-title{padding:11px 14px}
  .month-nav{gap:8px;margin-bottom:16px}.month-label{font-size:17px}
  .fm-val{font-size:24px}
  .free-money-bar{padding:14px 16px;margin-bottom:18px}
  .modal{padding:18px 16px 32px}
  .finput,.fselect{font-size:13px;padding:11px 12px}
  .topbar{padding:0 14px}
  .cf-wrap{margin-bottom:18px}
  .cat-header{padding:10px 14px}
  .cat-body{margin-left:12px}
}

::-webkit-scrollbar{width:4px;height:4px}

@media(max-width:768px){.tab-bar{display:flex}.logo,.nav-tabs{display:none!important}.topbar{padding:calc(env(safe-area-inset-top)+8px) 16px 8px;height:auto}.month-nav{display:flex!important;justify-content:flex-start;margin-bottom:16px!important}.view{padding-bottom:calc(58px + env(safe-area-inset-bottom) + 16px)!important}.kpi-grid{grid-template-columns:repeat(2,1fr)!important}}
::-webkit-scrollbar-track{background:transparent}

</style>
</head>

<script>
// ══════════════════════════════════
// SUPABASE
// ══════════════════════════════════
const SB='https://trmxmhdpyvdbsgxbvwxx.supabase.co';
const SK='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRybXhtaGRweXZkYnNneGJ2d3h4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA2NTE1MTQsImV4cCI6MjA5NjIyNzUxNH0.Llpg7iajdvMoT34_u7HIoirtyL1popMAsyD86O3oLoM';
const SH={'Content-Type':'application/json','apikey':SK,'Authorization':'Bearer '+SK};
const sGet=(t,q='')=>fetch(`${SB}/rest/v1/${t}?${q}`,{headers:SH}).then(r=>{if(!r.ok)throw r;return r.json();});
const sUp=(t,b)=>fetch(`${SB}/rest/v1/${t}`,{method:'POST',headers:{...SH,'Prefer':'resolution=merge-duplicates'},body:JSON.stringify(b)}).then(r=>{if(!r.ok)throw r;return r.status===204?null:r.json().catch(()=>null);});
const sDel=(t,q)=>fetch(`${SB}/rest/v1/${t}?${q}`,{method:'DELETE',headers:SH}).then(r=>{if(!r.ok)throw r;});
const sPat=(t,q,b)=>fetch(`${SB}/rest/v1/${t}?${q}`,{method:'PATCH',headers:{...SH,'Prefer':'return=minimal'},body:JSON.stringify(b)}).then(r=>{if(!r.ok)throw r;});

// ══════════════════════════════════
// CONSTANTS
// ══════════════════════════════════
const MONTHS=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const MONTHS_G=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const WD=['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
const COLORS=['#34d399','#4ade80','#60a5fa','#818cf8','#a78bfa','#f472b6','#fb923c','#fbbf24','#f87171','#38bdf8','#a3e635','#e879f9','#94a3b8','#67e8f9','#c084fc'];
const LS='kp_v1';

// ══════════════════════════════════
// STATE
// ══════════════════════════════════
// D = persistent data (saved to supabase + localStorage)
let D = {
  accounts:[],
  items:[],
  done:{},   // {"itemId":true} or {"itemId_2":true} for 2nd date
  settings:{taxRate:7, taxBase:'all'}
};
let curYear=new Date().getFullYear(), curMonth=new Date().getMonth();
let dbOk=false, editingId=null, modalType=null;
let selColor=COLORS[0];

// ══════════════════════════════════
// SYNC
// ══════════════════════════════════
function ss(st){
  const d=document.getElementById('sdot');
  d.className='sync-dot '+(st==='ok'?'ok':st==='sync'?'sync':'err');
}

// ══════════════════════════════════
// LOCALSTORAGE
// ══════════════════════════════════
function saveL(){try{localStorage.setItem(LS,JSON.stringify(D));}catch(e){}}
function loadL(){try{const d=JSON.parse(localStorage.getItem(LS)||'null');if(d)D=d;}catch(e){}}

// ══════════════════════════════════
// SUPABASE INIT — single JSON row
// ══════════════════════════════════
async function initApp(){
  setLT('Загрузка…');
  try{
    // Supabase — главный источник данных, загружаем первым
    const rows=await sGet('kp_data','key=eq.main&select=data');
    if(rows.length>0&&rows[0].data){
      const remote=rows[0].data;
      if(remote.accounts&&remote.accounts.length) D.accounts=remote.accounts;
      if(remote.items&&remote.items.length) D.items=remote.items;
      D.done=remote.done||{};
      D.settings=remote.settings||D.settings||{taxRate:7,taxBase:'all'};
    } else {
      // Supabase пуст — берём из localStorage как запасной вариант
      loadL();
    }
    dbOk=true; ss('ok'); saveL();
  }catch(e){
    // Supabase недоступен — берём из localStorage
    dbOk=false; ss('err');
    loadL();
    console.warn('DB:',e);
  }
  // seed defaults — только для новых пользователей
  if(!D.accounts.length) D.accounts=DEFAULT_ACCOUNTS;
  if(!D.items.length) D.items=DEFAULT_ITEMS;
  // migrate old single vvd to 3 separate items
  const oldIdx=D.items.findIndex(i=>i.id==='e_vvd');
  if(oldIdx>=0){
    const old=D.items[oldIdx];
    const amt=Math.round((Number(old.amount)||0)/3);
    D.items.splice(oldIdx,1,
      {id:'e_vvd1', type:'expense', categoryKey:'vvd', category:'Вывод себе (личное) 1', pvzAddr:null, amount:amt, day:1, repeat:'monthly', taxable:false, color:old.color||'#e879f9'},
      {id:'e_vvd2', type:'expense', categoryKey:'vvd', category:'Вывод себе (личное) 2', pvzAddr:null, amount:amt, day:10, repeat:'monthly', taxable:false, color:old.color||'#e879f9'},
      {id:'e_vvd3', type:'expense', categoryKey:'vvd', category:'Вывод себе (личное) 3', pvzAddr:null, amount:amt, day:20, repeat:'monthly', taxable:false, color:old.color||'#e879f9'}
    );
  }
  // migrate: rename ar category
  D.items.forEach(i=>{ if(i.categoryKey==='ar'&&i.category==='Аренда + коммуналка'){ i.category='Аренда'; } });
  // migrate: add Коммунальные платежи items if missing
  const hasKom=D.items.some(i=>i.categoryKey==='kom');
  if(!hasKom){
    const komItems=PVZ_LIST.map(p=>({
      id:'e_kom_'+p.key, type:'expense',
      categoryKey:'kom', category:'Коммунальные платежи',
      pvzAddr:p.key, amount:0, day:5,
      repeat:'monthly', taxable:false, color:p.color,
    }));
    // Insert after last ar item
    const lastArIdx=D.items.reduce((acc,it,i)=>it.categoryKey==='ar'?i:acc,-1);
    if(lastArIdx>=0) D.items.splice(lastArIdx+1,0,...komItems);
    else D.items.push(...komItems);
  }
  // migrate: add Управление items if missing
  const hasMgmt=D.items.some(i=>i.categoryKey==='mgmt');
  if(!hasMgmt){
    const mgmtItems=PVZ_LIST.map(p=>({
      id:'e_mgmt_'+p.key, type:'expense',
      categoryKey:'mgmt', category:'Управление',
      pvzAddr:p.key, amount:0, day:5,
      repeat:'monthly', taxable:false, color:p.color,
    }));
    const lastZpIdx=D.items.reduce((acc,it,i)=>it.categoryKey==='zp'?i:acc,-1);
    if(lastZpIdx>=0) D.items.splice(lastZpIdx+1,0,...mgmtItems);
    else D.items.push(...mgmtItems);
  }
  D.settings=D.settings||{taxRate:7,taxBase:'all'};
  saveL();
  // Пишем в Supabase ТОЛЬКО если были миграции (новые категории)
  const needsWrite=!hasKom||!hasMgmt||oldIdx>=0;
  if(dbOk&&needsWrite){try{await sUp('kp_data',[{key:'main',data:D}]);}catch(e){}}

  hideLoader(); renderAll();
  setInterval(trySync,45000);
}

async function pushData(){
  saveL(); // always save locally first
  if(!dbOk){
    // try to reconnect
    try{
      await sGet('kp_data','limit=1');
      dbOk=true;
    }catch(e){ ss('err'); return; }
  }
  ss('sync');
  try{
    await sUp('kp_data',[{key:'main',data:D}]);
    ss('ok');
  }catch(e){
    ss('err');
    dbOk=false;
    console.warn('pushData failed:',e);
  }
}

async function trySync(){
  if(dbOk)return;
  try{await sGet('kp_data','limit=1');dbOk=true;await pushData();}catch(e){}
}

// ══════════════════════════════════
// CASHFLOW LOGIC
// ══════════════════════════════════
function buildDailyCF(year,month,startOverride){
  const days=getDays(year,month);
  const taxRate=(D.settings.taxRate||7)/100;
  const taxBase=D.settings.taxBase||'all';

  // starting balance — use override if given, else current accounts sum
  const rawBalance=D.accounts.reduce((s,a)=>s+(Number(a.balance)||0),0);
  const startBalance=startOverride!==undefined?startOverride:rawBalance;

  // build day-level events
  const events={};
  for(let d=1;d<=days;d++)events[d]=[];

  // income items
  const now_=new Date(), cy_=now_.getFullYear(), cm_=now_.getMonth();
  const isCurMonth=(year===cy_&&month===cm_);
  const incomes=D.items.filter(i=>i.type==='income'&&(Number(i.amount)||0)>0);
  for(const item of incomes){
    const amt=Number(item.amount);
    const dlist=itemDays(item);
    for(let di=0;di<dlist.length;di++){
      const d0=dlist[di];
      // done key: first date = itemId, second date = itemId_2
      const doneKey=di===0?item.id:item.id+'_2';
      const isDone=isCurMonth&&D.done[doneKey];
      if(isDone) continue; // skip — already processed
      if(item.repeat==='weekly'){
        const refYear=item._refYear!==undefined?item._refYear:year;
        const refMonth=item._refMonth!==undefined?item._refMonth:month;
        const refDow=new Date(refYear,refMonth,d0).getDay();
        for(const d2 of weeklyDatesForDow(refDow,year,month)){
          if(isCurMonth&&D.done[weeklyDoneKey(item.id,d2)]) continue;
          events[d2].push({name:item.category,amount:amt,type:'income',color:item.color,id:item.id});
          if(item.taxable&&amt>0){
            const taxOk=taxBase==='all'||(taxBase==='pvz'&&item.pvzAddr)||(taxBase==='pvz_w'&&(item.pvzAddr||item.categoryKey==='w'));
            if(taxOk) events[d2].push({name:'Налог',amount:-Math.round(amt*taxRate),type:'tax',color:'#fbbf24',auto:true});
          }
        }
      } else if(item.repeat==='monthly'||item.repeat===undefined||item.repeat==='once'){
        const d=Math.min(d0,days);
        events[d].push({name:item.category,amount:amt,type:'income',color:item.color,id:item.id});
        if(item.taxable&&amt>0){
          const taxOk=taxBase==='all'||(taxBase==='pvz'&&item.pvzAddr)||(taxBase==='pvz_w'&&(item.pvzAddr||item.categoryKey==='w'));
          if(taxOk) events[d].push({name:'Налог',amount:-Math.round(amt*taxRate),type:'tax',color:'#fbbf24',auto:true});
        }
      }
    }
  }

  // compute total tax for KPI
  let taxableIncome=0;
  for(const item of incomes){
    if(!item.taxable)continue;
    if(taxBase==='pvz'&&!item.pvzAddr)continue;
    if(taxBase==='pvz_w'&&!item.pvzAddr&&item.categoryKey!=='w')continue;
    taxableIncome+=Number(item.amount)||0;
  }
  const taxAmount=Math.round(taxableIncome*taxRate);

  // expense items — salary is handled separately
  const expenses=D.items.filter(i=>i.type==='expense'&&(Number(i.amount)||0)>0&&i.categoryKey!=='zp');
  for(const item of expenses){
    const dlist=itemDays(item);
    for(let di=0;di<dlist.length;di++){
      const d0=dlist[di];
      const doneKey=di===0?item.id:item.id+'_2';
      const isDone=isCurMonth&&D.done[doneKey];
      if(isDone) continue;
      const d=Math.min(d0,days);
      if(item.repeat==='weekly'){
        const refYear=item._refYear!==undefined?item._refYear:year;
        const refMonth=item._refMonth!==undefined?item._refMonth:month;
        const refDow=new Date(refYear,refMonth,d0).getDay();
        for(const d2 of weeklyDatesForDow(refDow,year,month)){
          if(isCurMonth&&D.done[weeklyDoneKey(item.id,d2)]) continue;
          events[d2].push({name:item.category,amount:-Number(item.amount),type:'expense',color:item.color,id:item.id});
        }
      } else if(item.repeat==='monthly'||item.repeat===undefined||item.repeat==='once'){
        events[d].push({name:item.category,amount:-Number(item.amount),type:'expense',color:item.color,id:item.id});
      } else if(item.repeat==='quarterly'){
        events[d].push({name:item.category,amount:-Number(item.amount),type:'expense',color:item.color,id:item.id});
      }
    }
  }

  // salary: auto 5th & 20th from shiftCost
  const salaryItems=D.items.filter(i=>i.categoryKey==='zp'&&(Number(i.amount)||0)>0);
  if(salaryItems.length){
    let pm=month-1,py=year; if(pm<0){pm=11;py--;}
    const pmd=getDays(py,pm);
    const days5=pmd-15;
    const days20=15;
    for(const item of salaryItems){
      const sc=Number(item.amount)||0;
      const pvzName=(PVZ_LIST.find(p=>p.key===item.pvzAddr)||{}).name||item.pvzAddr||'';
      const d5=Math.min(5,days), d20=Math.min(20,days);
      const done1=isCurMonth&&D.done[item.id];
      const done2=isCurMonth&&D.done[item.id+'_2'];
      if(!done1&&d5<=days) events[d5].push({name:pvzName+' — аванс',amount:-Math.round(sc*days5),type:'expense',color:item.color,id:item.id});
      if(!done2&&d20<=days) events[d20].push({name:pvzName+' — зп',amount:-Math.round(sc*days20),type:'expense',color:item.color,id:item.id});
    }
  }

  // build daily running balance
  const daily=[];
  let balance=startBalance;
  for(let d=1;d<=days;d++){
    const dayEvents=events[d];
    let dayIncome=dayEvents.filter(e=>e.type==='income').reduce((s,e)=>s+e.amount,0);
    let dayExpense=dayEvents.filter(e=>e.type!=='income').reduce((s,e)=>s+e.amount,0);

    const dayNet=dayIncome+dayExpense;
    balance+=dayNet;
    daily.push({d,events:dayEvents,income:dayIncome,expense:dayExpense,net:dayNet,balance,we:isWe(year,month,d),tod:isToday(year,month,d)});
  }

  return {daily,startBalance:rawBalance,taxAmount,taxableIncome};
}

// Стартовый баланс для месяца:
// Текущий месяц — реальный баланс счетов (buildDailyCF считает с 1-го числа)
// Будущий месяц — итог предыдущего месяца
// Прошлое — не используется
function getMonthStartBalance(year,month){
  const now=new Date(), cy=now.getFullYear(), cm=now.getMonth();
  const current=D.accounts.reduce((s,a)=>s+(Number(a.balance)||0),0);

  if(year===cy&&month===cm) return current;

  if(year>cy||(year===cy&&month>cm)){
    // future: chain from current month
    let bal=current;
    let y=cy, m=cm;
    while(y<year||(y===year&&m<month)){
      const cf=buildDailyCF(y,m,bal);
      bal=cf.daily[cf.daily.length-1].balance;
      m++; if(m>11){m=0;y++;}
    }
    return bal;
  }

  // past month — return current (no history)
  return current;
}

// ══════════════════════════════════
// SAFE WITHDRAWAL CALC
// ══════════════════════════════════
// Сколько можно вывести прямо сейчас, не уйдя в минус ни в один день
// начиная с сегодня и на 12 месяцев вперёд.
// Учитывает тумблер paidToday так же как buildDailyCF.
function calcSafeWithdrawal(){
  const now=new Date();
  const cy=now.getFullYear(), cm=now.getMonth(), cd=now.getDate();
  const currentTotal=D.accounts.reduce((s,a)=>s+(Number(a.balance)||0),0);

  let minBalance=Infinity;
  let minMonth=cm, minYear=cy;

  // --- Текущий месяц ---
  // Стартуем с реального баланса. buildDailyCF пропускает done-строки,
  // поэтому учитываются только непроведённые операции — весь месяц целиком.
  {
    const cf = buildDailyCF(cy, cm, currentTotal);
    for(const day of cf.daily){
      if(day.balance < minBalance){ minBalance = day.balance; minMonth = cm; minYear = cy; }
    }
    var carryBal = cf.daily[cf.daily.length-1].balance;
  }

  // --- Следующие 12 месяцев ---
  let scanM = cm + 1, scanY = cy;
  if(scanM > 11){ scanM = 0; scanY++; }

  for(let i = 0; i < 12; i++){
    const cf = buildDailyCF(scanY, scanM, carryBal);
    for(const day of cf.daily){
      if(day.balance < minBalance){ minBalance = day.balance; minMonth = scanM; minYear = scanY; }
    }
    carryBal = cf.daily[cf.daily.length - 1].balance;
    scanM++; if(scanM > 11){ scanM = 0; scanY++; }
  }

  const buffer = Number(D.settings.safetyBuffer)||0;
  const safe = Math.max(0, Math.floor(minBalance) - buffer);
  return { safe, minBalance: Math.floor(minBalance), minMonth, minYear };
}

  document.getElementById('kpiGrid').innerHTML=[
    {label:'Текущий баланс',    val:fmtK(startBalance), cls:startBalance<0?'r':startBalance<50000?'am':'a'},

    {label:'Налог '+((D.settings.taxRate)||7)+'%', val:fmtK(taxAmount), cls:'am'},
    {label:'Остаток конец мес.', val:fmtK(endBalance),  cls:endBalance<0?'r':endBalance<30000?'am':'a'},
  ].map(k=>`<div class="kpi"><div class="kpi-label">${k.label}</div><div class="kpi-val ${k.cls}">${k.val}</div></div>`).join('');

  // Расчёт безопасного вывода
  const {safe, minBalance, minMonth, minYear} = calcSafeWithdrawal();
  const safeCls = safe <= 0 ? 'bad' : safe < 100000 ? 'warn' : 'ok';
  const minLabel = MONTHS[minMonth] + ' ' + minYear;
  const safeDesc = safe <= 0
    ? `⚠ Вывод невозможен — разрыв в ${minLabel} (мин. остаток ${fmt(minBalance)})`
    : `Узкое место: ${minLabel} — минимальный остаток ${fmt(minBalance)}`;

  document.getElementById('freeMoneyBar').innerHTML=`

function getOverdueItems(){
  const now=new Date(), cy=now.getFullYear(), cm=now.getMonth(), cd=now.getDate();
  const result=[];

  // Категории с групповым тумблером (toggleSvcDone) — показываем группой
  // Если хотя бы один просрочен в группе — одна строка на всю категорию
  const SVC_GROUP_CATS=['ye','dp','sl','yv'];
  const addedSvcCats=new Set();

  for(const item of D.items){
    if(!(Number(item.amount)||0)) continue;
    const isCurMonth=curYear===cy&&curMonth===cm;
    if(!isCurMonth) continue;

    const hasSvcTgl=SVC_GROUP_CATS.includes(item.categoryKey);

    if(item.repeat==='weekly'){
      const wdates=weeklyDates(item,cy,cm);
      wdates.forEach(d=>{
        if(d<=cd&&!D.done[weeklyDoneKey(item.id,d)]){
          result.push({item, date:d, key:weeklyDoneKey(item.id,d), label:d+' числа'});
        }
      });
    } else if(hasSvcTgl){
      // Для групповых категорий — проверяем все items группы
      // Добавляем одну строку на категорию если ещё не добавили
      if(addedSvcCats.has(item.categoryKey)) continue;
      const dlist=itemDays(item);
      const isOverdueAny=dlist.some((d,i)=>{
        const key=i===0?item.id:item.id+'_2';
        return d<=cd&&!D.done[key];
      });
      if(isOverdueAny){
        // Найти минимальную просроченную дату по всей категории
        const catItems=D.items.filter(x=>x.categoryKey===item.categoryKey&&(Number(x.amount)||0)>0);
        let minDate=cd;
        catItems.forEach(ci=>{
          itemDays(ci).forEach((d,i)=>{
            const k=i===0?ci.id:ci.id+'_2';
            if(d<=cd&&!D.done[k]&&d<minDate) minDate=d;
          });
        });
        // Создаём виртуальную групповую запись
        const svcIds=catItems.map(x=>x.id);
        const allDone=svcIds.every(id=>D.done[id]);
        result.push({
          item:{...item, pvzAddr:null},
          date:minDate,
          key:'__svc__'+item.categoryKey,
          label:minDate===cd?'сегодня':minDate+' числа',
          isSvcGroup:true,
          svcKey:item.categoryKey,
          svcIds,
          allDone,
        });
        addedSvcCats.add(item.categoryKey);
      }
    } else {
      const dlist=itemDays(item);
      dlist.forEach((d,i)=>{
        const key=i===0?item.id:item.id+'_2';
        if(d<=cd&&!D.done[key]){
          result.push({item, date:d, key, label:d+' числа'});
        }
      });
    }
  }

  // Sort: today first, then by date desc
  return result.sort((a,b)=>{
    const now2=new Date().getDate();
    if(a.date===now2&&b.date!==now2) return -1;
    if(b.date===now2&&a.date!==now2) return 1;
    return b.date-a.date;
  });
}

function renderOverdueDash(){
  const el=document.getElementById('overdueDash');
  if(!el) return;
  const items=getOverdueItems();
  if(!items.length){el.innerHTML='';return;}

  const now=new Date().getDate();
  let h=`<div class="overdue-dash">
    <div class="overdue-dash-title">
      <span>⚠ Требуют внимания</span>
      <div class="overdue-dash-count">${items.length}</div>
    </div>`;

  items.forEach((entry)=>{ const {item,date,key,label}=entry;
    const isToday2=date===now;
    const pvz=item.pvzAddr?PVZ_LIST.find(p=>p.key===item.pvzAddr):null;
    const catName=item.category||'';
    const pvzName=pvz?pvz.name:'';
    const isDone=entry.isSvcGroup?entry.allDone:!!D.done[key];

    // Для групповых категорий — сумма всех items группы
    let dispAmt, dispSign, dispAmtCls;
    if(entry.isSvcGroup){
      dispAmt=D.items.filter(x=>x.categoryKey===entry.svcKey&&(Number(x.amount)||0)>0).reduce((s,x)=>s+(Number(x.amount)||0),0);

    }

    const onchange=entry.isSvcGroup
      ? `toggleSvcDone('${entry.svcKey}')`
      : `toggleOverdueDone('${key}','${item.id}')`;

    h+=`<div class="overdue-item" onclick="showView('settings',document.querySelectorAll('.ntab')[1])">
      <div class="ov-dot" style="background:${item.color||'#94a3b8'}"></div>

        ${pvzName?`<div style="font-size:10px;color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px">${pvzName}</div>`:''}
        <div style="font-size:10px;color:${isToday2?'var(--acc)':'var(--amber)'};margin-top:1px;font-weight:600">${isToday2?'сегодня':label}</div>
      </div>
      <div style="font-size:12px;font-weight:700;${dispAmtCls};flex-shrink:0">${dispSign}${fmt(dispAmt)}</div>
      <div class="ov-tgl" onclick="event.stopPropagation()">
        <label class="tg"><input type="checkbox" ${isDone?'checked':''} onchange="${onchange}"><span class="tg-s"></span></label>
      </div>
    </div>`;
  });

  h+=`</div>`;
  el.innerHTML=h;
}

function renderForecast(){
  const el=document.getElementById('forecastContent');
  if(!el) return;

  // Update month label
  const fcLbl=document.getElementById('fcMonthLabel');
  if(fcLbl) fcLbl.textContent=MONTHS[curMonth]+' '+curYear;

  // Используем buildDailyCF с пустым done — все платежи включая ЗП со стоимостью смены
  const savedDone=D.done;
  D.done={};
  const fcf=buildDailyCF(curYear,curMonth,getMonthStartBalance(curYear,curMonth));
  D.done=savedDone;

  // Агрегируем по ПВЗ из событий CF
  const pvzMap={};
  PVZ_LIST.forEach(p=>{ pvzMap[p.key]={pvz:p,inc:0,exp:0}; });

  fcf.daily.forEach(day=>{
    day.events.forEach(ev=>{
      if(ev.auto) return;
      const item=D.items.find(i=>i.id===ev.id);
      if(!item) return;
      const pk=item.pvzAddr;
      if(pk&&pvzMap[pk]){
        if(ev.type==='income') pvzMap[pk].inc+=ev.amount;
        else if(ev.type==='expense') pvzMap[pk].exp+=Math.abs(ev.amount);
      }
    });
  });

  // Налог по каждому ПВЗ и сразу включаем в расходы
  const taxRate2=(D.settings.taxRate||7)/100;
  PVZ_LIST.forEach(p=>{
    let taxable=0;
    D.items.filter(i=>i.type==='income'&&i.pvzAddr===p.key&&i.taxable).forEach(i=>{
      const occ=i.repeat==='weekly'?weeklyDates(i,curYear,curMonth).length:itemDays(i).length;
      taxable+=(Number(i.amount)||0)*occ;
    });
    pvzMap[p.key].exp+=Math.round(taxable*taxRate2);
  });

  const pvzData=PVZ_LIST.map(p=>{
    const d=pvzMap[p.key];
    return {pvz:p, inc:Math.round(d.inc), exp:Math.round(d.exp), net:Math.round(d.inc-d.exp)};
  });

  // Вне ПВЗ
  const nonPvzTotals={}; // itemId → total for month
  let generalExp=0, otherInc=0;
  fcf.daily.forEach(day=>{
    day.events.forEach(ev=>{
      if(ev.auto) return;
      const item=D.items.find(i=>i.id===ev.id);
      if(!item||item.pvzAddr) return;
      nonPvzTotals[ev.id]=(nonPvzTotals[ev.id]||0)+ev.amount;
      if(ev.type==='income') otherInc+=ev.amount;
      else if(ev.type==='expense') generalExp+=Math.abs(ev.amount);
    });
  });
  otherInc=Math.round(otherInc); generalExp=Math.round(generalExp);

  // Налог на доходы вне ПВЗ — сразу включаем в расходы
  const taxBase2=D.settings.taxBase||'all';
  let nonPvzTaxable=0;
  D.items.filter(i=>i.type==='income'&&i.taxable&&!i.pvzAddr).forEach(i=>{
    if(taxBase2==='pvz') return;
    const occ=i.repeat==='weekly'?weeklyDates(i,curYear,curMonth).length:itemDays(i).length;
    nonPvzTaxable+=(Number(i.amount)||0)*occ;
  });
  generalExp+=Math.round(nonPvzTaxable*(D.settings.taxRate||7)/100);

  const totalInc=pvzData.reduce((s,p)=>s+p.inc,0)+otherInc;
  const totalExp=pvzData.reduce((s,p)=>s+p.exp,0)+generalExp;
  const net=totalInc-totalExp;
  const startBal=getMonthStartBalance(curYear,curMonth);

  // ── SUMMARY — компактная строка вместо карточек ──
  const finalNetReal=totalInc-totalExp;
  let h=`<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px">
    ${[
      {l:'Доходы', v:'+'+fmt(totalInc), c:'var(--grn)'},
      {l:'Расходы',v:'−'+fmt(totalExp), c:'var(--red)'},
      {l:'Итог',   v:(net>=0?'+':'')+fmt(Math.abs(net)), c:net>=0?'var(--acc)':'var(--red)'},
    ].map(k=>`<div style="background:var(--s2);border:1px solid var(--brd);border-radius:var(--rsm);padding:7px 12px;flex:1;min-width:80px">
      <div style="font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:var(--t3);margin-bottom:3px">${k.l}</div>
      <div style="font-size:13px;font-weight:800;color:${k.c};white-space:nowrap">${k.v}</div>
    </div>`).join('')}
  </div>`;

  // ── PVZ TABLE ──
  const pvzIncTotal=pvzData.reduce((s,p)=>s+p.inc,0);
  const pvzExpTotal=pvzData.reduce((s,p)=>s+p.exp,0);
  const pvzNet=pvzIncTotal-pvzExpTotal;

  h+=`<div style="overflow-x:auto;border-radius:var(--r);border:1px solid var(--brd);margin-bottom:12px">
  <table style="border-collapse:collapse;width:100%;min-width:360px">
    <thead><tr style="background:var(--s3);border-bottom:1px solid var(--brd)">
      <th style="text-align:left;padding:6px 10px;font-size:9px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.5px">ПВЗ</th>
      <th style="text-align:right;padding:6px 10px;font-size:9px;font-weight:700;color:var(--grn);text-transform:uppercase;letter-spacing:.5px;white-space:nowrap">Доходы</th>
      <th style="text-align:right;padding:6px 10px;font-size:9px;font-weight:700;color:var(--red);text-transform:uppercase;letter-spacing:.5px;white-space:nowrap">Расходы</th>
      <th style="text-align:right;padding:6px 10px;font-size:9px;font-weight:700;color:var(--acc);text-transform:uppercase;letter-spacing:.5px;white-space:nowrap">Итог</th>
    </tr></thead>
    <tbody>`;

  pvzData.forEach(({pvz,inc,exp,net:pnet},idx)=>{
    const nc=pnet>0?'var(--grn)':pnet<0?'var(--red)':'var(--t3)';
    const sg=pnet>0?'+':pnet<0?'−':'';
    const bg=idx%2===0?'var(--s2)':'rgba(255,255,255,.015)';
    h+=`<tr style="background:${bg};border-bottom:1px solid var(--brd)">
      <td style="padding:6px 10px">
        <div style="display:flex;align-items:center;gap:6px">
          <div style="width:6px;height:6px;border-radius:50%;background:${pvzGroup(pvz.key).color};flex-shrink:0"></div>
          <span style="font-size:11px;font-weight:500;color:var(--t1);white-space:nowrap">${pvz.name}</span>
        </div>
      </td>
      <td style="padding:6px 10px;text-align:right;font-size:11px;font-weight:600;color:${inc?'var(--grn)':'var(--t4)'};white-space:nowrap">${inc?'+'+fmt(inc):'—'}</td>
      <td style="padding:6px 10px;text-align:right;font-size:11px;font-weight:600;color:${exp?'var(--red)':'var(--t4)'};white-space:nowrap">${exp?'−'+fmt(exp):'—'}</td>
      <td style="padding:6px 10px;text-align:right;font-size:12px;font-weight:800;color:${nc};white-space:nowrap">${pnet!==0?sg+fmt(Math.abs(pnet)):'0₽'}</td>
    </tr>`;
  });

  h+=`<tr style="background:var(--s3);border-top:1px solid var(--brd2)">
    <td style="padding:6px 10px;font-size:10px;font-weight:700;color:var(--t2)">Итого</td>
    <td style="padding:6px 10px;text-align:right;font-size:11px;font-weight:700;color:var(--grn);white-space:nowrap">+${fmt(pvzIncTotal)}</td>
    <td style="padding:6px 10px;text-align:right;font-size:11px;font-weight:700;color:var(--red);white-space:nowrap">−${fmt(pvzExpTotal)}</td>
    <td style="padding:6px 10px;text-align:right;font-size:12px;font-weight:800;color:${pvzNet>=0?'var(--acc)':'var(--red)'};white-space:nowrap">${pvzNet>=0?'+':'−'}${fmt(Math.abs(pvzNet))}</td>
  </tr></tbody></table></div>`;

  // ── ВНЕ ПВЗ ──
  if(otherInc||generalExp){
    const nonPvzNet=otherInc-generalExp;
    h+=`<div style="background:var(--s2);border:1px solid var(--brd);border-radius:var(--r);overflow:hidden;margin-bottom:12px">
      <div style="display:flex;align-items:center;padding:7px 12px;background:var(--s3);border-bottom:1px solid var(--brd);gap:8px">
        <span style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--t2);flex:1">Вне ПВЗ</span>
        <span style="font-size:12px;font-weight:800;color:${nonPvzNet>=0?'var(--acc)':'var(--red)'}">${nonPvzNet>=0?'+':''}${fmt(nonPvzNet)}</span>
      </div>`;
    // По каждому item показываем сумму за месяц (с учётом повторений)
    const nonPvzItems=[...D.items.filter(i=>i.type==='income'&&!i.pvzAddr&&(Number(i.amount)||0)>0),
                       ...D.items.filter(i=>i.type==='expense'&&!i.pvzAddr&&(Number(i.amount)||0)>0)];
    nonPvzItems.sort((a,b)=>a.category.localeCompare(b.category));
    nonPvzItems.forEach(i=>{
      const total=Math.round(nonPvzTotals[i.id]||0);
      if(!total) return;
      const isInc=total>0;
      h+=`<div style="display:flex;align-items:center;gap:8px;padding:6px 12px;border-bottom:1px solid var(--brd)">
        <div style="width:5px;height:5px;border-radius:50%;background:${i.color};flex-shrink:0"></div>
        <div style="flex:1;font-size:11px;color:var(--t1)">${i.category}</div>
        <div style="font-size:11px;font-weight:600;color:${isInc?'var(--grn)':'var(--red)'}">${isInc?'+':'−'}${fmt(Math.abs(total))}</div>
      </div>`;
    });
    h+=`</div>`;
  }

  // ── ИТОГ ──
  h+=`<div style="background:var(--s2);border:1px solid ${finalNetReal>=0?'rgba(52,211,153,.3)':'rgba(248,113,113,.3)'};border-radius:var(--r);padding:12px 16px;display:flex;align-items:center;justify-content:space-between">

  el.innerHTML=h;
}

function renderFeed(){

  const sorted=[...daily].sort((a,b)=>isCur?b.d-a.d:a.d-b.d);
  const DOWS=['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
  let h='',any=false;
  for(const dd of sorted){
    const evs=dd.events.filter(e=>!e.auto); if(!evs.length) continue; any=true;

        <div style="flex:1;min-width:0"><div style="font-size:13px;font-weight:500;color:var(--t1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;${done?'text-decoration:line-through':''}">${name}</div>${ovd?'<div style="font-size:10px;color:var(--amber);margin-top:2px">Не проведено</div>':''}</div>
        <div style="font-size:13px;font-weight:700;color:${col};flex-shrink:0;margin-right:8px">${isInc?'+':'−'}${fmt(Math.abs(ev.amount))}</div>
        ${tgl}</div>`;
    }
    h+=`</div>`;
  }
  el.innerHTML=any?h:'<div style="padding:40px;text-align:center;color:var(--t3)">Нет операций</div>';
}

function inlineEditBalance(e, id){
  const valEl=document.getElementById('aval-'+id);
  if(!valEl||valEl.querySelector('input')) return;
  const a=D.accounts.find(x=>x.id===id); if(!a) return;
  const cur=Number(a.balance)||0;
  valEl.innerHTML=`<input class="acct-inline-input" type="number" value="${cur}" step="100">`;
  const inp=valEl.querySelector('input');
  inp.focus(); inp.select();
  const save=()=>{
    const v=parseFloat(inp.value)||0;
    a.balance=v;
    valEl.innerHTML=fmt(v)||'0₽';
    pushData();
    const msb=getMonthStartBalance(curYear,curMonth);
    renderKPI(msb); renderCashflow(msb); renderOverdueDash(); renderForecast();
    // update total card
    const total=D.accounts.reduce((s,ac)=>s+(Number(ac.balance)||0),0);
    const totEl=document.querySelector('.acct-val[style*="acc"]');
    if(totEl) totEl.textContent=fmt(total)||'0₽';
  };
  inp.addEventListener('blur',save);
  inp.addEventListener('keydown',ev=>{if(ev.key==='Enter')inp.blur();if(ev.key==='Escape'){valEl.innerHTML=fmt(cur)||'0₽';}});
  e.stopPropagation();
}

function renderCashflow(msb){
  const el=document.getElementById('calGrid');
  if(!el) return;
  const {daily}=buildDailyCF(curYear,curMonth,msb);
  const dayMap={};
  for(const d of daily){
    const tax=d.events.filter(e=>e.auto).reduce((s,e)=>s+Math.abs(e.amount),0);
    dayMap[d.d]={inc:d.income,exp:Math.abs(d.expense)+tax,bal:d.balance};
  }
  const now=new Date(),isCur=(curYear===now.getFullYear()&&curMonth===now.getMonth());
  const today=isCur?now.getDate():0;
  const days=getDays(curYear,curMonth);
  const firstDow=(new Date(curYear,curMonth,1).getDay()+6)%7;
  const DOW=['ПН','ВТ','СР','ЧТ','ПТ','СБ','ВС'];
  let h=DOW.map(d=>`<div class="cal-dow">${d}</div>`).join('');
  for(let i=0;i<firstDow;i++) h+=`<div class="cal-empty"></div>`;
  for(let day=1;day<=days;day++){
    const dm=dayMap[day]||{inc:0,exp:0,bal:0};
    const isToday=day===today;
    const cls=isToday?'today':dm.bal<0?'negative':'';
    const balCls=dm.bal<0?'neg':dm.bal<50000?'warn':'pos';
    const hasTx=dm.inc>0||dm.exp>0;
    h+=`<div class="cal-cell ${cls}" onclick="showDayDetail(${day})" style="cursor:pointer">
      <div class="cal-day">${day}</div>
      ${dm.inc>0?`<div class="cal-inc">+${fmt(dm.inc)}</div>`:''}
      ${dm.exp>0?`<div class="cal-exp">−${fmt(dm.exp)}</div>`:''}
      ${hasTx?`<div class="cal-bal ${balCls}">${fmt(dm.bal)}</div>`:''}
    </div>`;
  }
  const total=firstDow+days,rem=total%7===0?0:7-(total%7);
  for(let i=0;i<rem;i++) h+=`<div class="cal-empty"></div>`;
  el.innerHTML=h;
}

function subHead(label){
  return `<div style="padding:7px 16px 4px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--t3);background:var(--s3);border-bottom:1px solid var(--brd)">${label}</div>`;
}

function weeklyDatesForDow(refDow,targetYear,targetMonth){
  const mdays=getDays(targetYear,targetMonth);
  const firstDow=new Date(targetYear,targetMonth,1).getDay();
  let fd=1+((refDow-firstDow+7)%7);
  if(fd>mdays) return [];
  const out=[];
  for(let d=fd;d<=mdays;d+=7) out.push(d);
  return out;
}
function weeklyDates(item,year,month){
  const dlist=itemDays(item);
  const refYear=item._refYear!==undefined?item._refYear:curYear;
  const refMonth=item._refMonth!==undefined?item._refMonth:curMonth;
  const dates=[];
  for(const baseDay of dlist){
    const refDow=new Date(refYear,refMonth,baseDay).getDay();
    for(const d of weeklyDatesForDow(refDow,year,month)){
      if(!dates.includes(d)) dates.push(d);
    }
  }
  dates.sort((a,b)=>a-b);
  return dates;
}
function weeklyDoneKey(itemId,d){return itemId+'_d'+d;}

function isOverdue(item){
  // Only applies in current month, only if not done
  const now=new Date(), cy=now.getFullYear(), cm=now.getMonth(), cd=now.getDate();
  const isCurMonth=curYear===cy&&curMonth===cm;
  if(!isCurMonth) return false;
  if(item.repeat==='weekly'){
    return weeklyDates(item,cy,cm).some(d=>d<=cd&&!D.done[weeklyDoneKey(item.id,d)]);
  }
  const dlist=itemDays(item);
  const key0=item.id,key1=item.id+'_2';
  if(dlist.length>=2){
    const d0passed=dlist[0]<=cd,d1passed=dlist[1]<=cd;
    return (d0passed&&!D.done[key0])||(d1passed&&!D.done[key1]);
  }
  return dlist[0]<=cd&&!D.done[key0];
}

function isSvcOverdue(svcItems){
  return svcItems.some(i=>isOverdue(i));
}
function isCatOverdue(catItems){
  return catItems.some(i=>isOverdue(i));
}
function isGroupOverdue(groupPvzKeys, catItems){
  // Группа просрочена если хотя бы одна строка внутри просрочена
  return catItems
    .filter(i=>groupPvzKeys.includes(i.pvzAddr))
    .some(i=>isOverdue(i));
}

function buildWeeklySub(item){
  const wdates=weeklyDates(item,curYear,curMonth);
  const now2=new Date(),cd2=(curYear===now2.getFullYear()&&curMonth===now2.getMonth())?now2.getDate():32;
  let h=`<div class="weekly-sub" id="wsub_${item.id}">`;
  wdates.forEach(d=>{
    const dk=weeklyDoneKey(item.id,d);
    const isDone=!!D.done[dk], isOvd=d<cd2&&!isDone;
    h+=`<div class="weekly-row ${isDone?'done-w':isOvd?'overdue-w':''}">
      <span class="weekly-date">${d} числа</span>
      <label class="tg" style="flex-shrink:0"><input type="checkbox" ${isDone?'checked':''} onchange="toggleWeeklyDone('${item.id}',${d})"><span class="tg-s"></span></label>
    </div>`;
  });
  h+=`</div>`;
  return h;
}
function saveOpenState(){
  const state={cats:new Set(), pvzGroups:new Set()};
  document.querySelectorAll('.cat-header:not(.collapsed)').forEach(el=>{
    const key=el.dataset.catKey;
    if(key) state.cats.add(key);
  });
  document.querySelectorAll('.pvz-group-body.open').forEach(el=>{
    state.pvzGroups.add(el.id);
  });
  return state;
}

function restoreOpenState(state){
  document.querySelectorAll('.cat-header[data-cat-key]').forEach(el=>{
    const key=el.dataset.catKey;
    if(state.cats.has(key)){
      el.classList.remove('collapsed');
      const body=el.nextElementSibling;
      if(body&&body.classList.contains('cat-body')) body.classList.remove('collapsed');
    }
  });
  state.pvzGroups.forEach(id=>{
    const body=document.getElementById(id);
    if(body){
      body.classList.add('open');
      const header=body.previousElementSibling;
      if(header) header.classList.add('open');
    }
  });
}

// ── DUAL DATE CALENDAR POPUP ──
const DUAL_CAT = ['zp','mgmt','w'];

let _calItem = null; // item being edited via popup

function openDayCalPopup(anchorEl, item){
  closeDayCalPopup();
  _calItem = item;
  const sel = (item.days||[item.day||1]).map(Number).slice(0,2);

  const popup = document.createElement('div');
  popup.className = 'day-cal-popup';
  popup.style.cssText = `
    position:fixed;z-index:500;
    background:var(--s3);border:1px solid var(--brd2);border-radius:14px;
    padding:14px;width:240px;
    box-shadow:0 12px 40px rgba(0,0,0,.6);
  `;

  popup.innerHTML = renderDayCalContent(sel);

  // Position near the badge
  document.body.appendChild(popup);
  const rect = anchorEl.getBoundingClientRect();
  const pw = 240, ph = 280;
  let top = rect.bottom + 6;
  let left = rect.left;
  if(left + pw > window.innerWidth - 10) left = window.innerWidth - pw - 10;
  if(top + ph > window.innerHeight - 10) top = rect.top - ph - 6;
  popup.style.top = top + 'px';
  popup.style.left = left + 'px';
}

function renderDayCalContent(sel){
  sel = sel.map(Number);
  const maxSel=_calItem&&['zp','mgmt','w'].includes(_calItem.categoryKey)?2:1;
  let h = `<div style="font-size:11px;font-weight:700;color:var(--t2);text-align:center;margin-bottom:10px;text-transform:uppercase;letter-spacing:.6px">Выберите ${maxSel===1?'дату':'до 2 дат'}</div>`;
  h += `<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:3px">`;
  for(let d=1;d<=31;d++){
    const isSel = sel.includes(d);
    h += `<div onclick="toggleCalDay(${d})" style="
      font-size:12px;font-weight:600;text-align:center;padding:6px 2px;border-radius:7px;cursor:pointer;
      background:${isSel?'var(--acc)':'var(--s4)'};
      color:${isSel?'var(--bg)':'var(--t2)'};
      transition:all .1s;
    ">${d}</div>`;
  }
  h += `</div>`;
  const sorted = [...sel].sort((a,b)=>a-b);
  h += `<div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--brd);display:flex;align-items:center;justify-content:space-between">`;
  h += `<div style="font-size:13px;color:var(--t2)">`;
  if(sorted.length===0) h += `<span style="color:var(--t3)">не выбрано</span>`;
  else h += sorted.map(d=>`<strong style="color:var(--acc)">${d}</strong>`).join(', ') + ' <span style="color:var(--t3)">числа</span>';
  h += `</div>`;
  const ready=sel.length>=1;
  h += `<button onclick="${ready?'applyDayCal()':'closeDayCalPopup()'}" style="
    background:${ready?'var(--acc)':'var(--s5)'};
    border:none;border-radius:7px;padding:5px 10px;
    color:${ready?'var(--bg)':'var(--t3)'};
    font-family:var(--f);font-size:12px;font-weight:700;cursor:pointer;
  ">${ready?'Готово':'Закрыть'}</button>`;
  h += `</div>`;
  return h;
}

function toggleCalDay(d){
  if(!_calItem) return;
  let sel = (_calItem.days||[_calItem.day||1]).map(Number);
  const maxSel=_calItem.categoryKey&&['zp','mgmt','w'].includes(_calItem.categoryKey)?2:1;
  const idx = sel.indexOf(d);
  if(idx>=0){ sel.splice(idx,1); }
  else if(sel.length<maxSel){ sel.push(d); }
  else { sel = [sel[sel.length-1], d].slice(-maxSel); } // replace
  _calItem.days = sel; delete _calItem.day;
  if(_calItem.repeat==='weekly'){_calItem._refYear=curYear;_calItem._refMonth=curMonth;}
  // re-render popup content
  const popup = document.querySelector('.day-cal-popup');
  if(popup) popup.innerHTML = renderDayCalContent(sel);
  // save immediately on each click
  pushData(); const _st=saveOpenState(), _sy=window.scrollY; renderSettings(); restoreOpenState(_st); requestAnimationFrame(()=>window.scrollTo(0,_sy));
}

function applyDayCal(){
  if(!_calItem) return;
  if(_calItem.repeat==='weekly'){_calItem._refYear=curYear;_calItem._refMonth=curMonth;}
  closeDayCalPopup();
  pushData(); rerender();
}

function closeDayCalPopup(){
  const popup = document.querySelector('.day-cal-popup');
  if(popup) popup.remove();
  _calItem = null;
}

// Close popup on outside click
document.addEventListener('click', function(ev){
  const popup = document.querySelector('.day-cal-popup');
  if(popup && !popup.contains(ev.target) && !ev.target.closest('.item-day-badge[data-id]')){

}, true);

// Auto-reset done on 1st of each month at 01:00
function scheduleReset(){
  const now=new Date();
  const next=new Date(now.getFullYear(),now.getMonth()+1,1,1,0,0,0);
  const ms=next-now;
  setTimeout(()=>{
    D.done={}; pushData(); renderAll();
    scheduleReset();
  }, ms);
}
scheduleReset();

function toggleDayEv(key, day){
  if(D.done[key]) delete D.done[key]; else D.done[key]=true;
  pushData();
  const msb=getMonthStartBalance(curYear,curMonth);
  renderCashflow(msb); renderKPI(msb); renderOverdueDash();
  // Refresh the popup
  document.querySelector('.day-detail-overlay')?.remove();
  showDayDetail(day);
}

function showDayDetail(day){
  const msb=getMonthStartBalance(curYear,curMonth);
  const {daily}=buildDailyCF(curYear,curMonth,msb);
  const d=daily.find(x=>x.d===day);
  if(!d||!d.events.length){return;}

  const DOWS=['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
  const dow=DOWS[new Date(curYear,curMonth,day).getDay()];
  const balCls=d.balance<0?'color:var(--red)':d.balance<50000?'color:var(--amber)':'color:var(--acc)';

  let evHtml='';
  // Group: non-auto events first, then tax
  const evs=[...d.events.filter(e=>!e.auto),...d.events.filter(e=>e.auto)];
  evs.forEach(ev=>{
    const isInc=ev.type==='income';
    const isTax=ev.auto;
    const col=isTax?'var(--amber)':isInc?'var(--grn)':'var(--red)';
    const sign=isInc?'+':'−';
    const item=D.items.find(i=>i.id===ev.id);
    const pvz=item&&item.pvzAddr?PVZ_LIST.find(p=>p.key===item.pvzAddr):null;
    const name=isTax?`Налог УСН ${D.settings.taxRate||7}%`:(ev.name+(pvz?' — '+pvz.name:''));
    // Determine done key for this event
    let doneKey=null;
    if(!isTax&&ev.id){
      if(item&&item.repeat==='weekly') doneKey=weeklyDoneKey(ev.id,day);
      else doneKey=ev.id;
    }
    const isDone=doneKey?!!D.done[doneKey]:false;
    const doneBtn=doneKey?`<label class="tg" onclick="event.stopPropagation()" style="flex-shrink:0">
      <input type="checkbox" ${isDone?'checked':''} onchange="toggleDayEv('${doneKey}',${day})">
      <span class="tg-s"></span></label>`:'';
    evHtml+=`<div class="day-ev" style="${isDone?'opacity:.5;text-decoration:line-through':''}">
      <div class="day-ev-dot" style="background:${ev.color||col}"></div>
      <div class="day-ev-name">${name}</div>
      <div class="day-ev-amt" style="color:${col}">${sign}${fmt(Math.abs(ev.amount))}</div>
      ${doneBtn}
    </div>`;
  });

  const html=`<div class="day-detail-overlay" onclick="this.remove()">
    <div class="day-detail-panel" onclick="event.stopPropagation()">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px">
        <div class="day-detail-title">${day} ${MONTHS[curMonth]}, ${dow}</div>
        <button onclick="this.closest('.day-detail-overlay').remove()" style="background:none;border:none;color:var(--t3);font-size:20px;cursor:pointer;padding:0">✕</button>
      </div>
      <div class="day-detail-sub">Баланс: <span style="${balCls};font-weight:700">${fmt(d.balance)}</span></div>
      ${evHtml}
    </div>
  </div>`;
  const overlay=document.createElement('div');
  overlay.innerHTML=html;
  document.body.appendChild(overlay.firstElementChild);
}

function buildCP(){
  const el=document.getElementById('cpicker'); if(!el)return;
  el.innerHTML=COLORS.map(c=>`<div class="csw ${c===selColor?'sel':''}" style="background:${c}" onclick="pickC('${c}')"></div>`).join('');
}
function pickC(c){
  selColor=c;
  document.querySelectorAll('#cpicker .csw').forEach(s=>s.classList.toggle('sel',s.style.background===c||s.style.backgroundColor===c));
}

function saveAccount(){
  const name=document.getElementById('mName').value.trim();
  const balance=parseFloat(document.getElementById('mBalance').value)||0;
  if(!name){showToast('Введите название');return;}
  if(editingId){
    const a=D.accounts.find(x=>x.id===editingId);
    if(a){a.name=name;a.balance=balance;a.color=selColor;}
  } else {
    D.accounts.push({id:uid(),name,balance,color:selColor});
  }
  closeModal(); pushData(); rerender(); showToast('✓ Сохранено');
}

function saveItem(){
  const categoryKey=document.getElementById('mCategory').value;
  const otherCat=document.getElementById('mOtherCat')?.value.trim();
  const pvzAddr=document.getElementById('mPvzAddr').value||null;
  const amount=parseFloat(document.getElementById('mAmount').value)||0;
  const daysRaw=document.getElementById('mDay').value.trim();
  const days=categoryKey==='zp'?null:daysRaw.split(',').map(s=>parseInt(s.trim())).filter(n=>!isNaN(n)&&n>=1&&n<=31);
  const repeat=document.getElementById('mRepeat').value;
  const taxableEl=document.getElementById('mTaxable');
  const taxable=taxableEl?taxableEl.value==='1':false;

  let catName='', catKey='';
  if(categoryKey==='__other__'){
    if(!otherCat){showToast('Введите категорию');return;}
    catName=otherCat; catKey=otherCat.toLowerCase().replace(/[^a-zа-яё0-9]/g,'_');
  } else {
    const tp=modalType||'income';
    const list=tp==='income'?PVZ_SERVICES:EXP_CATS;
    const found=list.find(c=>c.key===categoryKey);
    if(found){catName=found.name;catKey=found.key;}
    else{catName=categoryKey;catKey=categoryKey;}
  }

  const itemData={category:catName,categoryKey:catKey,pvzAddr,amount,repeat,taxable,color:selColor};
  if(categoryKey==='zp'){itemData.days=null;itemData.day=null;}
  else if(days&&days.length) itemData.days=days;

  const tp=editingId?(D.items.find(x=>x.id===editingId)?.type||modalType):modalType;
  if(editingId){
    const it=D.items.find(x=>x.id===editingId);
    if(it){Object.assign(it,itemData); if(repeat==='weekly'){it._refYear=curYear;it._refMonth=curMonth;}else{delete it._refYear;delete it._refMonth;}}
  } else {
    const newItem={id:uid(),type:tp,...itemData};
    if(repeat==='weekly'){newItem._refYear=curYear;newItem._refMonth=curMonth;}
    D.items.push(newItem);
  }
  closeModal(); pushData(); rerender(); showToast('✓ Сохранено');
}

function delItem(cat,id){
  if(!confirm('Удалить?'))return;
  if(cat==='account')D.accounts=D.accounts.filter(x=>x.id!==id);
  else D.items=D.items.filter(x=>x.id!==id);
  closeModal(); pushData(); rerender(); showToast('Удалено');
}

function rerender(){
  const _st=saveOpenState(), _sy=window.scrollY;
  renderAll();
  restoreOpenState(_st);
  // disable CSS transitions on restored groups so height is immediate
  document.querySelectorAll('.pvz-group-body.open, .cat-body:not(.collapsed)').forEach(el=>{el.style.transition='none';});
  window.scrollTo(0,_sy);
  // re-enable transitions after layout settles
  requestAnimationFrame(()=>{document.querySelectorAll('.pvz-group-body, .cat-body').forEach(el=>{el.style.transition='';});});
}
function closeModal(){document.getElementById('itemModal').classList.remove('open');}
document.getElementById('itemModal').addEventListener('click',e=>{if(e.target===document.getElementById('itemModal'))closeModal();});

// ══════════════════════════════════
// TAX SETTINGS
// ══════════════════════════════════
function saveTaxRate(){D.settings.taxRate=parseFloat(document.getElementById('taxRate').value)||7;pushData();rerender();}
function saveTaxBase(){D.settings.taxBase=document.getElementById('taxBase').value;pushData();rerender();}

function togglePaid(){D.settings.paidToday=document.getElementById('paidToday').checked;pushData();rerender();}

// ══════════════════════════════════
// NAV
// ══════════════════════════════════
function showView(id,btn){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.querySelectorAll('.tbb,.ntab').forEach(b=>b.classList.remove('active'));
  document.getElementById('view-'+id).classList.add('active');
  ['tbb-','dtbb-'].forEach(p=>{const b=document.getElementById(p+id);if(b)b.classList.add('active');});
  if(id==='forecast') renderForecast();
  if(id==='feed') renderFeed();
}
function chMonth(d){
  const _sy=window.scrollY;
  curMonth+=d;
  if(curMonth>11){curMonth=0;curYear++;}
  if(curMonth<0){curMonth=11;curYear--;}
  renderAll();
  renderForecast();
  requestAnimationFrame(()=>window.scrollTo(0,_sy));
}
function chFcMonth(d){
  chMonth(d);
}

// ══════════════════════════════════
// INIT
// ══════════════════════════════════
initApp();
</script>
